<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse — Teste de rede do Auth</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px;color:#172033}pre{white-space:pre-wrap;background:#f4f5f7;padding:16px;border-radius:10px}button{padding:12px 16px;border:0;border-radius:8px;background:#e51b67;color:#fff;font-weight:700}button:disabled{opacity:.55}</style><h1>Pulse — teste de rede do Auth</h1><p>Teste sem usar senha real. Cada chamada tem timeout de 5 segundos e o botão permanece disponível.</p><button id="run">Executar diagnóstico</button><pre id="out">Aguardando. Clique em “Executar diagnóstico”.</pre><script src="./pulse-config.js"></script><script>(()=>{const o=document.getElementById('out'),b=document.getElementById('run'),cfg=window.PULSE_SUPABASE_CONFIG||{};const legacy='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZnV5Z25wZ3l3ZnBpcXhzZnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTA5MjcsImV4cCI6MjEwNDEyNjkyN30.A4jnBQ_buy13_t8SZz2gM14ogNp6gi9tmtarIoRXHz8';const timeout=5000;const req=async(url,opt={})=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(t)}};const run=async()=>{b.disabled=true;o.textContent='Iniciando…\norigin: '+location.origin+'\nua: '+navigator.userAgent+'\nSupabase URL: '+cfg.url;for(const [name,key] of [['publishable',cfg.anonKey],['legacy-anon',legacy]]){try{const r=await req(cfg.url+'/auth/v1/settings',{headers:{apikey:key},cache:'no-store'});await r.text();o.textContent+='\n'+name+' GET settings → HTTP '+r.status}catch(e){o.textContent+='\n'+name+' GET settings → '+(e.name==='AbortError'?'TIMEOUT (5s)':('TRANSPORTE: '+e.name+' / '+e.message))}try{const r=await req(cfg.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:'diagnostic-invalid@example.invalid',password:'diagnostic-invalid-password'}),cache:'no-store'});const text=await r.text();o.textContent+='\n'+name+' POST token → HTTP '+r.status+' | '+text.slice(0,180)}catch(e){o.textContent+='\n'+name+' POST token → '+(e.name==='AbortError'?'TIMEOUT (5s)':('TRANSPORTE: '+e.name+' / '+e.message))}}o.textContent+='\n\nFIM.\nHTTP 400 no POST = navegador chegou ao Auth.\nTIMEOUT/TRANSPORTE = bloqueio ou falha no caminho navegador → Supabase.\nGET OK + POST falha = investigar POST/preflight.';b.disabled=false};b.onclick=run})()</script></html>
