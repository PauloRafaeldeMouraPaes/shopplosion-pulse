<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse — Teste de rede do Auth</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px;color:#172033}pre{white-space:pre-wrap;background:#f4f5f7;padding:16px;border-radius:10px}button{padding:12px 16px;border:0;border-radius:8px;background:#e51b67;color:#fff;font-weight:700}</style><h1>Pulse — teste de rede do Auth</h1><p>Teste sem usar senha real. Compara a chave publishable com a chave anon legada e registra exatamente onde a requisição falha.</p><button id="run">Executar</button><pre id="out">Aguardando…</pre><script src="./pulse-config.js"></script><script>(async()=>{const o=document.getElementById('out'),b=document.getElementById('run'),log=x=>o.textContent+='\n'+x;const cfg=window.PULSE_SUPABASE_CONFIG||{};const legacy='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZnV5Z25wZ3l3ZnBpcXhzZnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTA5MjcsImV4cCI6MjEwNDEyNjkyN30.A4jnBQ_buy13_t8SZz2gM14ogNp6gi9tmtarIoRXHz8';const run=async()=>{o.textContent='Iniciando…';b.disabled=true;log('origin: '+location.origin);log('ua: '+navigator.userAgent);log('Supabase URL: '+cfg.url);for(const [name,key] of [['publishable',cfg.anonKey],['legacy-anon',legacy]]){try{const r=await fetch(cfg.url+'/auth/v1/settings',{headers:{apikey:key},cache:'no-store'});log(name+' GET settings → HTTP '+r.status);await r.text()}catch(e){log(name+' GET settings → TRANSPORTE: '+e.name+' / '+e.message)}try{const r=await fetch(cfg.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:'diagnostic-invalid@example.invalid',password:'diagnostic-invalid-password'}),cache:'no-store'});const text=await r.text();log(name+' POST token → HTTP '+r.status+' | '+text.slice(0,180))}catch(e){log(name+' POST token → TRANSPORTE: '+e.name+' / '+e.message)}}log('FIM. Se ambos GETs funcionarem e ambos POSTs retornarem 400, transporte/CORS está OK e o problema deve ser específico do fluxo de login/sessão. Se GET funcionar e POST falhar, há bloqueio específico de POST/preflight.');b.disabled=false};b.onclick=run;run()})();</script></html>
