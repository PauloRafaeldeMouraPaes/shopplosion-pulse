<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse — Diagnóstico de autenticação</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;color:#172033}pre{white-space:pre-wrap;background:#f4f5f7;padding:16px;border-radius:10px}button{padding:12px 16px;border:0;border-radius:8px;background:#e51b67;color:#fff;font-weight:700}</style><h1>Diagnóstico de autenticação do Pulse</h1><p>Esta página testa apenas a comunicação do navegador com o Supabase. Nenhuma senha real é usada.</p><button id="run">Executar diagnóstico</button><pre id="out">Aguardando…</pre><script src="./pulse-config.js"></script><script>(async()=>{const out=document.getElementById('out'),run=document.getElementById('run');const log=x=>out.textContent+=`\n${x}`;const test=async()=>{out.textContent='Iniciando…';run.disabled=true;const cfg=window.PULSE_SUPABASE_CONFIG||{};if(!cfg.url||!cfg.anonKey){log('ERRO: configuração do Supabase ausente.');run.disabled=false;return}log('URL: '+cfg.url);try{const r=await fetch(cfg.url+'/auth/v1/settings',{cache:'no-store'});log('GET /auth/v1/settings → HTTP '+r.status);log('Resposta: '+(await r.text()).slice(0,300))}catch(e){log('GET /auth/v1/settings → FALHA DE TRANSPORTE: '+(e.name||'')+' / '+(e.message||''));run.disabled=false;return}try{const r=await fetch(cfg.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.anonKey},body:JSON.stringify({email:'diagnostic-invalid@example.invalid',password:'diagnostic-invalid-password'}),cache:'no-store'});log('POST /auth/v1/token → HTTP '+r.status);log('Resposta: '+(await r.text()).slice(0,500));log(r.status>=400&&r.status<500?'CONCLUSÃO: Supabase Auth está acessível pelo navegador; o problema não é DNS/CORS/transporte.':'CONCLUSÃO: resposta inesperada; investigar endpoint.') }catch(e){log('POST /auth/v1/token → FALHA DE TRANSPORTE: '+(e.name||'')+' / '+(e.message||''));log('CONCLUSÃO: o navegador não está conseguindo completar a comunicação com o Auth.')}run.disabled=false};run.onclick=test;test()})();</script></html>
