g:5px 8px;border-radius:var(--radius-chip);background:var(--surface-app);color:var(--ink-2)}.conf{background:var(--brand-soft);color:var(--brand-pulse-strong)}.card h3{margin:11px 0 8px;font-size:16px}.card p{line-height:1.55;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.cell{padding:12px;background:var(--surface-app);border-radius:var(--radius-card)}.cell strong{display:block;font-size:11px;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}.cell span{font-size:12px;line-height:1.45}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-1);font-size:11px;color:var(--ink-2)}.foot a{color:var(--brand-pulse-strong);font-weight:800;text-decoration:none}.empty{padding:30px;text-align:center;background:var(--surface-app);border-radius:var(--radius-card);color:var(--ink-2)}@media(max-width:800px){header{padding:12px 16px}.wrap{width:calc(100% - 20px);margin-top:16px}.hero,.panel{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.filters,.grid{grid-template-columns:1fr}.foot{display:block}.foot a{display:block;margin-top:8px}}:focus-visible{outline:2px solid var(--brand-pulse-strong);outline-offset:2px}

</style><link rel="stylesheet" href="./pulse-workspace-v3.css?v=20260922.08"><style>body.pv3-active>header:not(.pv4-top){display:none!important}body.pv3-active .wrap{width:auto;max-width:none;margin:86px 30px 60px 270px}body.pv3-active .hero,body.pv3-active .panel{box-shadow:none}@media(max-width:1023px){body.pv3-active .wrap{margin-left:94px;margin-right:20px}}@media(max-width:640px){body.pv3-active .wrap{margin:76px 12px 40px}.pv4-rail{display:none!important}}</style></head><body><header><div class="brand">SHOPPLOSION PULSE</div><nav class="nav"><a href="./index.html?v=20260922.08">Universo Pulse</a><a class="active" href="./base.html?v=20260922.08">Base</a><a href="./app.html?v=20260922.08">Minha indústria</a><a href="./ask.html?v=20260922.08">Investigação</a><a href="./app.html?v=20260922.08#analyses">Análises</a></nav></header><main class="wrap"><section class="hero"><div class="eyebrow">Base de evidências</div><h1>Acervo Pulse</h1><p class="muted">Acervo público independente da área privada da sua indústria.</p><div class="update">Atualização de mercado: 21/09/2026 · novos dados de preço, consumo, varejo e canal.</div><p><a href="./app.html?v=20260922.08" style="display:inline-block;margin-top:10px;padding:10px 14px;border-radius:var(--radius-card);background:var(--brand-soft);color:var(--brand-pulse-strong);font-weight:800;text-decoration:none">Minha indústria →</a></p><div id="stats" class="stats"></div></section><section class="panel" style="margin-top:18px"><div class="filters"><input id="search" name="search" aria-label="Buscar na base" autocomplete="off" type="search" placeholder="Buscar fatos, fontes, categorias, períodos..."><select id="category" name="category" aria-label="Filtrar por categoria" autocomplete="off"><option value="">Todas as categorias</option></select><select id="confidence" name="confidence" aria-label="Filtrar por confiança" autocomplete="off"><option value="">Todas as confianças</option><option>ALTA</option><option>MÉDIA</option><option>BAIXA</option></select></div><div id="list"><div class="empty">Carregando acervo...</div></div></section></main><script src="./pulse-public-evidence.js?v=20260922.08"></script><script src="./pulse-market-updates-20260921.js?v=20260922.08"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const $=id=>document.getElementById(id),stats=$('stats'),list=$('list'),search=$('search'),category=$('category'),confidence=$('confidence');const base=Array.isArray(window.PULSE_EVIDENCE)?window.PULSE_EVIDENCE:[],updates=Array.isArray(window.PULSE_MARKET_UPDATES)?window.PULSE_MARKET_UPDATES:[],items=[...base,...updates],cats=[...new Set(items.map(x=>x.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));category.innerHTML='<option value="">Todas as categorias</option>'+cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');function render(){const q=search.value.trim().toLowerCase(),cat=category.value,conf=confidence.value,filtered=items.filter(x=>{const hay=[x.id,x.tipo,x.fato,x.contexto,x.interpretacao,x.hipotese,x.acao,x.fonte,x.periodo,x.categoria].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!cat||x.categoria===cat)&&(!conf||x.confianca===conf)});stats.innerHTML='<div class="stat"><strong>'+items.length+'</strong><span>Evidências</span></div><div class="stat"><strong>'+new Set(items.map(x=>x.fonte)).size+'</strong><span>Fontes</span></div><div class="stat"><strong>'+cats.length+'</strong><span>Categorias</span></div><div class="stat"><strong>'+filtered.length+'</strong><span>Encontradas</span></div>';list.innerHTML=filtered.length?filtered.map(x=>'<article class="card"><div class="top"><span class="tag">'+esc(x.categoria||'geral')+'</span><span class="conf">'+esc(x.confianca||': ')+'</span><span class="tag">'+esc(x.tipo||'evidência')+'</span></div><h3>'+esc(x.fato||x.title||'Evidência')+'</h3><p><strong>Contexto:</strong> '+esc(x.contexto||': ')+'</p><div class="grid"><div class="cell"><strong>Interpretação</strong><span>'+esc(x.interpretacao||': ')+'</span></div><div class="cell"><strong>Hipótese</strong><span>'+esc(x.hipotese||': ')+'</span></div><div class="cell"><strong>Ação</strong><span>'+esc(x.acao||': ')+'</span></div></div><div class="foot"><span>'+esc(x.fonte||'Fonte não informada')+' · '+esc(x.periodo||'Período não informado')+'</span>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Fonte original ↗</a>':'')+'</div></article>').join(''):'<div class="empty">Nenhuma evidência corresponde aos filtros.</div>'}search.oninput=render;category.onchange=render;confidence.onchange=render;render();</script><script src="./pulse-workspace-v3.js?v=20260922.08"></script></body></html>
