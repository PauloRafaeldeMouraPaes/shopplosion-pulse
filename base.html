</select><select id="confidence"><option value="">Todas as confianças</option><option>ALTA</option><option>MÉDIA</option><option>BAIXA</option></select></div><div id="list"><div class="empty">Carregando acervo...</div></div></section></main><script src="./pulse-public-evidence.js?v=20260921.24"></script><script src="./pulse-market-updates-20260921.js?v=20260921.24"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const $=id=>document.getElementById(id),stats=$('stats'),list=$('list'),search=$('search'),category=$('category'),confidence=$('confidence');const base=Array.isArray(window.PULSE_EVIDENCE)?window.PULSE_EVIDENCE:[],updates=Array.isArray(window.PULSE_MARKET_UPDATES)?window.PULSE_MARKET_UPDATES:[],items=[...base,...updates],cats=[...new Set(items.map(x=>x.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));category.innerHTML='<option value="">Todas as categorias</option>'+cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');function render(){const q=search.value.trim().toLowerCase(),cat=category.value,conf=confidence.value,filtered=items.filter(x=>{const hay=[x.id,x.tipo,x.fato,x.contexto,x.interpretacao,x.hipotese,x.acao,x.fonte,x.periodo,x.categoria].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!cat||x.categoria===cat)&&(!conf||x.confianca===conf)});stats.innerHTML='<div class="stat"><strong>'+items.length+'</strong><span>Evidências</span></div><div class="stat"><strong>'+new Set(items.map(x=>x.fonte)).size+'</strong><span>Fontes</span></div><div class="stat"><strong>'+cats.length+'</strong><span>Categorias</span></div><div class="stat"><strong>'+filtered.length+'</strong><span>Encontradas</span></div>';list.innerHTML=filtered.length?filtered.map(x=>'<article class="card"><div class="top"><span class="tag">'+esc(x.categoria||'geral')+'</span><span class="conf">'+esc(x.confianca||'—')+'</span><span class="tag">'+esc(x.tipo||'evidência')+'</span></div><h3>'+esc(x.fato||x.title||'Evidência')+'</h3><p><strong>Contexto:</strong> '+esc(x.contexto||'—')+'</p><div class="grid"><div class="cell"><strong>Interpretação</strong><span>'+esc(x.interpretacao||'—')+'</span></div><div class="cell"><strong>Hipótese</strong><span>'+esc(x.hipotese||'—')+'</span></div><div class="cell"><strong>Ação</strong><span>'+esc(x.acao||'—')+'</span></div></div><div class="foot"><span>'+esc(x.fonte||'Fonte não informada')+' · '+esc(x.periodo||'Período não informado')+'</span>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Fonte original ↗</a>':'')+'</div></article>').join(''):'<div class="empty">Nenhuma evidência corresponde aos filtros.</div>'}search.oninput=render;category.onchange=render;confidence.onchange=render;render();</script></body></html>
