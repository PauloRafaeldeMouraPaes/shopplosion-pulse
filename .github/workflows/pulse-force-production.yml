name: Pulse Force Production Publish

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == 'PULSE_FORCE_PRODUCTION_PUBLISH' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate production index before deployment
        shell: bash
        run: |
          test -f index.html
          grep -q 'class="app"' index.html
          ! grep -q 'class="layout"' index.html
          grep -q 'Pulse — Brasil Market Intelligence' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload exact repository artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live production artifact
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          body=""
          for i in {1..12}; do
            body="$(curl -fsSL --retry 2 --retry-delay 2 -A 'Pulse-Production-Healthcheck/1.0' "$base/")" && break || sleep 5
          done
          test -n "$body"
          printf '%s' "$body" | grep -q 'class="app"'
          ! printf '%s' "$body" | grep -q 'class="layout"'
          printf '%s' "$body" | grep -q 'Pulse — Brasil Market Intelligence'
      - name: Write deployment proof
        shell: python
        run: |
          import json
          from pathlib import Path
          Path("pulse-production-proof.json").write_text(json.dumps({
            "status":"PASS",
            "release_sha":"${{ github.sha }}",
            "workflow_run_id":int("${{ github.run_id }}"),
            "page_url":"${{ steps.deployment.outputs.page_url }}",
            "checks":{
              "repository_index_has_new_workspace":True,
              "repository_index_has_no_legacy_layout":True,
              "live_index_has_new_workspace":True,
              "live_index_has_no_legacy_layout":True
            }
          },indent=2)+"\n",encoding="utf-8")
      - name: Commit deployment proof
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pulse-production-proof.json
          git commit -m 'chore: record verified Pulse production publish'
          git push origin HEAD:main
