name: Pulse Visual Shell Fixer

on:
  push:
    branches: ["design/pulse-visual-shell"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/pulse-visual-shell
          fetch-depth: 1
      - name: Fix visual shell placement and structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='<style id="pulse-visual-shell-v1">'
          payload=''
          if marker in t:
              start=t.index(marker); end=t.index('</script>',start)+len('</script>')
              payload=t[start:end].replace('id="pulse-visual-shell-v1"','id="pulse-visual-shell-v2"').replace('id="pulse-visual-shell-v1-script"','id="pulse-visual-shell-v2-script"')
              payload=re.sub(r'<script id="pulse-visual-shell-v2-script">.*?</script>','',payload,flags=re.S|re.I)
              t=t[:start].rstrip()+"\n"
          t=re.sub(r'<style id="pulse-visual-shell-v2">.*?</style>','',t,flags=re.S|re.I)
          t=re.sub(r'<script id="pulse-visual-shell-v2-script">.*?</script>','',t,flags=re.S|re.I)
          note=r'<([A-Za-z][\w:-]*)\b[^>]*\bclass=(?:"[^\"]*\bbrand-note\b[^\"]*"|\'[^\']*\bbrand-note\b[^\']*\')[^>]*>.*?</\1>\s*'
          t=re.sub(note,'',t,flags=re.S|re.I)
          t=re.sub(r'\.brand-framework(?:::after|:after)\s*\{[^}]*\}','',t,flags=re.S|re.I)
          def cf(m): return '.brand-framework{'+re.sub(r'background(?:-image)?\s*:\s*radial-gradient\([^;]*\)\s*;?','',m.group(1),flags=re.I)+'}'
          t=re.sub(r'\.brand-framework\s*\{([^}]*)\}',cf,t,flags=re.S|re.I)
          def cs(m): return '.brand-hero-visual .yellow-shape{'+re.sub(r'border-radius\s*:[^;]+;','border-radius:0;',m.group(1),count=1,flags=re.I)+'}'
          t=re.sub(r'\.brand-hero-visual\s+\.yellow-shape\s*\{([^}]*)\}',cs,t,flags=re.S|re.I)
          nav='''<aside class="pulse-shell-sidebar" data-pulse-shell="visual-v2" aria-label="Navegação principal"><div class="pulse-shell-brand"><span class="pulse-shell-brand-mark" aria-hidden="true">P</span><span>Pulse</span></div><nav class="pulse-shell-nav"><button type="button" aria-label="Ir para Dashboard" data-shell-route="dashboard">Dashboard</button><button type="button" aria-label="Ir para Ask AI" data-shell-route="ask">Ask AI</button><button type="button" aria-label="Ir para Intelligence" data-shell-route="intelligence">Intelligence</button><button type="button" aria-label="Ir para Sources" data-shell-route="sources">Sources</button></nav></aside><div class="pulse-shell-topbar" aria-label="Contexto atual"><div class="pulse-shell-breadcrumb"><span>Pulse</span><span aria-hidden="true">/</span><strong data-pulse-breadcrumb-current>Dashboard</strong></div></div>'''
          t=re.sub(r'<aside class="pulse-shell-sidebar".*?</aside>','',t,flags=re.S|re.I)
          t=re.sub(r'<div class="pulse-shell-topbar".*?</div>\s*</div>','',t,flags=re.S|re.I)
          b=t.lower().find('<body'); close=t.find('>',b)
          if b<0 or close<0: raise SystemExit('body tag not found')
          t=t[:close+1]+nav+t[close+1:]
          if payload:
              h=t.lower().find('</head>')
              if h<0: raise SystemExit('head close not found')
              t=t[:h]+payload+t[h:]
          css='''<style id="pulse-visual-shell-v2">/* PULSE VISUAL SHELL V2 */\nbody{padding-left:232px!important}.pulse-shell-sidebar{position:fixed;inset:0 auto 0 0;width:232px;z-index:1000;display:flex;flex-direction:column;padding:24px 16px;border-right:1px solid rgba(20,19,27,.10);background:var(--bg);font-family:Inter,system-ui,sans-serif}.pulse-shell-brand{display:flex;align-items:center;gap:10px;margin:0 8px 28px;color:var(--ink);font-weight:800;font-size:18px}.pulse-shell-brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--yellow);color:var(--ink);font-weight:900}.pulse-shell-nav{display:grid;gap:6px}.pulse-shell-nav button{display:flex;align-items:center;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:650 13px Inter,system-ui,sans-serif;text-align:left;cursor:pointer}.pulse-shell-nav button:hover,.pulse-shell-nav button:focus-visible,.pulse-shell-nav button[aria-current="page"]{background:#fff;color:var(--pink);outline:none}.pulse-shell-topbar{position:fixed;top:0;left:232px;right:0;height:58px;z-index:999;display:flex;align-items:center;padding:0 32px;border-bottom:1px solid rgba(20,19,27,.10);background:rgba(255,250,253,.94);backdrop-filter:blur(10px)}.pulse-shell-breadcrumb{display:flex;gap:8px;color:var(--muted);font-size:12px;font-weight:600}.pulse-shell-breadcrumb strong{color:var(--ink);font-weight:800}.pulse-shell-topbar+*{margin-top:58px}.badge,.chip,.pill,[class*="badge"],[class*="chip"]{background:#fff!important;color:var(--muted)!important;border-color:rgba(20,19,27,.10)!important}h1{font-weight:850!important;letter-spacing:-.045em!important}h2{font-weight:800!important;letter-spacing:-.035em!important}h3{font-weight:750!important}p,li,.muted,.helper,.caption{font-weight:450}.brand-framework .step,.brand-framework .step-icon,.brand-framework [class*="icon"]{background:#fff}@media(max-width:900px){body{padding-left:0!important}.pulse-shell-sidebar{top:auto;right:0;bottom:0;left:0;width:auto;height:62px;padding:6px 10px;border-right:0;border-top:1px solid rgba(20,19,27,.10);flex-direction:row;align-items:center;justify-content:center}.pulse-shell-brand{display:none}.pulse-shell-nav{width:100%;grid-template-columns:repeat(4,1fr);gap:4px}.pulse-shell-nav button{justify-content:center;padding:0 4px;min-height:48px;font-size:11px}.pulse-shell-topbar{left:0;height:52px;padding:0 16px}.pulse-shell-topbar+*{margin-top:52px}main{padding-bottom:76px!important}}\n</style>'''
          h=t.lower().find('</head>'); t=t[:h]+css+t[h:]
          script='''<script id="pulse-visual-shell-v2-script">(function(){var p=(location.pathname||'').split('/').pop()||'index.html';var r=p==='ask.html'?'ask':p==='intelligence.html'?'intelligence':p==='sources.html'?'sources':'dashboard';var map={dashboard:'index.html',ask:'ask.html',intelligence:'intelligence.html',sources:'sources.html'};document.querySelectorAll('[data-shell-route]').forEach(function(a){var x=a.getAttribute('data-shell-route');if(x===r)a.setAttribute('aria-current','page');a.addEventListener('click',function(){location.assign(new URL(map[x],location.href).href);});});var c=document.querySelector('[data-pulse-breadcrumb-current]');if(c)c.textContent=r==='ask'?'Ask AI':r==='intelligence'?'Intelligence':r==='sources'?'Sources':'Dashboard';function s(){var q=['#industrySelect','#industry-select','select[name="industry"]','select[data-industry]','.industry-select','.selected-industry'],e=null;for(var i=0;i<q.length;i++){e=document.querySelector(q[i]);if(e)break;}if(!e||!c)return;var v=e.options&&e.selectedIndex>=0?e.options[e.selectedIndex].textContent.trim():e.textContent.trim();if(v&&v!=='Selecione'&&v!=='Selecionar')c.textContent=v;}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',s);else s();setTimeout(s,500);})();</script>'''
          h=t.lower().find('</body>'); t=t[:h]+script+t[h:]
          p.write_text(t,encoding='utf-8')
          print('v2 shell rebuilt; bytes',len(t))
          PY
      - name: Validate
        run: |
          python3 scripts/validate_pulse.py
          python3 scripts/validate_pulse_orchestrator.py
          python3 scripts/audit_pulse_adversarial.py
          python3 scripts/audit_pulse_single_file.py
          node scripts/validate_pulse_regression.js
          node scripts/test-pulse-data-integrity.js index.html
          node scripts/test-pulse-ask-ai.js index.html
          node scripts/validate-study-evidence.js
          python3 scripts/audit_pulse_accessibility.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): finalize Pulse visual shell structure"
          git push origin HEAD:design/pulse-visual-shell
