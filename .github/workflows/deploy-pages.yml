name: Pulse Release Gate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply legacy document auto-indexing patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.html')
          text = p.read_text(encoding='utf-8-sig')
          marker = 'PULSE_AUTO_INDEX_EXISTING_V2'
          if marker in text:
              print('LEGACY AUTO-INDEX PATCH ALREADY PRESENT')
          else:
              close = text.rfind('</script>')
              if close < 0:
                  raise SystemExit('APP_MAIN_SCRIPT_CLOSE_NOT_FOUND')
              block = '''
// PULSE_AUTO_INDEX_EXISTING_V1
// PULSE_AUTO_INDEX_EXISTING_V2
const indexExistingText=async(documentId,storagePath)=>{
  const {data,error}=await client.storage.from('pulse-documents').download(storagePath);
  if(error||!data)throw new Error('TEXT_STORAGE_DOWNLOAD');
  const text=await data.text();
  return insertTextChunks(documentId,text,'text');
};
const autoIndexExistingLegacyDocuments=async()=>{
  const {data:legacyDocs,error:legacyError}=await client.from('documents').select('id,filename,mime_type,storage_path').in('mime_type',['application/pdf','text/plain']);
  if(legacyError||!legacyDocs?.length)return;
  const {data:legacyChunks}=await client.from('document_chunks').select('document_id').in('document_id',legacyDocs.map(d=>d.id));
  const indexed=new Set((legacyChunks||[]).map(c=>c.document_id));
  const pending=legacyDocs.filter(d=>!indexed.has(d.id)&&d.storage_path);
  if(!pending.length)return;
  let indexedCount=0;
  for(const doc of pending){
    try{
      const count=doc.mime_type==='application/pdf'?await indexExistingPdf(doc.id,doc.storage_path):await indexExistingText(doc.id,doc.storage_path);
      if(count)indexedCount++;
    }catch(error){console.warn('pulse-auto-index-existing-document',doc.id,error)}
  }
  if(indexedCount)show(indexedCount+' documento(s) existente(s) foram indexados automaticamente.','ok');
  await renderDocuments();
};
await autoIndexExistingLegacyDocuments();
'''
              text = text[:close] + block + text[close:]
              p.write_text(text, encoding='utf-8')
              print('LEGACY AUTO-INDEX PATCH APPLIED')

      - name: Commit legacy auto-index patch
        run: |
          if git diff --quiet -- app.html; then
            echo "No app patch to commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app.html
            git commit -m 'fix: auto-index legacy text and PDF documents [skip ci]'
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Pulse artifact
        run: python3 scripts/validate_pulse.py

      - name: Validate orchestrator protocol
        run: python3 scripts/validate_pulse_orchestrator.py

      - name: Run deterministic adversarial audit
        run: python3 scripts/audit_pulse_adversarial.py

      - name: Audit single-file product contracts
        run: python3 scripts/audit_pulse_single_file.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 scripts/extract_inline_js.py index.html /tmp/pulse-js
          shopt -s nullglob
          files=(/tmp/pulse-js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No inline JavaScript blocks found."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Run product regression guardrails
        run: node scripts/validate_pulse_regression.js

      - name: Run semantic data integrity checks
        run: node scripts/test-pulse-data-integrity.js index.html

      - name: Run Ask AI behavioral regression
        run: node scripts/test-pulse-ask-ai.js index.html

      - name: Run evidence contract
        run: node scripts/validate-study-evidence.js

      - name: Run accessibility and UX audit
        run: python3 scripts/audit_pulse_accessibility.py

      - name: Install Playwright package
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run shopper filter browser smoke tests
        run: npx playwright test scripts/browser-tests/pulse-shopper-filters.spec.js

      - name: Run next-level browser smoke tests
        run: npx playwright test scripts/browser-tests/pulse-next-level.spec.js

      - name: Release gate passed
        run: |
          echo "PULSE RELEASE GATE: PASS"
          echo "Evidence, protocol, artifact, adversarial, regression, UX and browser checks passed."

  deploy:
    name: Deploy to GitHub Pages
    needs: release-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
