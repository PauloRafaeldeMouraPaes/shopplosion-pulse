name: Pulse Single-File Artifact

on:
  push:
    branches:
      - main
      - feat/pulse-single-file-local-evidence
      - pulse-next-level-reconciliation
    paths-ignore:
      - index.html
  workflow_dispatch:

jobs:
  build-single-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inline runtimes and harden single-file UX
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          index_path = root / 'index.html'
          text = index_path.read_text(encoding='utf-8')
          sources = [
              'scripts/pulse-studies.js','scripts/pulse-ux-fixes.js','scripts/pulse-ux-category-filter.js','scripts/pulse-ux-filter-fix.js',
              'scripts/pulse-local-evidence.js','scripts/pulse-single-file-bridge.js','scripts/pulse-local-answer-bridge.js','scripts/pulse-next-level-runtime.js'
          ]
          for rel in sources:
              name = Path(rel).name
              text = re.sub(r'<script[^>]+src=["\'][^"\']*' + re.escape(name) + r'["\'][^>]*>\s*</script>', '', text, flags=re.I)
          cdn = '''<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.5.4/papaparse.min.js"></script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>\n<script>if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}</script>\n<script src="https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js"></script>'''
          if 'cdnjs.cloudflare.com/ajax/libs/PapaParse/5.5.4/papaparse.min.js' not in text: text = text.replace('</head>', cdn + '\n</head>', 1)
          blocks = re.findall(r'<script(?:\s+[^>]*)?>\s*document\.addEventListener\(["\']DOMContentLoaded["\'][\s\S]*?</script>', text, flags=re.I)
          seen = set()
          for block in blocks:
              if '.pulse-suggestion' in block:
                  key = re.sub(r'\s+', ' ', block).strip()
                  if key in seen: text = text.replace(block, '', 1)
                  else: seen.add(key)
          legacy_click = re.compile(r'\s*suggestions\.forEach\(function \(link\) \{\s*link\.addEventListener\("click", function \(e\) \{[\s\S]*?\n\s*\}\);\s*\}\);', re.I)
          text = legacy_click.sub('', text, count=1)
          legacy_qsa = re.compile(r'\s*qsa\([\'\"]\.pulse-suggestion[\'\"]\)\.forEach\(function\(a\)\{a\.addEventListener\(\'click\',function\(e\)\{[\s\S]*?\}\);\}\);', re.I)
          text = legacy_qsa.sub('', text, count=1)
          for element, stable_id in [('script','pulse-product-v5-script'),('style','pulse-product-v5-styles')]:
              pattern = re.compile(r'<'+element+r'\b[^>]*\bid=["\']'+re.escape(stable_id)+r'["\'][^>]*>[\s\S]*?</'+element+r'>', re.I)
              matches = list(pattern.finditer(text))
              for match in reversed(matches[1:]): text = text[:match.start()] + text[match.end():]
          for rel in sources:
              name = Path(rel).name
              marker = 'data-pulse-inline="' + name + '"'
              code = (root / rel).read_text(encoding='utf-8')
              block = '<script '+marker+'>\n'+code+'\n</script>'
              pat = re.compile(r'<script\s+'+re.escape(marker)+r'[^>]*>[\s\S]*?</script>', re.I)
              if pat.search(text): text = pat.sub(lambda _m: block, text, count=1)
              else: text = text.replace('</body>', block+'\n</body>', 1)
          if '.journey-step.is-current b{color:#fff!important}' not in text: text = text.replace('</head>', '<style id="pulse-single-file-final-style">.journey-step.is-current b{color:#fff!important}</style>\n</head>', 1)
          text = re.sub(r'(<a\b[^>]*href=["\'])#diagnostic(["\'][^>]*>[^<]*Entender o movimento)', r'\1#signals\2', text, flags=re.I)
          index_path.write_text(text, encoding='utf-8')

      - name: Harden Product V6 generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/pulse_product_v6.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("text = re.sub(r'<!-- PULSE_PRODUCT_V6 -->.*?</script>\\s*', JS, text, count=1, flags=re.S)", "text = re.sub(r'<!-- PULSE_PRODUCT_V6 -->.*?</script>\\s*', lambda _m: JS, text, count=1, flags=re.S)")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Product V6 intelligence layer
        run: python3 scripts/pulse_product_v6.py

      - name: Validate single-file artifact
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('index.html'); text=p.read_text(encoding='utf-8'); errors=[]
          if 'assets/' in text or 'assets\\' in text: errors.append('referência assets/ encontrada')
          if re.search(r'<script[^>]+src=["\']/scripts/',text,re.I): errors.append('script JS local externo ainda referenciado')
          if text.count('<html')!=1 or text.count('</html>')!=1: errors.append('estrutura html desequilibrada')
          if text.count('<body')!=1 or text.count('</body>')!=1: errors.append('estrutura body desequilibrada')
          if 'PULSE_EVIDENCE' not in text: errors.append('PULSE_EVIDENCE ausente')
          if 'PULSE_SOURCES' not in text: errors.append('PULSE_SOURCES ausente')
          if 'PULSE_LOCAL_EVIDENCE' not in text: errors.append('PULSE_LOCAL_EVIDENCE ausente')
          if 'SUA BASE LOCAL' not in text: errors.append('proveniência local ausente')
          if 'serie_historica' not in text: errors.append('serie_historica ausente')
          if 'papel_ideal' not in text: errors.append('papel_ideal ausente')
          if 'PULSE_NEXT_LEVEL' not in text: errors.append('PULSE_NEXT_LEVEL ausente')
          if 'pulse-role-select' not in text: errors.append('seletor de papel ausente')
          if 'pulse-trend' not in text: errors.append('indicador de tendência ausente')
          if 'PULSE_STUDY_FORMATS' not in text: errors.append('study format extension ausente')
          if 'SheetJS' not in text and 'XLSX.read' not in text: errors.append('extração de planilha ausente')
          if 'pdfjs-text' not in text: errors.append('extração PDF.js ausente')
          if '<!-- PULSE_PRODUCT_V6 -->' not in text: errors.append('Product V6 ausente')
          if re.search(r'[\u200b\u200c\u200d\ufeff]', text): errors.append('caractere invisível/zero-width detectado no HTML')
          for name in ['pulse-studies.js','pulse-ux-fixes.js','pulse-ux-category-filter.js','pulse-ux-filter-fix.js','pulse-local-evidence.js','pulse-single-file-bridge.js','pulse-local-answer-bridge.js','pulse-next-level-runtime.js']:
              if re.search(r'<script[^>]+src=["\'][^"\']*'+re.escape(name)+r'["\']',text,re.I): errors.append(name+' externo')
          suggestion_handlers = len(re.findall(r'\.pulse-suggestion[^\n]{0,240}addEventListener\(["\']click', text, re.I))
          if suggestion_handlers > 1: errors.append('handlers concorrentes de .pulse-suggestion detectados')
          if errors: print('VALIDATION FAILED'); print('\n'.join('- '+e for e in errors)); raise SystemExit(1)
          scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',text,re.I)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts):
                  if code.strip():
                      f=Path(d)/f'script-{i}.js'; f.write_text(code,encoding='utf-8'); r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                      if r.returncode: print(r.stdout); print(r.stderr); raise SystemExit(f'JS parse failure in inline script {i}')
          print(f'VALIDATION PASSED · {len(scripts)} inline scripts parsed')

      - name: Commit generated artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/pulse-ux-inject.yml scripts/pulse-local-evidence.js scripts/pulse-single-file-bridge.js scripts/pulse-local-answer-bridge.js scripts/pulse_product_v6.py scripts/pulse-next-level-runtime.js scripts/pulse-studies.js
          git diff --cached --quiet || git commit -m 'build: deliver self-contained Pulse artifact'
          git push
