name: Pulse Browser Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pulse-next-level-reconciliation]
  workflow_dispatch:

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright package
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run shopper filter smoke tests
        run: npx playwright test scripts/browser-tests/pulse-shopper-filters.spec.js
      - name: Run next-level smoke tests
        run: npx playwright test scripts/browser-tests/pulse-next-level.spec.js
      - name: Run condução smoke tests
        if: always()
        run: npx playwright test scripts/browser-tests/pulse-conducao.spec.js
      - name: Run Universo reprojection smoke tests
        if: always()
        run: npx playwright test scripts/browser-tests/pulse-universo-v3.spec.js
      - name: Run Base reprojection smoke tests
        if: always()
        run: npx playwright test scripts/browser-tests/pulse-base-v3.spec.js
      - name: Run command palette smoke tests
        if: always()
        run: npx playwright test scripts/browser-tests/pulse-command-palette-v3.spec.js
      - name: Run mobile reprojection smoke tests
        if: always()
        run: npx playwright test scripts/browser-tests/pulse-mobile-v3.spec.js
      - name: Run proposal fidelity smoke tests
        if: always()
        run: npx playwright test scripts/browser-tests/pulse-proposal-fidelity.spec.js