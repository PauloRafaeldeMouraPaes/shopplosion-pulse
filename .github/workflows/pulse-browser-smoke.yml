name: Pulse Browser Smoke

on:
  pull_request:
    branches: [main, fix/quarantine-unqualified-public-evidence]
  push:
    branches: [main, pulse-next-level-reconciliation]
  workflow_dispatch:

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright package
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium headless shell
        run: timeout 300s npx playwright install --only-shell chromium
      - name: Verify Chromium headless shell
        shell: bash
        run: |
          set -euo pipefail
          browser_root="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          executable="$(find "$browser_root" -type f -path '*/chrome-linux/headless_shell' -perm /111 -print -quit || true)"
          if [ -z "$executable" ]; then
            echo "::error::Playwright Chromium headless shell is missing after installation."
            exit 1
          fi
          echo "Playwright Chromium headless shell ready."
      - name: Run shopper filter smoke tests
        run: npx playwright test scripts/browser-tests/pulse-shopper-filters.spec.js
      - name: Run next-level smoke tests
        run: npx playwright test scripts/browser-tests/pulse-next-level.spec.js
      - name: Run condução smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-conducao.spec.js
      - name: Run Universo reprojection smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-universo-v3.spec.js
      - name: Run Base reprojection smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-base-v3.spec.js
      - name: Run command palette smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-command-palette-v3.spec.js
      - name: Run mobile reprojection smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-mobile-v3.spec.js
      - name: Run proposal fidelity smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-proposal-fidelity.spec.js
      - name: Run canonical route shell regression
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-route-consistency.spec.js
      - name: Run Ask AI interaction smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-ask-interaction.spec.js
      - name: Run chocolate evidence retrieval regression
        if: ${{ !cancelled() }}
        run: npx playwright test scripts/browser-tests/pulse-ask-interaction.spec.js --grep "Busca de chocolate"