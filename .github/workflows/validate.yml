name: Pulse QA

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stage 5 history persistence
        run: |
          if git log -1 --pretty=%B | grep -q '^feat: stage5'; then echo 'Stage 5 commit already applied'; exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          for q in ("'", '"'):
            for method in ('getItem','setItem','removeItem'):
              s=s.replace(f"sessionStorage.{method}({q}pulseAskHistory{q})",f"localStorage.{method}({q}pulseAskHistory{q})")
          s=s.replace('Histórico desta sessão','Histórico de perguntas')
          p.write_text(s,encoding='utf-8')
          PY
          if ! grep -q "localStorage.*pulseAskHistory" index.html; then echo 'History persistence migration missing'; exit 1; fi
          if grep -q "sessionStorage.*pulseAskHistory" index.html; then echo 'Session history reference remains'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: stage5 persist Ask AI history'
          git push

      - name: Validate Pulse artifact
        run: python3 scripts/validate_pulse.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 scripts/extract_inline_js.py index.html /tmp/pulse-js
          shopt -s nullglob
          files=(/tmp/pulse-js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No inline JavaScript blocks found."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done
