name: Pulse QA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Pulse artifact
        run: python3 scripts/validate_pulse.py

      - name: Run adversarial product audit
        run: python3 scripts/audit_pulse_adversarial.py

      - name: Audit single-file product contracts
        run: python3 scripts/audit_pulse_single_file.py

      - name: Validate inline JavaScript syntax
        run: |
          set -e
          for html in index.html app.html ask.html; do
            out="/tmp/pulse-js-$(basename "$html" .html)"
            rm -rf "$out"
            python3 scripts/extract_inline_js.py "$html" "$out"
            shopt -s nullglob
            files=("$out"/*.js)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No inline JavaScript blocks found in $html."
              exit 1
            fi
            for f in "${files[@]}"; do
              echo "Checking $f"
              node --check "$f"
            done
          done

      - name: Smoke test Supabase auth broker from CI
        run: |
          set -e
          echo "AUTH BROKER INVALID CREDENTIALS:"
          curl -sS --max-time 30 -o /tmp/broker.out -w 'HTTP %{http_code}\n' -X POST 'https://ppfuygnpgywfpiqxsfys.supabase.co/functions/v1/pulse-auth-broker' \
            -H 'Origin: https://paulorafaeldemourapaes.github.io' \
            -H 'Content-Type: application/json' \
            -d '{"action":"login","email":"diagnostic-invalid@example.invalid","password":"diagnostic-invalid-password"}'
          cat /tmp/broker.out
          echo
