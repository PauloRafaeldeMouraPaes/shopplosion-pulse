name: Pulse QA

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate legacy Pulse artifact checks
        run: python3 scripts/validate_pulse.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 scripts/extract_inline_js.py index.html /tmp/pulse-js
          shopt -s nullglob
          files=(/tmp/pulse-js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No inline JavaScript blocks found."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Run Pulse structural validation
        run: node scripts/validate-pulse.js index.html

      - name: Run Ask AI regression tests
        run: node scripts/test-pulse-ask-ai.js index.html
