name: Pulse Multi-Tenant Audit

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multitenant-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Deterministic multi-tenant audit
        run: python scripts/audit_pulse_multitenant.py
