name: Pulse Study Format Refresh
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pulse-study-format-extensions.js'
      - '.github/workflows/pulse-study-format-refresh.yml'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inline study format extension
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          name = 'pulse-study-format-extensions.js'
          src = Path('scripts') / name
          code = src.read_text(encoding='utf-8')
          marker = 'data-pulse-inline="' + name + '"'
          block = '<script ' + marker + '>\n' + code + '\n</script>'
          pat = r'<script\s+' + re.escape(marker) + r'[^>]*>[\s\S]*?</script>'
          if re.search(pat, t, re.I):
              t = re.sub(pat, lambda _: block, t, count=1, flags=re.I)
          else:
              t = t.replace('</body>', block + '\n</body>', 1)
          p.write_text(t, encoding='utf-8')
      - name: Validate study formats and single-file integrity
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          t = Path('index.html').read_text(encoding='utf-8')
          assert 'data-pulse-inline="pulse-study-format-extensions.js"' in t
          assert 'PULSE_STUDY_FORMATS' in t
          assert 'pptx-text' in t
          assert 'visual-reference' in t
          assert not re.search(r'[\u200B-\u200D\uFEFF]', t)
          assert not re.search(r'<script[^>]+src=["\']/scripts/', t, re.I)
          assert t.count('<html') == 1 and t.count('</html>') == 1
          assert t.count('<body') == 1 and t.count('</body>') == 1
          scripts = re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>', t, re.I)
          with tempfile.TemporaryDirectory() as d:
              for i, code in enumerate(scripts):
                  if code.strip():
                      f = Path(d) / f'{i}.js'
                      f.write_text(code, encoding='utf-8')
                      r = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
                      if r.returncode:
                          raise SystemExit(r.stderr)
      - name: Commit generated artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'build: inline study format extension' && git push)