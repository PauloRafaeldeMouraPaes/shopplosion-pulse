name: Pulse introspection
on:
  push:
    branches: ["feat/pulse-5-evolucoes-2026-08-26"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=['LENGTH '+str(len(s)),'LINES '+str(s.count(chr(10))+1)]
          for term in ['PULSE_EVIDENCE','PULSE_SOURCES','PULSE_LAST_UPDATED','pulseMatchEvidence','Ask AI','Diagnóstico','Oportunidades','Investigar','journey-map','history','localStorage']:
              out.append('\\nTERM '+term)
              for m in list(re.finditer(re.escape(term),s,re.I))[:12]:
                  a=max(0,m.start()-500); b=min(len(s),m.end()+1200)
                  out.append(s[a:b])
          Path('tmp-introspection.txt').write_text('\\n\\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-introspection.txt
          git commit -m 'chore: inspect Pulse source structure' || true
          git push
