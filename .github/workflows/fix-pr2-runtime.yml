name: Apply PR2 runtime corrections

on:
  push:
    branches: [fix/pulse-pr2-runtime-issues]
    paths:
      - 'scripts/fix_pr2_runtime.py'
      - 'index.html'
      - '.github/workflows/fix-pr2-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic fixes
        run: |
          python3 scripts/fix_pr2_runtime.py
          if git diff --quiet -- index.html; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore Pulse runtime and Ask AI behavior'
          git push
