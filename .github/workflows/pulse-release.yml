name: Pulse Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Pulse artifact
        run: python3 scripts/validate_pulse.py
      - name: Release gate passed
        run: echo "PULSE RELEASE GATE: PASS"
