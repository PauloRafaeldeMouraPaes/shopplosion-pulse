name: Pulse Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Pulse artifact
        run: python3 scripts/validate_pulse.py
      - name: Release gate passed
        run: echo "PULSE RELEASE GATE: PASS"
