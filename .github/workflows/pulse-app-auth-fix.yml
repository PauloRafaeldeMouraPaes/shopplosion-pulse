name: Pulse App Auth Bootstrap Fix

on:
  push:
    paths:
      - .github/workflows/pulse-app-auth-fix.yml
  workflow_dispatch:

jobs:
  patch-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app industry bootstrap
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.html')
          text = p.read_text(encoding='utf-8')
          old = "const user=userData.user;document.getElementById('userEmail').textContent=user.email||'conta autenticada';const {data:profile,error:profileError}=await client.from('profiles').select('industry_id,role').eq('id',user.id).single();if(profileError||!profile){await client.auth.signOut();show('Sua conta não possui uma associação válida com uma indústria.','error');setTimeout(redirectAuth,900);return}const {data:industry,error:industryError}=await client.from('industries').select('id,name,slug,status').eq('id',profile.industry_id).single();if(industryError||!industry||industry.status!=='active'){await client.auth.signOut();show('A indústria da sua conta não está ativa.','error');setTimeout(redirectAuth,900);return}document.getElementById('industryName').textContent=industry.name;document.getElementById('role').textContent=profile.role||'member';document.getElementById('welcome').textContent=industry.name;"
          new = "const user=userData.user;document.getElementById('userEmail').textContent=user.email||'conta autenticada';const {data:contextRows,error:contextError}=await client.rpc('auth_industry_context');const context=Array.isArray(contextRows)?contextRows[0]:contextRows;if(contextError||!context||!context.industry_id){await client.auth.signOut();show('Sua conta não possui uma associação válida com uma indústria.','error');setTimeout(redirectAuth,900);return}if(context.industry_status!=='active'){await client.auth.signOut();show('A indústria da sua conta não está ativa.','error');setTimeout(redirectAuth,900);return}const industry={id:context.industry_id,name:context.industry_name,slug:context.industry_slug,status:context.industry_status},profile={role:context.role};document.getElementById('industryName').textContent=industry.name;document.getElementById('role').textContent=profile.role||'member';document.getElementById('welcome').textContent=industry.name;"
          if old not in text:
              raise SystemExit('EXPECTED_APP_AUTH_BOOTSTRAP_NOT_FOUND')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

      - name: Validate JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('app.html').read_text(encoding='utf-8')
          if 'auth_industry_context' not in text: raise SystemExit('SECURE_CONTEXT_RPC_MISSING')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',text,re.I)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts):
                  if code.strip():
                      f=Path(d)/f'script-{i}.js'; f.write_text(code,encoding='utf-8')
                      r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                      if r.returncode: print(r.stderr); raise SystemExit(f'JS_PARSE_FAILURE_{i}')
          print('APP_AUTH_BOOTSTRAP_VALIDATION_PASSED')

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet && echo 'NO_CHANGE_NEEDED' && exit 0
          git commit -m 'fix app industry bootstrap via secure context RPC'
          git push
