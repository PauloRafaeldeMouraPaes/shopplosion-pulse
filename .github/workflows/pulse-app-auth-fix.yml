name: Pulse App Auth Bootstrap Fix

on:
  push:
    paths:
      - .github/workflows/pulse-app-auth-fix.yml
  workflow_dispatch:

jobs:
  patch-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Harden production auth bootstrap
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          p=Path('auth.html'); auth=p.read_text(encoding='utf-8')
          auth=auth.replace("Authorization:'Bearer '+key,","")
          auth=auth.replace("Authorization:'Bearer '+anonKey,","")
          p.write_text(auth,encoding='utf-8')

          p=Path('app.html'); text=p.read_text(encoding='utf-8')
          text=text.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>','<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>',1)
          old="const client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const redirectAuth=()=>location.replace('./auth.html');"
          new="const noOpAuthLock=async(_name,_timeout,fn)=>await fn();const client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,lock:noOpAuthLock}});const redirectAuth=()=>location.replace('./auth.html');"
          if old in text:
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          for filename in ('auth.html','app.html'):
              html=Path(filename).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',html,re.I)
              with tempfile.TemporaryDirectory() as d:
                  for i,code in enumerate(scripts):
                      if code.strip():
                          f=Path(d)/f'{filename}-{i}.js'; f.write_text(code,encoding='utf-8')
                          r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                          if r.returncode:
                              print(r.stderr); raise SystemExit(f'JS_PARSE_FAILURE_{filename}_{i}')

          auth=Path('auth.html').read_text(encoding='utf-8'); app=Path('app.html').read_text(encoding='utf-8')
          if 'Authorization:\'Bearer \'+' in auth: raise SystemExit('PUBLISHABLE_KEY_BEARER_MUST_NOT_BE_SENT')
          if 'localStorage.setItem(storageKey,JSON.stringify' not in auth: raise SystemExit('SESSION_PERSISTENCE_MISSING')
          if 'auth_industry_context' not in app: raise SystemExit('SECURE_CONTEXT_RPC_MISSING')
          if 'lock:noOpAuthLock' not in app: raise SystemExit('AUTH_LOCK_HARDENING_MISSING')
          print('AUTH_BOOTSTRAP_HARDENING_VALIDATED')

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth.html app.html .github/workflows/pulse-app-auth-fix.yml
          git diff --cached --quiet && echo 'NO_CHANGE_NEEDED' && exit 0
          git commit -m 'harden production auth bootstrap'
          git push
