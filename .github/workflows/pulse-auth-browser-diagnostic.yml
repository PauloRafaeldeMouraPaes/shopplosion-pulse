name: Pulse Auth Browser Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-auth:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch production password flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('auth.html')
          text = p.read_text(encoding='utf-8')
          marker = "const client=window.supabase.createClient(url,anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),recovery=recoveryHash();"
          helper = "const directPasswordSignIn=async(email,password)=>{const response=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:anonKey,'Content-Type':'application/json'},body:JSON.stringify({email,password}),cache:'no-store'});const body=await response.json().catch(()=>({}));if(!response.ok)return {data:{session:null},error:{status:response.status,code:body.error_code||body.code||'',message:body.msg||body.message||'Não foi possível autenticar.'}};if(!body.access_token||!body.refresh_token)return {data:{session:null},error:{status:500,code:'invalid_auth_response',message:'Resposta de autenticação inválida.'}};const {data,error}=await client.auth.setSession({access_token:body.access_token,refresh_token:body.refresh_token});return {data,error}};"
          if 'const directPasswordSignIn=' not in text:
              if marker not in text: raise SystemExit('AUTH_CLIENT_MARKER_NOT_FOUND')
              text = text.replace(marker, marker + helper, 1)
          old = "signInResult=await client.auth.signInWithPassword({email,password})"
          if old not in text: raise SystemExit('AUTH_SIGNIN_CALL_NOT_FOUND')
          text = text.replace(old, "signInResult=await directPasswordSignIn(email,password)", 1)
          p.write_text(text, encoding='utf-8')
      - name: Validate auth JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('auth.html').read_text(encoding='utf-8')
          if 'directPasswordSignIn' not in text: raise SystemExit('DIRECT_AUTH_FLOW_MISSING')
          if "auth/v1/token?grant_type=password" not in text: raise SystemExit('AUTH_TOKEN_ENDPOINT_MISSING')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',text,re.I)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts):
                  if code.strip():
                      f=Path(d)/f'script-{i}.js'; f.write_text(code,encoding='utf-8')
                      r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                      if r.returncode: print(r.stderr); raise SystemExit(f'JS_PARSE_FAILURE_{i}')
          print('AUTH_DIRECT_FLOW_VALIDATION_PASSED')
      - name: Commit auth fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth.html
          git diff --cached --quiet && echo 'NO_CHANGE_NEEDED' && exit 0
          git commit -m 'fix(auth): use direct browser password token flow'
          git push
      - name: Test Auth transport in production Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('https://paulorafaeldemourapaes.github.io/shopplosion-pulse/auth.html?debug=1',{waitUntil:'networkidle'});
            const result=await page.evaluate(async()=>{
              const cfg=window.PULSE_SUPABASE_CONFIG||{};
              const url=cfg.url;
              const key=cfg.anonKey;
              const out={sdkLoaded:!!window.supabase,urlPresent:!!url,keyPresent:!!key};
              const headers={'apikey':key,'Content-Type':'application/json'};
              try{const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key},cache:'no-store'});out.settings={status:r.status,body:(await r.text()).slice(0,300)}}catch(e){out.settings={error:String(e?.name||'')+' / '+String(e?.message||e)}}
              try{const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers,body:JSON.stringify({email:'diagnostic-invalid@example.invalid',password:'diagnostic-invalid-password'}),cache:'no-store'});out.token={status:r.status,body:(await r.text()).slice(0,500)}}catch(e){out.token={error:String(e?.name||'')+' / '+String(e?.message||e)}}
              try{const client=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await client.auth.signInWithPassword({email:'diagnostic-invalid@example.invalid',password:'diagnostic-invalid-password'});out.sdk={status:error?.status||null,code:error?.code||null,message:error?.message||null,hasSession:!!data?.session}}catch(e){out.sdk={thrown:true,name:e?.name||'',message:e?.message||''}}
              return out;
            });
            console.log(JSON.stringify(result,null,2));
            await browser.close();
            if(result.settings?.error||result.token?.error||result.sdk?.thrown) process.exit(1);
            if(![400,401,422].includes(Number(result.token?.status))) process.exit(2);
            if(result.sdk?.hasSession) process.exit(3);
          })();
          NODE
