name: Pulse Auth Browser Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Validate auth JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['auth.html','app.html','ask.html']:
              text=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',text,re.I)
              with tempfile.TemporaryDirectory() as d:
                  for i,code in enumerate(scripts):
                      if code.strip():
                          f=Path(d)/f'script-{i}.js'; f.write_text(code,encoding='utf-8')
                          r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                          if r.returncode: print(r.stderr); raise SystemExit(f'JS_PARSE_FAILURE_{name}_{i}')
          print('AUTH_UI_JS_VALIDATION_PASSED')
      - name: Test broker transport in production Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('https://paulorafaeldemourapaes.github.io/shopplosion-pulse/auth.html?debug=1',{waitUntil:'networkidle'});
            const result=await page.evaluate(async()=>{
              const cfg=window.PULSE_SUPABASE_CONFIG||{};
              const out={urlPresent:!!cfg.url,keyPresent:!!cfg.anonKey};
              try{
                const r=await fetch(cfg.url+'/functions/v1/pulse-auth-broker',{
                  method:'POST',
                  headers:{'Origin':location.origin,'Authorization':'Bearer '+cfg.anonKey,'Content-Type':'application/json'},
                  body:JSON.stringify({action:'login',email:'diagnostic-invalid@example.invalid',password:'diagnostic-invalid-password'}),
                  cache:'no-store'
                });
                out.broker={status:r.status,body:(await r.text()).slice(0,500)};
              }catch(e){out.broker={error:String(e?.name||'')+' / '+String(e?.message||e)}}
              return out;
            });
            console.log(JSON.stringify(result,null,2));
            if(result.broker?.error) process.exit(1);
            if(Number(result.broker?.status)!==400) process.exit(2);
            const recovery=await page.evaluate(async()=>{
              const cfg=window.PULSE_SUPABASE_CONFIG||{};
              try{
                const r=await fetch(cfg.url+'/functions/v1/pulse-auth-broker',{
                  method:'POST',
                  headers:{'Origin':location.origin,'Content-Type':'application/json'},
                  body:JSON.stringify({action:'recover',email:'pulse-diagnostic-invalid@example.com',redirect_to:location.origin+'/shopplosion-pulse/auth.html'}),
                  cache:'no-store'
                });
                return {status:r.status,body:(await r.text()).slice(0,500)};
              }catch(e){return {error:String(e?.name||'')+' / '+String(e?.message||e)}}
            });
            console.log('RECOVERY_BROKER',JSON.stringify(recovery,null,2));
            if(recovery.error) process.exit(3);
            if(Number(recovery.status)!==200) process.exit(4);
          })();
          NODE
