name: Pulse Visual Shell Sparkline

on:
  push:
    branches: ["design/pulse-visual-shell"]
    paths:
      - ".github/workflows/pulse-visual-shell-sparkline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add data-driven sparklines
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if "PULSE_INDICATOR_SPARKLINES" not in s:
              css = r'''<style id="PULSE_INDICATOR_SPARKLINES">.pulse-indicator-sparkline{display:block;width:100%;height:28px;margin-top:10px;overflow:visible}.pulse-indicator-sparkline path{fill:none;stroke:var(--pink,#E51B67);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pulse-indicator-sparkline .baseline{stroke:rgba(20,19,27,.08);stroke-width:1}.pulse-indicator-sparkline-wrap{margin-top:auto}.pulse-indicator-sparkline[aria-hidden="true"]{display:none}</style>'''
              js = r'''<script id="PULSE_INDICATOR_SPARKLINES">(()=>{'use strict';if(window.__PULSE_INDICATOR_SPARKLINES__)return;window.__PULSE_INDICATOR_SPARKLINES__=true;const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const nums=v=>Array.isArray(v)?v.map(Number).filter(Number.isFinite):[];function seriesFor(el){const attrs=['data-series','data-trend','data-sparkline'];for(const a of attrs){const raw=el.getAttribute(a);if(raw){try{const v=JSON.parse(raw);const n=nums(v);if(n.length>=2)return n}catch(_){const n=nums(raw.split(/[,;\s]+/));if(n.length>=2)return n}}}const source=window.PULSE_EVIDENCE||window.__PULSE_EVIDENCE||window.PULSE_SOURCES;const pool=Array.isArray(source)?source:[];if(pool.length<2)return [];const periods=pool.map(o=>o.date||o.published_at||o.publishedAt||o.period||o.year).filter(Boolean).map(String);const unique=[...new Set(periods)].sort();if(unique.length<2)return [];const counts=unique.slice(-8).map(p=>pool.filter(o=>String(o.date||o.published_at||o.publishedAt||o.period||o.year)===p).length);return counts.length>=2&&counts.some(x=>x!==counts[0])?counts:[];}function points(values,w=180,h=28){const min=Math.min(...values),max=Math.max(...values),span=max-min||1;return values.map((v,i)=>{const x=(i/(values.length-1))*w;const y=h-3-((v-min)/span)*(h-7);return [x,y]})}function add(el){if(el.querySelector(':scope > .pulse-indicator-sparkline-wrap'))return;const values=seriesFor(el);if(values.length<2)return;const pts=points(values),d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const wrap=document.createElement('div');wrap.className='pulse-indicator-sparkline-wrap';wrap.innerHTML='<svg class="pulse-indicator-sparkline" viewBox="0 0 180 28" preserveAspectRatio="none" role="img" aria-label="Tendência histórica do indicador"><path class="baseline" d="M0 25 H180"></path><path d="'+esc(d)+'"></path></svg>';el.appendChild(wrap);}function run(){const selectors=['[data-indicator-card]','.indicator-card','.metric-card','.kpi-card','.stat-card','.pulse-kpi','.pulse-indicator'];const seen=new Set;selectors.forEach(sel=>document.querySelectorAll(sel).forEach(el=>{if(!seen.has(el)){seen.add(el);add(el)}}));}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true});})();</script>'''
              s=s.replace('</head>',css+'\n</head>',1)
              s=s.replace('</body>',js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          else:
              print('sparkline layer already present')

      - name: Validate artifact
        run: |
          python3 scripts/validate_pulse.py
          python3 scripts/audit_pulse_adversarial.py
          python3 scripts/audit_pulse_single_file.py
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          if 'PULSE_INDICATOR_SPARKLINES' not in s: raise SystemExit('sparkline marker missing')
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',s,re.I)):
                  if code.strip():
                      f=Path(d)/f'{i}.js';f.write_text(code,encoding='utf-8');r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                      if r.returncode: raise SystemExit(r.stderr)
          print('SPARKLINE JS - PASS')
          PY

      - name: Commit artifact and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/pulse-visual-shell-sparkline.yml
          git add index.html .github/workflows/pulse-visual-shell-sparkline.yml
          git commit -m 'feat: complete Pulse indicator visual layer'
          git push