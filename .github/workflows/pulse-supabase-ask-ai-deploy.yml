name: Pulse Supabase Ask AI Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY_PULSE_ASK_AI to deploy the private Ask AI function to Supabase production.
        required: true
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pulse-supabase-ask-ai-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify Ask AI authentication
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY_PULSE_ASK_AI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ppfuygnpgywfpiqxsfys
    steps:
      - name: Checkout exact main release commit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN as a secret in the supabase-production environment."
            exit 1
          fi
          python3 scripts/audit_pulse_private_ai.py
          python3 scripts/validate_edge_function_manifest.py
          grep -Fq '[functions.pulse-ask-ai]' supabase/config.toml
          grep -Fq 'verify_jwt = true' supabase/config.toml

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy only pulse-ask-ai
        run: supabase functions deploy pulse-ask-ai --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify invalid JWT is rejected by the gateway
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHABLE_KEY="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("pulse-config.js").read_text(encoding="utf-8")
          match = re.search(r"anonKey\s*:\s*['\"]([^'\"]+)['\"]", text)
          if not match:
              raise SystemExit("PUBLISHABLE_KEY_NOT_FOUND")
          print(match.group(1))
          PY
          )"
          BODY_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error --max-time 30 \
            --output "$BODY_FILE" --write-out '%{http_code}' \
            --request POST "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/pulse-ask-ai" \
            --header "apikey: $PUBLISHABLE_KEY" \
            --header 'Authorization: Bearer invalid.invalid.invalid' \
            --header 'Content-Type: application/json' \
            --data '{"query":"deployment authentication check","scope":"industry"}')"
          echo "Ask AI unauthenticated gateway check returned HTTP $STATUS."
          if [ "$STATUS" != "401" ]; then
            echo "::error::Expected HTTP 401 for an invalid JWT."
            cat "$BODY_FILE"
            exit 1
          fi
          if grep -Eiq '"error"[[:space:]]*:[[:space:]]*"(invalid_session|missing_authorization)"' "$BODY_FILE"; then
            echo "::error::The request reached the function instead of being rejected by JWT verification."
            cat "$BODY_FILE"
            exit 1
          fi
          echo "SUPABASE ASK AI JWT GATEWAY CHECK: PASS"
