name: Pulse Verified Release

on: push

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Metadata smoke
        run: echo "PULSE RELEASE METADATA OK"
