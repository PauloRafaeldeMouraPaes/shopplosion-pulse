name: Pulse Verified Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Edge Function deployment manifest
        run: python3 scripts/validate_edge_function_manifest.py
      - name: Validate Pulse artifact
        run: python3 scripts/validate_pulse.py
      - name: Validate orchestrator protocol
        run: python3 scripts/validate_pulse_orchestrator.py
      - name: Run deterministic adversarial audit
        run: python3 scripts/audit_pulse_adversarial.py
      - name: Audit single-file product contracts
        run: python3 scripts/audit_pulse_single_file.py
