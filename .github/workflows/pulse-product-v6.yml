name: Pulse Product V6

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pulse_product_v6.py'
      - 'index.html'
      - '.github/workflows/pulse-product-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product layer
        run: python3 scripts/pulse_product_v6.py
      - name: Persist diagnostics
        if: failure()
        run: |
          if [ -f pulse_product_v6_error.txt ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pulse_product_v6_error.txt
            git commit -m 'test: capture Pulse Product V6 failure diagnostics [skip ci]'
            git push
          fi
      - name: Validate artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html').read_text(encoding='utf-8')
          assert '<!-- PULSE_PRODUCT_V6 -->' in p
          assert '</body>' in p.lower()
          assert 'assets/' not in p
          print('V6 artifact contract OK')
          PY
      - name: Commit generated artifact
        run: |
          if git diff --quiet -- index.html; then
            echo 'No artifact changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'build: generate Pulse Product V6 artifact [skip ci]'
          git push
