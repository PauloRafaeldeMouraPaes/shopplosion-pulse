name: Pulse Product V6

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pulse_product_v6.py'
      - 'index.html'
      - '.github/workflows/pulse-product-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product layer
        run: python3 scripts/pulse_product_v6.py
      - name: Commit generated artifact
        run: |
          if git diff --quiet -- index.html; then
            echo 'No artifact changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'build: generate Pulse Product V6 artifact [skip ci]'
          git push
