name: Pulse Supabase Signal Workers Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY_PULSE_SIGNAL_WORKERS to deploy the four signal workers to Supabase production.
        required: true
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pulse-supabase-signal-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify signal workers
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY_PULSE_SIGNAL_WORKERS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ppfuygnpgywfpiqxsfys
      WORKERS: pulse-external-source-worker pulse-external-signal-worker pulse-external-deterministic-backstop pulse-intelligence-worker
    steps:
      - name: Checkout exact main release commit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN as a secret in the supabase-production environment."
            exit 1
          fi
          python3 scripts/validate_edge_function_manifest.py
          node scripts/validate-external-signal-quality.mjs
          for fn in $WORKERS; do grep -Fq "[functions.$fn]" supabase/config.toml; done
          # The trigger is the only event writer; a worker that inserts events would duplicate them.
          if grep -n "from('intelligence_signal_events').insert\|from(\"intelligence_signal_events\").insert" supabase/functions/pulse-external-signal-worker/index.ts supabase/functions/pulse-external-deterministic-backstop/index.ts supabase/functions/pulse-intelligence-worker/index.ts; then
            echo "::error::A worker still inserts into intelligence_signal_events."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Deploy the three workers
        shell: bash
        run: |
          set -euo pipefail
          for fn in $WORKERS; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --yes
          done

      - name: Verify deployed metadata and token rejection
        shell: bash
        run: |
          set -euo pipefail
          for fn in $WORKERS; do
            META="$(mktemp)"
            curl --fail --silent --show-error --max-time 30 --output "$META" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/$fn"
            python3 - "$META" "$fn" <<'PY'
          import json, sys
          from pathlib import Path
          fn = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if fn.get("slug") != sys.argv[2] or fn.get("status") != "ACTIVE":
              raise SystemExit("DEPLOYED_FUNCTION_NOT_ACTIVE")
          if fn.get("verify_jwt") is not False:
              raise SystemExit("WORKER_VERIFY_JWT_CHANGED")
          print(f"{fn['slug']} version {fn['version']} sha256 {fn['ezbr_sha256']}")
          PY
            BODY="$(mktemp)"
            STATUS="$(curl --silent --show-error --max-time 30 --output "$BODY" --write-out '%{http_code}' \
              --request POST "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/$fn" \
              --header 'x-pulse-cron: invalid-token-check' --header 'Content-Type: application/json' --data '{}')"
            echo "$fn with an invalid internal token returned HTTP $STATUS."
            if [ "$STATUS" != "403" ] || ! grep -q internal_auth_failed "$BODY"; then
              echo "::error::$fn did not reject an invalid internal token."
              exit 1
            fi
          done
          echo "SIGNAL WORKERS DEPLOY CHECK: PASS"
