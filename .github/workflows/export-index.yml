name: Pulse staged implementation runner
on:
  push:
    branches:
      - feat/pulse-5-evolucoes-2026-08-26
permissions:
  contents: write
jobs:
  stage5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip generated stage commit
        run: |
          if git log -1 --pretty=%B | grep -q '^feat: stage5'; then echo 'stage 5 already applied'; exit 0; fi
      - name: Apply stage 5
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'sessionStorage\.(getItem|setItem|removeItem)\((\'|\")pulseAskHistory\2\)',r'localStorage.\1(\2pulseAskHistory\2)',s)
          s=s.replace('Histórico desta sessão','Histórico de perguntas')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate stage 5
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re,subprocess
          class B(HTMLParser):
            def __init__(self):super().__init__();self.st=[];self.v={'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}
            def handle_starttag(self,t,a):
              if t not in self.v:self.st.append(t)
            def handle_endtag(self,t):
              if t in self.v:return
              assert self.st and self.st[-1]==t,(t,self.st[-10:]);self.st.pop()
          s=Path('index.html').read_text();assert 'assets/' not in s;b=B();b.feed(s);b.close();assert not b.st
          for i,js in enumerate(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)):
            f=f'/tmp/s5-{i}.js';Path(f).write_text(js);assert subprocess.run(['node','--check',f]).returncode==0,i
          assert 'sessionStorage' not in s
          assert re.search(r'localStorage\.(getItem|setItem|removeItem)\([\'\"]pulseAskHistory[\'\"]\)',s)
          block=s[s.find('window.PULSE_EVIDENCE'):s.find('];\n\nfunction pulseNormalize')];assert block.count('proxima_revisao:')==11 and block.count('categoria:')==11
          assert 'window.PULSE_SOURCES' in s and 'window.PULSE_EVIDENCE' in s
          print('Etapa 5 concluída e validada')
          PY
      - name: Commit stage 5
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add index.html;git commit -m 'feat: stage5 persist Ask AI history';git push
