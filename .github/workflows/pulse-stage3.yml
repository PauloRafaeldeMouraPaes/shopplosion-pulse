name: Pulse Stage 5
on:
  push:
    branches:
      - feat/pulse-5-evolucoes-2026-08-26
permissions:
  contents: write
jobs:
  stage5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip final repair commit
        run: |
          if git log -1 --pretty=%B | grep -q '^fix: stage5'; then echo 'final stage 5 repair already applied'; exit 0; fi
      - name: Repair and validate history persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=s.replace('sessionStorage','localStorage').replace('Histórico desta sessão','Histórico de perguntas')
          # Replace any malformed pulseEscape with a syntax-safe version.
          s=re.sub(r'function pulseEscape\(text\)\{[\s\S]*?\nfunction pulseSaveHistory', 'function pulseEscape(text){return String(text||"").replace(/[<>&]/g,function(m){return ({"<":"&lt;",">":"&gt;","&":"&amp;"})[m];});}\nfunction pulseSaveHistory', s, count=1)
          if 'function pulseSaveHistory' not in s:
            history='''function pulseEscape(text){return String(text||"").replace(/[<>&]/g,function(m){return ({"<":"&lt;",">":"&gt;","&":"&amp;"})[m];});}\nfunction pulseSaveHistory(question,match){try{var h=JSON.parse(localStorage.getItem('pulseAskHistory')||'[]');h.unshift({q:question,id:match?match.id:null,ts:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('pulseAskHistory',JSON.stringify(h.slice(0,8)));pulseRenderHistory();}catch(e){}}\nfunction pulseRenderHistory(){var el=document.getElementById('pulse-history-list');if(!el)return;var h=[];try{h=JSON.parse(localStorage.getItem('pulseAskHistory')||'[]')}catch(e){}el.innerHTML=h.length?h.map(function(x,i){return '<div class="history-item"><button type="button" data-history-index="'+i+'">'+pulseEscape(x.q)+'</button><span>'+pulseEscape(x.ts)+'</span></div>';}).join(''):'<div class="empty-note">Nenhuma pergunta salva.</div>';el.querySelectorAll('[data-history-index]').forEach(function(b){b.addEventListener('click',function(){var x=h[Number(b.dataset.historyIndex)],input=document.getElementById('pulse-question');if(input){input.value=x.q;input.focus();location.hash='#answer-custom';}});});}\n\n'''
            marker='/* v30: single navigation controller.';assert marker in s;s=s.replace(marker,history+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "function pulseSaveHistory" index.html
          grep -q "localStorage.*pulseAskHistory" index.html
          ! grep -q "sessionStorage" index.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'assets/' not in s
          for i,js in enumerate(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)):
            f=f'/tmp/s5-{i}.js';Path(f).write_text(js);assert subprocess.run(['node','--check',f]).returncode==0,i
          assert 'window.PULSE_SOURCES' in s and 'window.PULSE_EVIDENCE' in s
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add index.html;git commit -m 'fix: stage5 repair Ask AI history syntax';git push
