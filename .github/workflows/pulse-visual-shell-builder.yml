name: Pulse Visual Shell Builder

on:
  push:
    branches: ["design/pulse-visual-shell"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/pulse-visual-shell
          fetch-depth: 1

      - name: Apply visual shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          original = text
          text = re.sub(r'<([a-zA-Z][^>]*)\\bclass=(?:"[^"]*\\bbrand-note\\b[^"]*"|\'[^\']*\\bbrand-note\\b[^\']*\')[^>]*>.*?</\\1>', '', text, flags=re.S|re.I)
          text = re.sub(r'\\.brand-framework:after\\s*\\{.*?\\}', '', text, flags=re.S|re.I)
          text = re.sub(r'\\.brand-framework::after\\s*\\{.*?\\}', '', text, flags=re.S|re.I)
          text = re.sub(r'\\.brand-framework\\s*\\{(?P<body>.*?)\\}', lambda m: '.brand-framework{' + re.sub(r'background(?:-image)?\\s*:\s*radial-gradient\\([^;]+\\)\\s*;?', '', m.group('body'), flags=re.I) + '}', text, flags=re.S|re.I)
          text = re.sub(r'(\\.brand-hero-visual\\s+\\.yellow-shape\\s*\\{[^}]*?)(border-radius\\s*:\s*[^;]+;)', r'\\1border-radius: 0;', text, flags=re.S|re.I)
          if 'data-pulse-shell="visual-v1"' not in text:
              nav = '''\n<aside class="pulse-shell-sidebar" data-pulse-shell="visual-v1" aria-label="Navegação principal">\n  <a class="pulse-shell-brand" href="index.html" aria-label="Shopplosion Pulse — Dashboard"><span class="pulse-shell-brand-mark" aria-hidden="true">P</span><span>Pulse</span></a>\n  <nav class="pulse-shell-nav">\n    <a href="index.html" data-shell-route="dashboard">Dashboard</a>\n    <a href="ask.html" data-shell-route="ask">Ask AI</a>\n    <a href="intelligence.html" data-shell-route="intelligence">Intelligence</a>\n    <a href="sources.html" data-shell-route="sources">Sources</a>\n  </nav>\n</aside>\n<div class="pulse-shell-topbar" aria-label="Contexto atual"><div class="pulse-shell-breadcrumb"><span>Pulse</span><span aria-hidden="true">/</span><strong data-pulse-breadcrumb-current>Dashboard</strong></div></div>\n'''
              text = re.sub(r'(<body\\b[^>]*>)', r'\\1' + nav, text, count=1, flags=re.I)
          if '/* PULSE VISUAL SHELL V1 */' not in text:
              text += r'''\n<style id="pulse-visual-shell-v1">\n/* PULSE VISUAL SHELL V1 */\n:root{--pulse-sidebar:232px;--pulse-shell-line:rgba(20,19,27,.10)}\nhtml{scroll-padding-top:72px} body{padding-left:var(--pulse-sidebar)!important}\n.pulse-shell-sidebar{position:fixed;inset:0 auto 0 0;width:var(--pulse-sidebar);z-index:1000;display:flex;flex-direction:column;padding:24px 16px;border-right:1px solid var(--pulse-shell-line);background:var(--bg);font-family:Inter,system-ui,sans-serif}\n.pulse-shell-brand{display:flex;align-items:center;gap:10px;margin:0 8px 28px;color:var(--ink);font-weight:800;font-size:18px;text-decoration:none;letter-spacing:-.03em}.pulse-shell-brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--yellow);color:var(--ink);font-weight:900}\n.pulse-shell-nav{display:grid;gap:6px}.pulse-shell-nav a{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:650;text-decoration:none}.pulse-shell-nav a:hover,.pulse-shell-nav a:focus-visible{background:#fff;color:var(--pink);outline:none}.pulse-shell-nav a[aria-current="page"]{background:#fff;color:var(--pink);box-shadow:0 4px 14px rgba(20,19,27,.05)}\n.pulse-shell-topbar{position:fixed;top:0;left:var(--pulse-sidebar);right:0;height:58px;z-index:999;display:flex;align-items:center;padding:0 32px;border-bottom:1px solid var(--pulse-shell-line);background:rgba(255,250,253,.94);backdrop-filter:blur(10px)}.pulse-shell-breadcrumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}.pulse-shell-breadcrumb strong{color:var(--ink);font-weight:800}.pulse-shell-topbar + *{margin-top:58px}\n.badge,.chip,.pill,[class*="badge"],[class*="chip"]{background:#fff!important;color:var(--muted)!important;border-color:var(--pulse-shell-line)!important}.brand-framework .step,.brand-framework .step-icon,.brand-framework [class*="icon"]{background:#fff}\nh1{font-weight:850!important;letter-spacing:-.045em!important}h2{font-weight:800!important;letter-spacing:-.035em!important}h3{font-weight:750!important}p,li,.muted,.helper,.caption{font-weight:450}\n@media(max-width:900px){:root{--pulse-sidebar:0px}body{padding-left:0!important}.pulse-shell-sidebar{top:auto;right:0;bottom:0;left:0;width:auto;height:62px;padding:6px 10px;border-right:0;border-top:1px solid var(--pulse-shell-line);flex-direction:row;align-items:center;justify-content:center}.pulse-shell-brand{display:none}.pulse-shell-nav{width:100%;grid-template-columns:repeat(4,1fr);gap:4px}.pulse-shell-nav a{justify-content:center;padding:0 4px;min-height:48px;font-size:11px}.pulse-shell-topbar{left:0;height:52px;padding:0 16px}.pulse-shell-topbar + *{margin-top:52px}main{padding-bottom:76px!important}}\n</style>\n<script id="pulse-visual-shell-v1-script">\n(function(){var path=(location.pathname||'').split('/').pop()||'index.html';var route=path==='ask.html'?'ask':path==='intelligence.html'?'intelligence':path==='sources.html'?'sources':'dashboard';document.querySelectorAll('[data-shell-route]').forEach(function(a){if(a.getAttribute('data-shell-route')===route)a.setAttribute('aria-current','page');});var current=document.querySelector('[data-pulse-breadcrumb-current]');if(current)current.textContent=route==='ask'?'Ask AI':route==='intelligence'?'Intelligence':route==='sources'?'Sources':'Dashboard';function syncContext(){var cs=['#industrySelect','#industry-select','select[name="industry"]','select[data-industry]','.industry-select','.selected-industry'];var el=null;for(var i=0;i<cs.length;i++){el=document.querySelector(cs[i]);if(el)break;}if(!el||!current)return;var v=el.options&&el.selectedIndex>=0?el.options[el.selectedIndex].textContent.trim():el.textContent.trim();if(v&&v!=='Selecione'&&v!=='Selecionar')current.textContent=v;}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncContext);else syncContext();setTimeout(syncContext,500);})();\n</script>\n'''
          if text == original:
              raise SystemExit('No visual-shell transformation matched the current index.html')
          path.write_text(text,encoding='utf-8')
          print('visual shell applied:',len(original),'->',len(text))
          PY

      - name: Validate modified artifact
        run: |
          python3 scripts/validate_pulse.py
          python3 scripts/validate_pulse_orchestrator.py
          python3 scripts/audit_pulse_adversarial.py
          python3 scripts/audit_pulse_single_file.py
          node scripts/validate_pulse_regression.js
          node scripts/test-pulse-data-integrity.js index.html
          node scripts/test-pulse-ask-ai.js index.html
          node scripts/validate-study-evidence.js
          python3 scripts/audit_pulse_accessibility.py

      - name: Commit generated shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No generated changes"; exit 0; }
          git commit -m "feat(ui): add Pulse visual shell"
          git push origin HEAD:design/pulse-visual-shell

# temporary builder