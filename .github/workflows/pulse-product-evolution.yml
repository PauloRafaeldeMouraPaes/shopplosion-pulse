name: Pulse Product Evolution

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply product evolution
        run: python3 scripts/apply_pulse_product_v4.py
      - name: Commit evolved single-file artifact
        run: |
          if git diff --quiet -- index.html; then
            echo "No product artifact changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add Pulse Insight Lab"
          git push
