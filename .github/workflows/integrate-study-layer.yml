name: Integrate Study Layer

on:
  push:
    branches:
      - feat/pulse-ux-navigation-studies-2026-08-27
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject study layer into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script defer src="scripts/pulse-studies.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('index.html sem </head>')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Study layer already integrated.'
            exit 0
          fi
          git commit -m 'chore: wire study intelligence layer into Pulse'
          git push
