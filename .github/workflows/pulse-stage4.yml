name: Pulse Final QA Runner
on:
  push:
    branches:
      - feat/pulse-5-evolucoes-2026-08-26
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair if needed
        run: |
          if git log -1 --pretty=%B | grep -q '^fix: stage5'; then echo 'Repair commit already present; validating only.'; exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=s.replace('sessionStorage','localStorage').replace('Histórico desta sessão','Histórico de perguntas')
          good='function pulseEscape(text){return String(text||"").replace(/[<>&]/g,function(m){return ({"<":"&lt;",">":"&gt;","&":"&amp;"})[m];});}'
          s=re.sub(r'function pulseEscape\(text\)\{[\s\S]*?\nfunction pulseSaveHistory',good+'\nfunction pulseSaveHistory',s,count=1)
          if 'function pulseSaveHistory' not in s:
            history='''<script id="pulse-history-persistence">function pulseEscape(text){return String(text||"").replace(/[<>&]/g,function(m){return ({"<":"&lt;",">":"&gt;","&":"&amp;"})[m];});}\nfunction pulseSaveHistory(question,match){try{var h=JSON.parse(localStorage.getItem('pulseAskHistory')||'[]');h.unshift({q:question,id:match?match.id:null,ts:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('pulseAskHistory',JSON.stringify(h.slice(0,8)));pulseRenderHistory();}catch(e){}}\nfunction pulseRenderHistory(){var el=document.getElementById('pulse-history-list');if(!el)return;var h=[];try{h=JSON.parse(localStorage.getItem('pulseAskHistory')||'[]')}catch(e){}el.innerHTML=h.length?h.map(function(x,i){return '<div class="history-item"><button type="button" data-history-index="'+i+'">'+pulseEscape(x.q)+'</button><span>'+pulseEscape(x.ts)+'</span></div>';}).join(''):'<div class="empty-note">Nenhuma pergunta salva.</div>';el.querySelectorAll('[data-history-index]').forEach(function(b){b.addEventListener('click',function(){var x=h[Number(b.dataset.historyIndex)],input=document.getElementById('pulse-question');if(input){input.value=x.q;input.focus();location.hash='#answer-custom';}});});}\n</script>'''
            s=s.replace('</body>',history+'</body>',1);p.write_text(s,encoding='utf-8')
          PY
      - name: Final validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re,subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'assets/' not in s and 'sessionStorage' not in s
          class B(HTMLParser):
            def __init__(self):super().__init__();self.st=[];self.v={'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}
            def handle_starttag(self,t,a):
              if t not in self.v:self.st.append(t)
            def handle_endtag(self,t):
              if t in self.v:return
              assert self.st and self.st[-1]==t,(t,self.st[-10:]);self.st.pop()
          b=B();b.feed(s);b.close();assert not b.st
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
            f=f'/tmp/final-{i}.js';Path(f).write_text(js);assert subprocess.run(['node','--check',f]).returncode==0,i
          assert 'window.PULSE_SOURCES' in s and 'window.PULSE_EVIDENCE' in s
          start=s.find('window.PULSE_EVIDENCE');end=s.find('function pulseNormalize',start);block=s[start:end]
          n=len(re.findall(r'\bid:"([^"]+)"',block));assert n>0 and block.count('proxima_revisao:')==n and block.count('categoria:')==n
          core=s[s.find('<main'):s.find('</main>')]
          nums=re.findall(r'(?<![A-Za-z])(\d+(?:[.,]\d+)?)\s*(?:%|p\.p\.)',core)
          eb=block.replace(',','.')
          assert all(x.replace(',','.') in eb for x in nums),[x for x in nums if x.replace(',','.') not in eb]
          assert 'localStorage' in s and 'pulseAskHistory' in s and 'function pulseSaveHistory' in s
          print('FINAL QA PASS:',len(s),'bytes;',len(scripts),'scripts;',n,'evidence items')
          PY
