name: Pulse Regression

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply pending product evolution
        run: python3 scripts/apply_pulse_product_v4.py
        continue-on-error: false
      - name: Commit evolved single-file artifact on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- index.html; then
            echo "No product artifact changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add Pulse Insight Lab"
          git push
      - name: Run product regression guardrails
        run: node scripts/validate_pulse_regression.js
      - name: Run semantic data integrity checks
        run: node scripts/test-pulse-data-integrity.js index.html
      - name: Run Ask AI behavioral regression
        run: node scripts/test-pulse-ask-ai.js index.html
      - name: Run single-file audit
        run: python3 scripts/audit_pulse_single_file.py
      - name: Run accessibility and UX audit
        run: python3 scripts/audit_pulse_accessibility.py
