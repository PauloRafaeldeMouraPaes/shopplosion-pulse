name: Pulse Regression

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgresql://postgres:postgres@postgres:5432/pulse_test
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: pulse-postgrest-test-secret-2026-10-15-change-me
          PGRST_SERVER_PORT: 3000
          PGRST_DB_POOL: 10
        ports:
          - 54321:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run product regression guardrails
        run: node scripts/validate_pulse_regression.js
      - name: Run semantic data integrity checks
        run: node scripts/test-pulse-data-integrity.js index.html
      - name: Run Ask AI behavioral regression
        run: node scripts/test-pulse-ask-ai.js index.html
      - name: Run single-file audit
        run: python3 scripts/audit_pulse_single_file.py
      - name: Run accessibility and UX audit
        run: python3 scripts/audit_pulse_accessibility.py
      - name: Run immutable source-history design preflight
        run: python3 scripts/test-immutable-source-observation-contract.py
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check external source history worker
        run: deno check supabase/functions/pulse-external-source-worker/index.ts
      - name: Type-check real PostgREST integration test
        run: deno check supabase/functions/pulse-external-source-worker/index.postgrest.test.ts
      - name: Test source HTTP retry policy
        run: deno test supabase/functions/_shared/fetch-source.test.ts
      - name: Test source failure bookkeeping
        run: deno test supabase/functions/_shared/record-source-failure.test.ts
      - name: Test source worker access and persistence failure reconciliation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test
        run: deno test --allow-env --allow-net=localhost:5432 supabase/functions/pulse-external-source-worker/index.test.ts supabase/functions/pulse-external-source-worker/index.postgres.test.ts
      - name: Test source collection truncation guard
        run: deno test supabase/functions/_shared/source-collection-limit.test.ts
      - name: Test snapshot completeness and absence safeguards
        run: deno test supabase/functions/_shared/source-completeness.test.ts
      - name: Test canonical source content fingerprint
        run: deno test supabase/functions/_shared/source-content-fingerprint.test.ts
      - name: Test stable JSON source identity
        run: deno test supabase/functions/_shared/stable-source-external-id.test.ts
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Generate or verify migration through Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          echo "Supabase CLI: $(supabase --version)"
          mkdir -p supabase/migrations
          existing="$(find supabase/migrations -maxdepth 1 -type f -name '*_immutable_source_observation_history.sql' -print | sort)"
          count="$(printf '%s\n' "$existing" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -eq 1 ]; then
            migration="$existing"
            python3 scripts/render-immutable-source-observation-migration.py --check "$migration"
          elif [ "$count" -eq 0 ]; then
            before="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)"
            supabase migration new immutable_source_observation_history
            after="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)"
            created="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | sed '/^$/d')"
            created_count="$(printf '%s\n' "$created" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$created_count" -ne 1 ]; then
              echo "Expected one CLI-generated migration, found $created_count" >&2
              exit 1
            fi
            migration="$created"
            python3 scripts/render-immutable-source-observation-migration.py --output "$migration"
          else
            echo "Expected at most one source-history migration, found $count" >&2
            exit 1
          fi
          echo "MIGRATION_SQL_FILE=$migration" >> "$GITHUB_ENV"
          echo "PostgreSQL integration test target: $migration"
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Validate history schema in ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test
        run: python3 scripts/test-immutable-source-observation-sql.py

      - name: Prepare ephemeral PostgREST worker fixture
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/source-worker-postgrest-baseline.sql
          python3 - <<PY >> "$GITHUB_ENV"
          import base64, hashlib, hmac, json, time
          secret = b"pulse-postgrest-test-secret-2026-10-15-change-me"
          encode = lambda value: base64.urlsafe_b64encode(value).rstrip(b"=").decode()
          header = encode(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
          now = int(time.time())
          payload = encode(json.dumps({"role": "service_role", "iss": "supabase", "iat": now, "exp": now + 3600, "aud": "authenticated"}, separators=(",", ":")).encode())
          unsigned = f"{header}.{payload}"
          signature = encode(hmac.new(secret, unsigned.encode(), hashlib.sha256).digest())
          print("SERVICE_ROLE_KEY=" + unsigned + "." + signature)
          print("API_URL=http://127.0.0.1:54321")
          PY
          for attempt in $(seq 1 30); do
            status="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:54321/ || true)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "PostgREST did not become ready on the isolated CI endpoint" >&2
          exit 1

      - name: Exercise source worker through real PostgREST
        run: deno test --allow-env --allow-net=127.0.0.1:54321 supabase/functions/pulse-external-source-worker/index.postgrest.test.ts
