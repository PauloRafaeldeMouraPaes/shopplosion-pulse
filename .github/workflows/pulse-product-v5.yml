name: Pulse Product V5
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  evolve:
    if: ${{ !contains(github.event.head_commit.message, 'pulse-product-v5') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Opportunity Canvas
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="pulse-opportunity-canvas"' in s:
              raise SystemExit(0)
          block=r'''<style id="pulse-product-v5-styles">
          #pulse-opportunity-canvas{margin:18px 0;padding:18px;border:1px solid #e4e7ec;border-radius:14px;background:#fff;box-shadow:0 4px 16px rgba(16,24,40,.05)}
          #pulse-opportunity-canvas .p5-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
          #pulse-opportunity-canvas h2{margin:0;font-size:18px;color:#101828}
          #pulse-opportunity-canvas .p5-note{margin:4px 0 0;color:#667085;font-size:12px;line-height:1.45}
          #pulse-opportunity-canvas .p5-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
          #pulse-opportunity-canvas .p5-card{border:1px solid #eaecf0;border-radius:11px;padding:12px;background:#fcfcfd}
          #pulse-opportunity-canvas .p5-card.is-focus{border-color:#f3a8c4;box-shadow:0 0 0 2px rgba(229,27,103,.06)}
          #pulse-opportunity-canvas .p5-rank{font-size:10px;font-weight:900;color:#b4235a;letter-spacing:.04em;text-transform:uppercase}
          #pulse-opportunity-canvas .p5-title{font-weight:900;font-size:13px;color:#101828;margin:5px 0}
          #pulse-opportunity-canvas .p5-meta{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
          #pulse-opportunity-canvas .p5-chip{font-size:9px;font-weight:800;padding:3px 6px;border-radius:999px;background:#f2f4f7;color:#475467}
          #pulse-opportunity-canvas .p5-body{font-size:11px;line-height:1.45;color:#475467;margin:5px 0}
          #pulse-opportunity-canvas .p5-label{font-size:9px;font-weight:900;color:#667085;text-transform:uppercase;letter-spacing:.03em}
          #pulse-opportunity-canvas .p5-foot{margin-top:12px;padding-top:10px;border-top:1px solid #eaecf0;font-size:10px;color:#667085}
          @media(max-width:800px){#pulse-opportunity-canvas .p5-grid{grid-template-columns:1fr}#pulse-opportunity-canvas .p5-head{display:block}}
          </style>
          <script id="pulse-product-v5-script">
          (function(){
            'use strict';
            function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c];});}
            function confidence(v){var n=String(v||'').toLowerCase();if(/alta|alto|high/.test(n))return 3;if(/media|média|medium/.test(n))return 2;if(/baixa|baixo|low/.test(n))return 1;return 1;}
            function text(item){return String(item.interpretacao||item.contexto||item.fato||item.text||item.title||item.id||'').trim();}
            function title(item){return String(item.oportunidade||item.acao||item.title||item.fato||item.id||'').trim();}
            function next(item){return String(item.proximo_passo||item.acao||item.implicacao||item.interpretacao||'Validar com a categoria, canal e período antes de transformar o sinal em decisão.').trim();}
            function render(){
              if(document.getElementById('pulse-opportunity-canvas'))return;
              var data=Array.isArray(window.PULSE_EVIDENCE)?window.PULSE_EVIDENCE.slice():[];
              if(!data.length)return;
              var select=document.getElementById('pulse-category-select'), chosen=select?select.value:'all';
              var pool=data.filter(function(x){return chosen==='all'||String(x.categoria||'geral')===chosen;});
              if(!pool.length)pool=data;
              pool=pool.map(function(x,i){var richness=[x.fato,x.contexto,x.interpretacao,x.oportunidade,x.acao].filter(Boolean).length;var score=confidence(x.confianca)*3+richness*2+(x.keywords||[]).length*0.25+(x.localStudy?1:0);return {item:x,score:score,order:i};}).sort(function(a,b){return b.score-a.score||a.order-b.order;}).slice(0,4);
              var sec=document.createElement('section');sec.id='pulse-opportunity-canvas';sec.setAttribute('aria-labelledby','pulse-opportunity-canvas-title');
              sec.innerHTML='<div class="p5-head"><div><h2 id="pulse-opportunity-canvas-title">Opportunity Canvas</h2><p class="p5-note">Uma ponte entre evidência e ação: os cartões abaixo são priorizados por riqueza de evidência e confiança disponível. O ranking é heurístico, não estatístico.</p></div><span class="p5-chip">'+esc(chosen==='all'?'Todas as categorias':chosen)+'</span></div><div class="p5-grid">'+pool.map(function(x,i){var it=x.item;return '<article class="p5-card '+(i===0?'is-focus':'')+'"><div class="p5-rank">Prioridade '+(i+1)+'</div><div class="p5-title">'+esc(title(it))+'</div><div class="p5-meta"><span class="p5-chip">'+esc(it.categoria||'geral')+'</span><span class="p5-chip">Confiança: '+esc(it.confianca||'não informada')+'</span></div><div class="p5-label">Evidência</div><p class="p5-body">'+esc(text(it))+'</p><div class="p5-label">Próximo passo</div><p class="p5-body">'+esc(next(it))+'</p><div class="p5-foot">Fonte: '+esc(it.fonte||it.sourceName||'base de evidências')+' · Período: '+esc(it.periodo||'não informado')+'</div></article>';}).join('')+'</div><div class="p5-foot">Regra metodológica: não há causalidade, probabilidade ou significância implícita. Use o Canvas para escolher o que investigar, depois valide a hipótese com dados específicos.</div>';
              var target=document.getElementById('pulse-insight-lab')||document.getElementById('opportunities')||document.querySelector('main');
              if(target&&target.parentNode)target.parentNode.insertBefore(sec,target);
            }
            function init(){render();var s=document.getElementById('pulse-category-select');if(s)s.addEventListener('change',function(){var old=document.getElementById('pulse-opportunity-canvas');if(old)old.remove();render();});}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          </script>
          '''
          marker='</head>'
          if marker not in s: raise SystemExit('head marker missing')
          s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit product evolution and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/pulse-product-v5.yml
          git add index.html .github/workflows/pulse-product-v5.yml
          git commit -m "feat: pulse opportunity canvas pulse-product-v5"
          git push