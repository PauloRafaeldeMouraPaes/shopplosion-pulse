name: Pulse Auth Network Diagnostic

on:
  push:
    branches: [main]

jobs:
  auth-network:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase Auth endpoint
        env:
          SUPABASE_URL: https://ppfuygnpgywfpiqxsfys.supabase.co
        run: |
          set -e
          echo "DNS:"
          getent hosts ppfuygnpgywfpiqxsfys.supabase.co
          echo "SETTINGS:"
          curl -sS -o /tmp/settings.out -w 'HTTP %{http_code}\n' --max-time 20 "$SUPABASE_URL/auth/v1/settings"
          head -c 500 /tmp/settings.out || true
          echo
          echo "TOKEN ENDPOINT:"
          curl -sS -o /tmp/token.out -w 'HTTP %{http_code}\n' --max-time 20 -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H 'Content-Type: application/json' -H 'apikey: sb_publishable_aRzZJXmWvRu86J4I7_VFDw_ucU46Km7' -d '{"email":"diagnostic-invalid@example.invalid","password":"diagnostic-invalid-password"}'
          head -c 500 /tmp/token.out || true
          echo
      - name: Check Auth broker from Supabase Edge runtime
        run: |
          set -e
          echo "AUTH BROKER INVALID CREDENTIALS:"
          curl -sS --max-time 30 -D /tmp/broker.headers -o /tmp/broker.out -X POST 'https://ppfuygnpgywfpiqxsfys.supabase.co/functions/v1/pulse-auth-broker' \
            -H 'Origin: https://paulorafaeldemourapaes.github.io' \
            -H 'Content-Type: application/json' \
            -d '{"action":"login","email":"diagnostic-invalid@example.invalid","password":"diagnostic-invalid-password"}' \
            -w 'HTTP %{http_code}\n'
          cat /tmp/broker.out
          echo
      - name: Check Auth from Supabase Edge runtime
        run: |
          set -e
          echo "EDGE DIAGNOSTIC:"
          curl -fsS --max-time 30 'https://ppfuygnpgywfpiqxsfys.supabase.co/functions/v1/pulse-auth-network-diagnostic' | tee /tmp/edge-diagnostic.json
          echo
      - name: Verify published auth page from GitHub Pages
        run: |
          set -e
          URL='https://paulorafaeldemourapaes.github.io/shopplosion-pulse/auth.html'
          curl -fsSL --max-time 30 -D /tmp/pages.headers "$URL" -o /tmp/auth.html
          echo "PAGES STATUS:"
          head -n 20 /tmp/pages.headers
          echo "AUTH PAGE BYTES: $(wc -c < /tmp/auth.html)"
          echo "SIGNIN MARKER COUNT: $(grep -o 'signInWithPassword' /tmp/auth.html | wc -l)"
          echo "RECOVERY MARKER COUNT: $(grep -o 'resetPasswordForEmail' /tmp/auth.html | wc -l)"
          echo "OLD DIRECT-TOKEN MARKER COUNT: $(grep -o 'auth/v1/token?grant_type=password' /tmp/auth.html | wc -l)"
          echo "RELEASE TRIGGER MARKER COUNT: $(grep -o 'Pulse auth release trigger' /tmp/auth.html | wc -l)"
