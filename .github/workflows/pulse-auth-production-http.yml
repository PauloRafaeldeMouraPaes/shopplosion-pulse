name: Pulse Auth Production HTTP Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe production auth page and broker
        run: |
          node <<'NODE'
          const page=await fetch('https://paulorafaeldemourapaes.github.io/shopplosion-pulse/auth.html',{signal:AbortSignal.timeout(10000),cache:'no-store'});
          const html=await page.text();
          console.log('PAGE',page.status,html.length,'SUPABASE_SCRIPT',html.includes('cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0'));
          if(!page.ok||!html.includes('supabase-js')) process.exit(1);
          const cfg=await fetch('https://paulorafaeldemourapaes.github.io/shopplosion-pulse/pulse-config.js',{signal:AbortSignal.timeout(10000),cache:'no-store'});
          const config=await cfg.text();
          console.log('CONFIG',cfg.status,config.includes('ppfuygnpgywfpiqxsfys.supabase.co'));
          if(!cfg.ok||!config.includes('ppfuygnpgywfpiqxsfys.supabase.co')) process.exit(2);
          const key=(config.match(/anonKey:'([^']+)'/)||[])[1];
          const broker=await fetch('https://ppfuygnpgywfpiqxsfys.supabase.co/functions/v1/pulse-auth-broker',{method:'POST',signal:AbortSignal.timeout(15000),headers:{Origin:'https://paulorafaeldemourapaes.github.io','apikey':key,'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:'diagnostic-invalid@example.invalid',password:'diagnostic-invalid-password'})});
          console.log('BROKER',broker.status,(await broker.text()).slice(0,300));
          if(broker.status!==400) process.exit(3);
          NODE
