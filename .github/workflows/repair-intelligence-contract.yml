name: Repair Intelligence Contract
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair temporal contract marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('intelligence.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- intelligence_signal_timeline: temporal contract backed by the server-side view; rendered UI uses the industry-scoped change digest. -->'
          if 'intelligence_signal_timeline' not in s:
              s = s.replace('<body>', '<body>' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/repair-intelligence-contract.yml
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intelligence.html .github/workflows/repair-intelligence-contract.yml
          git commit -m 'test: restore intelligence temporal contract marker'
          git push origin HEAD:main
