name: Pulse Evidence Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate deterministic evidence semantics
        run: node scripts/validate-study-evidence.js
