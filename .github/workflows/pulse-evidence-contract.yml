name: Pulse Evidence Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate deterministic evidence semantics
        run: node scripts/validate-study-evidence.js
      - name: Validate external signal evidence quality
        run: node scripts/validate-external-signal-quality.mjs
      - name: Validate condução dismissal/silence contract
        run: node scripts/validate-conducao-contract.js
      - name: Validate analysis publish/limits contract
        run: node scripts/validate-analysis-publish-contract.js
      - name: Parse every Edge Function entrypoint
        # A syntax error in a repository copy only surfaces at deploy time otherwise (found 2026-11-17 in pulse-intelligence-worker).
        run: |
          set -euo pipefail
          for f in supabase/functions/*/index.ts; do
            npx -y esbuild@0.24.0 --loader=ts --log-level=error < "$f" > /dev/null
            echo "parsed $f"
          done
