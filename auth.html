<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopplosion Pulse — Entrar</title><meta name="description" content="Acesso seguro ao Shopplosion Pulse."><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e7e9ef;border-radius:18px;padding:32px;box-shadow:0 18px 50px #17203314}.brand{font-weight:800;color:#e51b67;margin-bottom:28px}h1{margin:0 0 8px;font-size:28px}p{color:#5f6878;line-height:1.5}.field{display:grid;gap:7px;margin:18px 0}label{font-weight:650;font-size:14px}input{width:100%;padding:13px 14px;border:1px solid #ccd1dc;border-radius:10px;font:inherit}button{width:100%;padding:13px 16px;border:0;border-radius:10px;background:#e51b67;color:#fff;font-weight:750;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.link{background:none;color:#e51b67;padding:6px 0;margin-top:10px}.msg{margin-top:16px;padding:12px;border-radius:10px;font-size:14px;display:none}.msg.show{display:block}.msg.error{background:#fff1f2;color:#a51d35}.msg.ok{background:#effaf3;color:#176b3a}.small{font-size:12px;margin-top:20px}.debug{display:none;margin-top:10px;padding:10px;background:#f4f5f7;color:#4b5563;font:11px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.debug.on{display:block}.hidden{display:none!important}.hint{font-size:12px;color:#5f6878}</style></head><body><main class="card"><div class="brand">SHOPPLOSION PULSE</div><h1 id="title">Entrar</h1><p id="intro">Acesse os dados e análises da sua indústria. Cada conta é vinculada a uma única indústria.</p><form id="login"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit">Entrar no Pulse</button></form><button id="forgot" class="link" type="button">Esqueci minha senha</button><form id="reset" class="hidden"><div class="field"><label for="newpass">Nova senha</label><input id="newpass" type="password" minlength="8" autocomplete="new-password" required><div class="hint">Mínimo de 8 caracteres.</div></div><div class="field"><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button>Salvar nova senha</button></form><div id="message" class="msg" role="status" aria-live="polite"></div><div id="debug" class="debug"></div><p class="small">A autorização real dos dados é feita pelo Supabase/PostgreSQL com RLS; a interface nunca decide a indústria do usuário.</p></main><script src="./pulse-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script>(()=>{const cfg=window.PULSE_SUPABASE_CONFIG||{},url=cfg.url||'',key=cfg.anonKey||'',login=document.getElementById('login'),reset=document.getElementById('reset'),forgot=document.getElementById('forgot'),submit=document.getElementById('submit'),msg=document.getElementById('message'),debug=document.getElementById('debug'),title=document.getElementById('title'),intro=document.getElementById('intro'),recovery=new URLSearchParams(location.hash.replace(/^#/,''));const debugOn=new URLSearchParams(location.search).get('debug')==='1';const show=(t,c='ok')=>{msg.textContent=t;msg.className='msg show '+c};const dbg=t=>{if(debugOn){debug.textContent=t;debug.className='debug on'}};const storageKey='sb-'+new URL(url).hostname.split('.')[0]+'-auth-token';let client=null;const getClient=()=>{if(client)return client;if(!window.supabase)throw Error('supabase-js não foi carregado');const lock=async(_name,_timeout,fn)=>fn();client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,lock}});return client};if(!url||!key){show('Configuração do Supabase ausente.','error');submit.disabled=true;forgot.disabled=true;return}const recoveryMode=recovery.get('type')==='recovery'||(recovery.has('access_token')&&recovery.has('refresh_token'));if(recoveryMode){login.classList.add('hidden');forgot.classList.add('hidden');reset.classList.remove('hidden');title.textContent='Definir nova senha';intro.textContent='Escolha uma nova senha para acessar o Shopplosion Pulse.';try{const c=getClient();c.auth.getSession().then(({data,error})=>{if(error||!data.session)show('O link de recuperação expirou ou não é mais válido. Solicite um novo link.','error')})}catch(e){dbg(e.message)}}forgot.onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){show('Informe seu e-mail primeiro.','error');return}forgot.disabled=true;show('Enviando instruções de recuperação…');try{const redirectTo=new URL('./auth.html',location.href).href;const {error}=await getClient().auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;show('Enviamos um link de recuperação para este e-mail.')}catch(e){show('Não foi possível enviar o e-mail de recuperação. Tente novamente.','error');dbg('resetPasswordForEmail: '+(e.message||e))}forgot.disabled=false};reset.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('newpass').value,c=document.getElementById('confirm').value;if(p.length<8||p!==c){show('Confira a senha: mínimo de 8 caracteres e as duas senhas devem ser iguais.','error');return}try{const {error}=await getClient().auth.updateUser({password:p});if(error)throw error;show('Senha atualizada com sucesso. Entrando no Pulse…');setTimeout(()=>location.replace('./app.html'),500)}catch(e){show('Não foi possível atualizar a senha.','error');dbg('updateUser: '+(e.message||e))}};login.onsubmit=async e=>{e.preventDefault();submit.disabled=true;show('Autenticando…');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;localStorage.removeItem(storageKey);const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',mode:'cors',credentials:'omit',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password}),cache:'no-store',signal:ctl.signal}),body=await r.json().catch(()=>({}));if(!r.ok){show(r.status===400?'E-mail ou senha incorretos.':r.status===429?'Muitas tentativas. Aguarde alguns minutos.':'Falha de autenticação. Tente novamente.','error');dbg('POST token: HTTP '+r.status+' '+(body.msg||body.message||body.error||''));return}if(!body.access_token||!body.refresh_token)throw Error('Resposta de autenticação sem sessão válida');localStorage.setItem(storageKey,JSON.stringify({access_token:body.access_token,refresh_token:body.refresh_token,expires_in:Number(body.expires_in||3600),expires_at:Number(body.expires_at||Math.floor(Date.now()/1000)+Number(body.expires_in||3600)),token_type:body.token_type||'bearer',user:body.user||null}));show('Login realizado. Entrando no Pulse…');location.replace('./app.html')}catch(e){show(e.name==='AbortError'?'O serviço de autenticação demorou para responder. Verifique sua conexão e tente novamente.':'Erro ao conectar ao serviço de autenticação. Tente novamente.','error');dbg('POST token: '+(e.name||'')+' '+(e.message||''))}finally{clearTimeout(timer);submit.disabled=false}}})();</script></body></html>
