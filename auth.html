<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopplosion Pulse — Entrar</title><meta name="description" content="Acesso seguro ao Shopplosion Pulse."><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e7e9ef;border-radius:18px;padding:32px;box-shadow:0 18px 50px #17203314}.brand{font-weight:800;color:#e51b67;margin-bottom:28px}h1{margin:0 0 8px;font-size:28px}p{color:#5f6878;line-height:1.5}.field{display:grid;gap:7px;margin:18px 0}label{font-weight:650;font-size:14px}input{width:100%;padding:13px 14px;border:1px solid #ccd1dc;border-radius:10px;font:inherit}button{width:100%;padding:13px 16px;border:0;border-radius:10px;background:#e51b67;color:#fff;font-weight:750;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.link{background:none;color:#e51b67;padding:6px 0;margin-top:10px}.msg{margin-top:16px;padding:12px;border-radius:10px;font-size:14px;display:none}.msg.show{display:block}.msg.error{background:#fff1f2;color:#a51d35}.msg.ok{background:#effaf3;color:#176b3a}.small{font-size:12px;margin-top:20px}.debug{display:none;margin-top:10px;padding:10px;background:#f4f5f7;color:#4b5563;font:11px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.debug.on{display:block}.hidden{display:none!important}.hint{font-size:12px;color:#5f6878}</style></head><body><main class="card"><div class="brand">SHOPPLOSION PULSE</div><h1 id="title">Entrar</h1><p id="intro">Acesse os dados e análises da sua indústria. Cada conta é vinculada a uma única indústria.</p><form id="login"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit">Entrar no Pulse</button></form><button id="forgot" class="link" type="button">Esqueci minha senha</button><form id="reset" class="hidden"><div class="field"><label for="newpass">Nova senha</label><input id="newpass" type="password" minlength="8" autocomplete="new-password" required><div class="hint">Mínimo de 8 caracteres.</div></div><div class="field"><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button>Salvar nova senha</button></form><div id="message" class="msg" role="status" aria-live="polite"></div><div id="debug" class="debug"></div><p class="small">A autorização real dos dados é feita pelo Supabase/PostgreSQL com RLS; a interface nunca decide a indústria do usuário.</p></main><script src="./pulse-config.js"></script><script>(()=>{const cfg=window.PULSE_SUPABASE_CONFIG||{},url=cfg.url||'',key=cfg.anonKey||'',login=document.getElementById('login'),reset=document.getElementById('reset'),forgot=document.getElementById('forgot'),submit=document.getElementById('submit'),msg=document.getElementById('message'),debug=document.getElementById('debug'),title=document.getElementById('title'),intro=document.getElementById('intro'),recovery=new URLSearchParams(location.hash.replace(/^#/,'')),debugOn=new URLSearchParams(location.search).get('debug')==='1',stages=[];const show=(t,c='ok')=>{msg.textContent=t;msg.className='msg show '+c};const dbg=t=>{stages.push(t);if(debugOn){debug.textContent=stages.join('\n');debug.className='debug on'}};const timeout=ms=>new Promise((_,reject)=>setTimeout(()=>reject(Object.assign(new Error('tempo excedido'),{code:'timeout'})),ms));const timed=async(p,ms)=>Promise.race([p,timeout(ms)]);if(!url||!key){show('Configuração do Supabase ausente.','error');submit.disabled=true;forgot.disabled=true;return}const recoveryMode=recovery.get('type')==='recovery'||(recovery.has('access_token')&&recovery.has('refresh_token'));const storageKey='sb-'+new URL(url).hostname.split('.')[0]+'-auth-token';if(recoveryMode){login.classList.add('hidden');forgot.classList.add('hidden');reset.classList.remove('hidden');title.textContent='Definir nova senha';intro.textContent='Escolha uma nova senha para acessar o Shopplosion Pulse'}forgot.onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){show('Informe seu e-mail primeiro.','error');return}forgot.disabled=true;show('Enviando instruções…');try{const redirectTo=location.origin+location.pathname;dbg('RECOVERY 1/2: iniciando');dbg('redirect_to: '+redirectTo);const r=await timed(fetch(url+'/functions/v1/pulse-auth-broker',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({action:'recover',email,redirect_to:redirectTo}),cache:'no-store'}),15000);const body=await r.json().catch(()=>({}));dbg('RECOVERY 2/2: HTTP '+r.status+(body.error_code?' | code='+body.error_code:'')+(body.msg?' | message='+body.msg:''));if(!r.ok)throw Object.assign(new Error(body.msg||body.message||('HTTP '+r.status)),{status:r.status,code:body.error_code||body.code||'recovery_error'});show('Enviamos um link de recuperação para este e-mail.')}catch(e){show('Não foi possível enviar o e-mail de recuperação. Tente novamente.','error');dbg('RECOVERY ERROR: '+(e.code||'')+' | '+(e.message||e))}forgot.disabled=false};login.onsubmit=async e=>{e.preventDefault();submit.disabled=true;stages.length=0;show('Autenticando…');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{dbg('LOGIN 1/5: token request iniciado');let r;try{r=await timed(fetch(url+'/functions/v1/pulse-auth-broker',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({action:'login',email,password}),cache:'no-store'}),15000)}catch(e){dbg('LOGIN TOKEN NETWORK: '+(e.name||'')+' | '+(e.code||'')+' | '+(e.message||e));throw e}const body=await r.json().catch(()=>({}));dbg('LOGIN 2/5: token HTTP '+r.status+(body.error_code?' | code='+body.error_code:'')+(body.msg?' | message='+body.msg:''));if(!r.ok)throw Object.assign(new Error(body.msg||body.message||'Credenciais inválidas'),{status:r.status,code:body.error_code||body.code||'auth_error'});if(!body.access_token||!body.refresh_token)throw Object.assign(new Error('Resposta de autenticação sem sessão'),{code:'invalid_auth_response'});const session={access_token:body.access_token,refresh_token:body.refresh_token,expires_in:Number(body.expires_in||3600),expires_at:Number(body.expires_at||Math.floor(Date.now()/1000)+Number(body.expires_in||3600)),token_type:body.token_type||'bearer',user:body.user||null};localStorage.setItem(storageKey,JSON.stringify(session));dbg('LOGIN 3/5: sessão persistida em '+storageKey);let rpc;try{rpc=await timed(fetch(url+'/rest/v1/rpc/auth_industry_context',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+body.access_token,'Content-Type':'application/json'},body:'{}',cache:'no-store'}),15000)}catch(e){dbg('LOGIN INDUSTRY NETWORK: '+(e.name||'')+' | '+(e.code||'')+' | '+(e.message||e));throw e}const ctx=await rpc.json().catch(()=>null);dbg('LOGIN 4/5: indústria HTTP '+rpc.status+(ctx?.message?' | message='+ctx.message:''));const context=Array.isArray(ctx)?ctx[0]:ctx;if(!rpc.ok||!context?.industry_id||context.industry_status!=='active')throw Object.assign(new Error('Conta sem indústria ativa'),{code:rpc.status?'industry_context_error':'industry_context_unavailable'});dbg('LOGIN 5/5: autenticação + indústria OK');show('Login realizado. Entrando no Pulse…');location.replace('./app.html')}catch(e){show('Não foi possível entrar. Verifique os dados da conta ou use "Esqueci minha senha".','error');dbg('LOGIN ERROR: '+(e.code||'login')+' | status='+(e.status||'')+' | '+(e.message||e));submit.disabled=false}};reset.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('newpass').value,c=document.getElementById('confirm').value;if(p.length<8||p!==c){show('Confira a senha: mínimo de 8 caracteres e as duas senhas devem ser iguais.','error');return}show('Atualizando senha…');try{const r=await timed(fetch(url+'/functions/v1/pulse-auth-broker',{method:'PUT',headers:{apikey:key,Authorization:'Bearer '+recovery.get('access_token'),'Content-Type':'application/json'},body:JSON.stringify({action:'update_password',access_token:recovery.get('access_token'),password:p}),cache:'no-store'}),15000);if(!r.ok)throw Error('update HTTP '+r.status);show('Senha atualizada com sucesso. Entrando no Pulse…');setTimeout(()=>location.replace('./app.html'),500)}catch(e){show('Não foi possível atualizar a senha.','error');dbg('UPDATE ERROR: '+(e.code||'')+' | '+(e.message||e))}}})();</script></body></html>
<!-- Auth transport: browser sends credentials only to the project's Supabase Edge Function; the function forwards them to Supabase Auth over TLS and never stores them. -->
