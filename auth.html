<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopplosion Pulse — Entrar</title><meta name="description" content="Acesso seguro ao Shopplosion Pulse."><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e7e9ef;border-radius:18px;padding:32px;box-shadow:0 18px 50px #17203314}.brand{font-weight:800;color:#e51b67;margin-bottom:28px}h1{margin:0 0 8px;font-size:28px}p{color:#5f6878;line-height:1.5}.field{display:grid;gap:7px;margin:18px 0}label{font-weight:650;font-size:14px}input{width:100%;padding:13px 14px;border:1px solid #ccd1dc;border-radius:10px;font:inherit}button{width:100%;padding:13px 16px;border:0;border-radius:10px;background:#e51b67;color:#fff;font-weight:750;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.link{background:none;color:#e51b67;padding:6px 0;margin-top:10px}.msg{margin-top:16px;padding:12px;border-radius:10px;font-size:14px;display:none}.msg.show{display:block}.msg.error{background:#fff1f2;color:#a51d35}.msg.ok{background:#effaf3;color:#176b3a}.small{font-size:12px;margin-top:20px}.debug{display:none;margin-top:10px;padding:10px;background:#f4f5f7;color:#4b5563;font:11px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.debug.on{display:block}.hidden{display:none!important}.hint{font-size:12px;color:#5f6878}</style></head><body><main class="card"><div class="brand">SHOPPLOSION PULSE</div><h1 id="title">Entrar</h1><p id="intro">Acesse os dados e análises da sua indústria. Cada conta é vinculada a uma única indústria.</p><form id="login"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit">Entrar no Pulse</button></form><button id="forgot" class="link" type="button">Esqueci minha senha</button><form id="reset" class="hidden"><div class="field"><label for="newpass">Nova senha</label><input id="newpass" type="password" minlength="8" autocomplete="new-password" required><div class="hint">Mínimo de 8 caracteres.</div></div><div class="field"><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button>Salvar nova senha</button></form><div id="message" class="msg" role="status" aria-live="polite"></div><div id="debug" class="debug"></div><p class="small">A autorização real dos dados é feita pelo Supabase/PostgreSQL com RLS; a interface nunca decide a indústria do usuário.</p></main><script src="./pulse-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script>
(async()=>{
const cfg=window.PULSE_SUPABASE_CONFIG||{},url=cfg.url||'',key=cfg.anonKey||'',login=document.getElementById('login'),reset=document.getElementById('reset'),forgot=document.getElementById('forgot'),submit=document.getElementById('submit'),msg=document.getElementById('message'),debug=document.getElementById('debug'),title=document.getElementById('title'),intro=document.getElementById('intro'),params=new URLSearchParams(location.hash.replace(/^#/,'')),debugOn=new URLSearchParams(location.search).get('debug')==='1',stages=[];
const show=(t,c='ok')=>{msg.textContent=t;msg.className='msg show '+c};const dbg=t=>{stages.push(t);if(debugOn){debug.textContent=stages.join('\n');debug.className='debug on'}};
const timeout=ms=>new Promise((_,reject)=>setTimeout(()=>reject(Object.assign(new Error('tempo excedido'),{code:'timeout'})),ms));const timed=(p,ms)=>Promise.race([p,timeout(ms)]);
if(!url||!key){show('Configuração do Supabase ausente.','error');submit.disabled=true;forgot.disabled=true;return}
const redirectTo=new URL('./auth.html',location.href).href;
const client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const broker=async(payload,token,ms=15000)=>{const headers={apikey:key,'Content-Type':'application/json','Origin':location.origin};if(token)headers.Authorization='Bearer '+token;const r=await timed(fetch(url+'/functions/v1/pulse-auth-broker',{method:'POST',headers,body:JSON.stringify(payload),cache:'no-store'}),ms);const body=await r.json().catch(()=>({}));return {r,body}};
const directLogin=async(email,password)=>{const {data,error}=await timed(client.auth.signInWithPassword({email,password}),15000);if(error)throw error;return data};
const directRecovery=async(email)=>{const {error}=await timed(client.auth.resetPasswordForEmail(email,{redirectTo}),15000);if(error)throw error};
const recoveryMode=params.get('type')==='recovery'||(params.has('access_token')&&params.has('refresh_token'));
if(recoveryMode){login.classList.add('hidden');forgot.classList.add('hidden');reset.classList.remove('hidden');title.textContent='Definir nova senha';intro.textContent='Escolha uma nova senha para acessar o Shopplosion Pulse.'}
forgot.onclick=async()=>{
  const email=document.getElementById('email').value.trim();if(!email){show('Informe seu e-mail primeiro.','error');return}forgot.disabled=true;show('Enviando instruções…');
  try{dbg('RECOVERY 1/4: tentando broker');const {r,body}=await broker({action:'recover',email,redirect_to:redirectTo},key,15000);dbg('RECOVERY 2/4: broker HTTP '+r.status+(body.msg?' | message='+body.msg:''));if(r.ok){show('Enviamos um link de recuperação para este e-mail.');dbg('RECOVERY 4/4: broker aceitou o pedido');return}dbg('RECOVERY 3/4: broker falhou; tentando Supabase Auth direto');await directRecovery(email);show('Enviamos um link de recuperação para este e-mail.');dbg('RECOVERY 4/4: Supabase Auth direto aceitou o pedido')}
catch(e){show('Não foi possível enviar o e-mail de recuperação. Tente novamente.','error');dbg('RECOVERY ERROR: '+(e.code||'')+' | status='+(e.status||'')+' | '+(e.message||e))}
  finally{forgot.disabled=false}
};
reset.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('newpass').value,c=document.getElementById('confirm').value;if(p.length<8||p!==c){show('Confira a senha: mínimo de 8 caracteres e as duas senhas devem ser iguais.','error');return}
  const accessToken=params.get('access_token');if(!accessToken){show('O link de recuperação expirou ou a sessão não é mais válida. Solicite um novo link.','error');dbg('UPDATE ERROR: recovery access token ausente');return}
  try{show('Atualizando senha…');const r=await timed(fetch(url+'/functions/v1/pulse-auth-broker',{method:'POST',headers:{apikey:key,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json','Origin':location.origin},body:JSON.stringify({action:'update_password',access_token:accessToken,password:p}),cache:'no-store'}),15000);const body=await r.json().catch(()=>({}));dbg('UPDATE HTTP '+r.status+(body.msg?' | message='+body.msg:''));if(!r.ok)throw Object.assign(new Error(body.msg||body.message||('HTTP '+r.status)),{status:r.status,code:body.error_code||body.code||'update_error'});show('Senha atualizada com sucesso. Entrando no Pulse…');setTimeout(()=>location.replace('./app.html'),500)}
  catch(e){show('Não foi possível atualizar a senha.','error');dbg('UPDATE ERROR: '+(e.code||'')+' | status='+(e.status||'')+' | '+(e.message||e))}
};
login.onsubmit=async e=>{e.preventDefault();submit.disabled=true;stages.length=0;show('Autenticando…');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
  try{dbg('LOGIN 1/7: tentando broker');const {r,body}=await broker({action:'login',email,password},null,15000);dbg('LOGIN 2/7: broker HTTP '+r.status+(body.msg?' | message='+body.msg:''));let sessionData;if(r.ok&&body.access_token&&body.refresh_token){dbg('LOGIN 3/7: sessão recebida do broker');const s=await timed(client.auth.setSession({access_token:body.access_token,refresh_token:body.refresh_token}),15000);if(s.error||!s.data?.session)throw s.error||new Error('session_missing');sessionData=s.data}else{dbg('LOGIN 3/7: broker falhou; tentando Supabase Auth direto');sessionData=await directLogin(email,password);dbg('LOGIN 4/7: Supabase Auth direto autenticou')}const token=sessionData.session?.access_token;if(!token)throw new Error('session_missing');const contextResponse=await broker({action:'industry_context',access_token:token},token,15000);const context=Array.isArray(contextResponse.body)?contextResponse.body[0]:contextResponse.body;dbg('LOGIN 5/7: industry_context HTTP '+contextResponse.r.status);if(!contextResponse.r.ok||!context?.industry_id||context.industry_status!=='active')throw Object.assign(new Error('Conta sem indústria ativa'),{code:'industry_context_error'});dbg('LOGIN 6/7: autenticação + indústria OK');show('Login realizado. Entrando no Pulse…');location.replace('./app.html');dbg('LOGIN 7/7: redirect iniciado')}
catch(e){show('Não foi possível entrar. Verifique os dados da conta ou use "Esqueci minha senha".','error');dbg('LOGIN ERROR: '+(e.code||'login')+' | status='+(e.status||'')+' | '+(e.message||e));try{await client.auth.signOut()}catch{}submit.disabled=false}
};
if(!recoveryMode){try{const {data}=await client.auth.getSession();if(data?.session){const token=data.session.access_token;const r=await timed(fetch(url+'/functions/v1/pulse-auth-broker',{method:'POST',headers:{apikey:key,'Content-Type':'application/json','Origin':location.origin},body:JSON.stringify({action:'industry_context',access_token:token}),cache:'no-store'}),15000);const ctx=await r.json().catch(()=>null);const context=Array.isArray(ctx)?ctx[0]:ctx;if(r.ok&&context?.industry_id&&context.industry_status==='active')location.replace('./app.html')}}catch(e){dbg('INIT SESSION CHECK: '+(e.message||e))}}
})();
</script></body></html>
<!-- Auth transport: browser sends credentials only to the project's Supabase Edge Function; the function forwards them to Supabase Auth over TLS and never stores them. -->
