<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopplosion Pulse — Entrar</title><style>body{font-family:system-ui;max-width:430px;margin:60px auto;padding:24px}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#e51b67;color:#fff;border:0;border-radius:8px;font-weight:700}.msg{margin-top:12px;padding:12px;background:#f8f9fb}.error{background:#fff1f2;color:#a51d35}</style></head><body><strong>SHOPPLOSION PULSE</strong><h1>Entrar</h1><form id="f"><input id="e" type="email" autocomplete="username" placeholder="E-mail" required><input id="p" type="password" autocomplete="current-password" placeholder="Senha" required><button id="b">Entrar no Pulse</button></form><div id="m" class="msg"></div><script src="./pulse-config.js"></script><script>(()=>{const c=window.PULSE_SUPABASE_CONFIG||{},m=document.getElementById('m'),b=document.getElementById('b'),key='sb-'+new URL(c.url).hostname.split('.')[0]+'-auth-token';document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();b.disabled=true;m.textContent='Autenticando…';localStorage.removeItem(key);const x=new AbortController(),t=setTimeout(()=>x.abort(),15000);try{const r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',mode:'cors',credentials:'omit',headers:{apikey:c.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('e').value.trim(),password:document.getElementById('p').value}),cache:'no-store',signal:x.signal}),j=await r.json().catch(()=>({}));if(!r.ok){m.className='msg error';m.textContent=r.status===400?'E-mail ou senha incorretos.':r.status===429?'Muitas tentativas. Aguarde e tente novamente.':'Falha de autenticação ('+r.status+').';b.disabled=false;return}if(!j.access_token||!j.refresh_token){throw new Error('Resposta de autenticação inválida.')}localStorage.setItem(key,JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_in:Number(j.expires_in||3600),expires_at:Number(j.expires_at||Math.floor(Date.now()/1000)+Number(j.expires_in||3600)),token_type:j.token_type||'bearer',user:j.user||null}));m.textContent='Login realizado. Entrando no Pulse…';location.replace('./app.html')}catch(err){m.className='msg error';m.textContent=err.name==='AbortError'?'O serviço de autenticação demorou para responder.':'Erro ao conectar ao serviço de autenticação.';b.disabled=false}finally{clearTimeout(t)}}})();</script></body></html>
