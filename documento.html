<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:#f6f7fb}header{background:#fff;border-bottom:1px solid #e6e9ef;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 28px;position:sticky;top:0;z-index:5}.brand{font-weight:850;color:#e51b67;letter-spacing:.02em;white-space:nowrap}.headerRight{display:flex;align-items:center;gap:18px}.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.nav a{display:inline-flex;align-items:center;padding:9px 12px;border-radius:9px;color:#596274;text-decoration:none;font-size:13px;font-weight:750}.nav a:hover{background:#f3f4f7;color:#172033}.identity{display:flex;align-items:center;gap:9px;font-size:13px;color:#596274}.identity strong{color:#172033}.identity button{border:0;border-radius:10px;padding:9px 12px;background:#fff1f2;color:#a51d35;font:inherit;font-weight:750;cursor:pointer}.wrap{width:min(900px,calc(100% - 32px));margin:28px auto 60px}.hero,.panel{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:24px;box-shadow:0 12px 35px #1720330d}.eyebrow{font-size:12px;font-weight:800;color:#e51b67;text-transform:uppercase;letter-spacing:.08em}.breadcrumb{margin:0 0 10px;font-size:12px;color:#788294}.breadcrumb a{color:#788294}.hero h1{margin:6px 0 8px;font-size:26px;word-break:break-word}.hero p.muted{margin:0;color:#5f6878;line-height:1.5;font-size:13px}.tabs{display:flex;gap:6px;margin-top:18px;border-bottom:1px solid #edf0f4}.tabs button{border:0;background:none;padding:10px 14px;font:750 13px inherit;color:#788294;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.active{color:#e51b67;border-color:#e51b67}.tabpanel{margin-top:18px}.tabpanel[hidden]{display:none}.chunkCard{border:1px solid #e4e8ef;border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}.chunkCard.highlight{border-color:#e51b67;box-shadow:0 0 0 3px #fde3ec}.chunkHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.chunkHead .badge{font-size:11px;background:#eef1f6;color:#596274;border-radius:999px;padding:4px 8px;white-space:nowrap}.chunkActions{display:flex;gap:6px;flex-wrap:wrap}.chunkActions button{border:1px solid #e1e4ea;border-radius:8px;padding:7px 10px;background:#fff;color:#4f5868;font:700 11px inherit;cursor:pointer}.chunkActions button:hover{background:#f7f6f4}.chunkContent{margin-top:10px;color:#384254;line-height:1.6;font-size:14px;white-space:pre-wrap}.evidenceTags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.evTag{font-size:11px;padding:4px 8px;border-radius:999px;background:#fff8fb;color:#a3164e;border:1px solid #f2d3e0}.markForm{margin-top:12px;padding:14px;border-radius:12px;background:#f8f9fb;display:none;gap:10px}.markForm.open{display:grid}.markForm label{font-size:11px;font-weight:750;color:#596274;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}.markForm textarea,.markForm select,.markForm input{width:100%;border:1px solid #cdd4df;border-radius:9px;padding:9px 10px;font:inherit;font-size:13px}.markForm textarea{min-height:60px;resize:vertical}.markRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.markForm .actions{display:flex;gap:8px;justify-content:flex-end}.markForm .actions button{border:0;border-radius:9px;padding:9px 14px;font:750 12px inherit;cursor:pointer}.markForm .save{background:#e51b67;color:#fff}.markForm .cancel{background:#eef1f6;color:#172033}.evidenceCard{border:1px solid #e4e8ef;border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}.evidenceCard .claim{font-size:14px;color:#172033;line-height:1.5}.evidenceMeta{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#788294}.confPill{font-weight:750;border-radius:999px;padding:3px 8px}.confPill.alta{background:#effaf3;color:#176b3a}.confPill.media{background:#fff7e6;color:#8a6100}.confPill.baixa{background:#fff1f2;color:#a51d35}.evidenceReason{margin-top:6px;color:#596274;font-size:12px}.empty{padding:18px;border-radius:10px;background:#f8f9fb;color:#687284;font-size:13px}.msg{display:none;margin:14px 0;padding:12px;border-radius:10px;font-size:14px}.msg.show{display:block}.msg.error{background:#fff1f2;color:#a51d35}.msg.ok{background:#effaf3;color:#176b3a}

<link rel="stylesheet" href="./pulse-tokens.css?v=20260920.01"><link rel="stylesheet" href="./pulse-shell.css?v=20260920.01"><link rel="stylesheet" href="./pulse-v2.css?v=20260920.01"></head>
<body>
<header><div class="brand">SHOPPLOSION PULSE</div><div class="headerRight"><nav class="nav" aria-label="Navegação principal"><a href="./index.html">Universo Pulse</a><a href="./app.html?v=20260919.31">Minha indústria</a><a href="./ask.html?v=20260919.31">Ask AI privado</a></nav><div class="identity"><strong id="userEmail">—</strong><span id="industryName">Validando...</span><button id="logout" type="button">Sair</button></div></div></header>
<main class="wrap">
<div class="breadcrumb"><a href="./app.html?v=20260919.31#documents">Minha indústria</a> › <a href="./app.html?v=20260919.31#documents">Documentos</a> › <span id="crumbName">Documento</span></div>
<section class="hero">
  <div class="eyebrow">Documento</div>
  <h1 id="docTitle">Carregando…</h1>
  <p class="muted" id="docMeta"></p>
  <div class="tabs" role="tablist">
    <button type="button" data-tab="conteudo" class="active" role="tab" aria-selected="true">Conteúdo</button>
    <button type="button" data-tab="evidencias" role="tab" aria-selected="false">Evidências</button>
  </div>
  <div id="message" class="msg" role="status" aria-live="polite"></div>
</section>
<section class="tabpanel" id="panel-conteudo"><div id="chunks"><div class="empty">Carregando blocos indexados…</div></div></section>
<section class="tabpanel" id="panel-evidencias" hidden><div id="evidenceList"><div class="empty">Carregando evidências…</div></div></section>
</main>
<script src="./pulse-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
  const cfg=window.PULSE_SUPABASE_CONFIG||{};
  const msg=document.getElementById('message');
  const show=(text,type='ok')=>{msg.textContent=text;msg.className='msg show '+type};
  const redirect=()=>location.replace('./auth.html');
  if(!cfg.url||!cfg.anonKey||!window.supabase?.createClient){show('Configuração do Supabase indisponível.','error');return}
  const client=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const params=new URLSearchParams(location.search);
  const docId=params.get('id');
  const focusChunk=params.get('chunk')?Number(params.get('chunk')):null;
  if(!docId){show('Nenhum documento indicado na URL.','error');return}
  let session=null;
  try{
    const current=await client.auth.getSession();
    if(current.data?.session){session=current.data.session}
    else{
      const storageKey='sb-'+new URL(cfg.url).hostname.split('.')[0]+'-auth-token';
      let stored=null;try{stored=JSON.parse(localStorage.getItem(storageKey)||'null')}catch{}
      const accessToken=stored?.access_token||stored?.currentSession?.access_token;
      const refreshToken=stored?.refresh_token||stored?.currentSession?.refresh_token;
      if(accessToken&&refreshToken){const restored=await client.auth.setSession({access_token:accessToken,refresh_token:refreshToken});if(restored.error||!restored.data?.session)throw restored.error||new Error('session_restore_failed');session=restored.data.session}
    }
    if(!session){redirect();return}
  }catch(e){redirect();return}
  const user=session.user;
  let context=null;
  try{
    const r=await fetch(cfg.url+'/functions/v1/pulse-auth-broker',{method:'POST',headers:{apikey:cfg.anonKey,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json','Origin':location.origin},body:JSON.stringify({action:'industry_context',access_token:session.access_token}),cache:'no-store'});
    const body=await r.json().catch(()=>null);
    if(!r.ok)throw new Error('broker_http_'+r.status);
    context=Array.isArray(body)?body[0]:body;
  }catch(e){show('Não foi possível validar a indústria agora.','error');return}
  if(!context?.industry_id||context.industry_status!=='active'){show('A conta não possui uma indústria ativa.','error');return}
  const industry={id:context.industry_id,name:context.industry_name,status:context.industry_status};
  document.getElementById('industryName').textContent=industry.name;
  document.getElementById('userEmail').textContent=user.email||'';
  const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
  const fmtDate=v=>v?new Date(v).toLocaleDateString('pt-BR'):null;

  let doc=null,chunks=[],evidenceRows=[];

  const loadDocument=async()=>{
    const {data,error}=await client.from('documents').select('id,filename,mime_type,created_at').eq('id',docId).eq('industry_id',industry.id).maybeSingle();
    if(error||!data){document.getElementById('docTitle').textContent='Documento não encontrado';document.getElementById('docMeta').textContent='Este documento não existe ou não pertence à sua indústria.';return false}
    doc=data;
    document.getElementById('docTitle').textContent=doc.filename;
    document.getElementById('crumbName').textContent=doc.filename;
    document.title='Shopplosion Pulse — '+doc.filename;
    document.getElementById('docMeta').textContent=(doc.mime_type||'arquivo')+' • enviado em '+new Date(doc.created_at).toLocaleString('pt-BR')+' • escopo: '+industry.name;
    return true;
  };

  const loadEvidence=async()=>{
    const {data,error}=await client.from('evidence').select('id,document_chunk_id,claim,period_start,period_end,confidence,confidence_reason,created_at').eq('document_id',docId).eq('industry_id',industry.id).order('created_at',{ascending:false});
    evidenceRows=error?[]:(data||[]);
  };

  const evidenceCountFor=chunkId=>evidenceRows.filter(e=>e.document_chunk_id===chunkId).length;

  const renderChunks=()=>{
    const box=document.getElementById('chunks');
    if(!chunks.length){box.innerHTML='<div class="empty"><strong>Este documento ainda não foi indexado.</strong> Volte para Minha indústria e use “Indexar” para extrair o texto, ou anexe uma versão com texto selecionável.</div>';return}
    box.innerHTML=chunks.map(c=>{
      const n=c.chunk_index+1,count=evidenceCountFor(c.id);
      return '<div class="chunkCard" id="chunk-'+n+'" data-chunk-id="'+esc(c.id)+'"><div class="chunkHead"><span class="badge">bloco '+n+' • '+esc(c.source_type||'text')+'</span><div class="chunkActions"><button type="button" data-copy-link="'+n+'">Copiar link do bloco</button><button type="button" data-mark="'+esc(c.id)+'">Marcar evidência</button></div></div><div class="chunkContent">'+esc(c.content)+'</div>'
        +(count?'<div class="evidenceTags">'+Array(count).fill(0).map(()=>'<span class="evTag">evidência qualificada</span>').join('')+'</div>':'')
        +'<form class="markForm" data-form-for="'+esc(c.id)+'"><div><label>Afirmação (claim)</label><textarea required maxlength="500" placeholder="Ex.: O preço médio subiu 8% no período."></textarea></div><div class="markRow"><div><label>Período — início</label><input type="date"></div><div><label>Período — fim</label><input type="date"></div></div><div class="markRow"><div><label>Confiança</label><select><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select></div><div><label>Motivo (opcional)</label><input type="text" maxlength="240" placeholder="Por que essa confiança?"></div></div><div class="actions"><button type="button" class="cancel" data-cancel>Cancelar</button><button type="submit" class="save">Salvar evidência</button></div></form>'
        +'</div>';
    }).join('');
    box.querySelectorAll('[data-mark]').forEach(btn=>btn.addEventListener('click',()=>{
      const form=box.querySelector('[data-form-for="'+CSS.escape(btn.getAttribute('data-mark'))+'"]');
      form.classList.toggle('open');
    }));
    box.querySelectorAll('[data-cancel]').forEach(btn=>btn.addEventListener('click',()=>{btn.closest('.markForm').classList.remove('open')}));
    box.querySelectorAll('[data-copy-link]').forEach(btn=>btn.addEventListener('click',async()=>{
      const n=btn.getAttribute('data-copy-link');
      const link=location.origin+location.pathname+'?id='+encodeURIComponent(docId)+'&chunk='+n;
      try{await navigator.clipboard.writeText(link);btn.textContent='Link copiado';setTimeout(()=>btn.textContent='Copiar link do bloco',1600)}catch{btn.textContent='Copie o endereço da página'}
    }));
    box.querySelectorAll('form.markForm').forEach(form=>form.addEventListener('submit',async(ev)=>{
      ev.preventDefault();
      const chunkId=form.getAttribute('data-form-for');
      const claim=form.querySelector('textarea').value.trim();
      if(!claim){show('Escreva a afirmação antes de salvar.','error');return}
      const [startInput,endInput]=form.querySelectorAll('input[type="date"]');
      const confidence=form.querySelector('select').value;
      const reason=form.querySelector('input[type="text"]').value.trim();
      const saveBtn=form.querySelector('.save');saveBtn.disabled=true;show('Salvando evidência…','ok');
      const {error}=await client.from('evidence').insert({industry_id:industry.id,document_id:docId,document_chunk_id:chunkId,claim,period_start:startInput.value||null,period_end:endInput.value||null,confidence,confidence_reason:reason||null,created_by:user.id});
      saveBtn.disabled=false;
      if(error){show('Não foi possível salvar a evidência: '+error.message,'error');return}
      show('Evidência qualificada e registrada.','ok');
      form.reset();form.classList.remove('open');
      await loadEvidence();renderChunks();renderEvidence();
      const card=document.getElementById('chunk-'+(chunks.find(c=>c.id===chunkId)?.chunk_index+1));
      card?.scrollIntoView({behavior:'smooth',block:'center'});
    }));
    if(focusChunk){
      const target=document.getElementById('chunk-'+focusChunk);
      if(target){target.classList.add('highlight');setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center'}),50)}
    }
  };

  const renderEvidence=()=>{
    const box=document.getElementById('evidenceList');
    if(!evidenceRows.length){box.innerHTML='<div class="empty"><strong>Nenhuma evidência qualificada ainda.</strong> Use “Marcar evidência” em um bloco na aba Conteúdo para registrar uma afirmação com período e confiança.</div>';return}
    const chunkIndexOf=id=>{const c=chunks.find(x=>x.id===id);return c?c.chunk_index+1:null};
    box.innerHTML=evidenceRows.map(e=>{
      const n=chunkIndexOf(e.document_chunk_id);
      const period=[fmtDate(e.period_start),fmtDate(e.period_end)].filter(Boolean).join(' → ');
      return '<div class="evidenceCard"><div class="claim">'+esc(e.claim)+'</div><div class="evidenceMeta">'
        +(n?'<a href="#chunk-'+n+'" data-jump="'+n+'">bloco '+n+'</a>':'')
        +(period?'<span>'+esc(period)+'</span>':'')
        +'<span class="confPill '+esc(e.confidence)+'">'+esc(e.confidence)+'</span>'
        +'<span>'+new Date(e.created_at).toLocaleDateString('pt-BR')+'</span></div>'
        +(e.confidence_reason?'<div class="evidenceReason">'+esc(e.confidence_reason)+'</div>':'')
        +'</div>';
    }).join('');
    box.querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',(ev)=>{ev.preventDefault();const n=a.getAttribute('data-jump');showTab('conteudo');const target=document.getElementById('chunk-'+n);target?.scrollIntoView({behavior:'smooth',block:'center'});target?.classList.add('highlight')}));
  };

  const showTab=name=>{
    document.querySelectorAll('.tabs button').forEach(b=>{const active=b.getAttribute('data-tab')===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});
    document.getElementById('panel-conteudo').hidden=name!=='conteudo';
    document.getElementById('panel-evidencias').hidden=name!=='evidencias';
  };
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>showTab(b.getAttribute('data-tab'))));

  const ok=await loadDocument();
  if(!ok)return;
  const {data:chunkRows,error:chunkError}=await client.from('document_chunks').select('id,chunk_index,content,source_type').eq('document_id',docId).eq('industry_id',industry.id).order('chunk_index',{ascending:true});
  chunks=chunkError?[]:(chunkRows||[]);
  await loadEvidence();
  renderChunks();renderEvidence();
  document.getElementById('logout').addEventListener('click',async()=>{try{await client.auth.signOut()}finally{redirect()}});
})().catch(error=>{console.error('pulse-documento-init',error);const el=document.getElementById('message');if(el){el.textContent='Não foi possível carregar o documento.';el.className='msg show error'}});
</script>
<script src="./pulse-shell.js?v=20260920.01"></script></body>
</html>
