/* Pulse visual shell: thin trend line using only explicit series/trend values or observed evidence periods. */
(function(){
  'use strict';
  function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function nums(v){return Array.isArray(v)?v.map(Number).filter(Number.isFinite):String(v||'').split(/[,;\s]+/).map(Number).filter(Number.isFinite)}
  function cardSeries(card){
    var attrs=['data-series','data-trend','data-sparkline'];
    for(var i=0;i<attrs.length;i++){
      var raw=card.getAttribute(attrs[i]);
      if(raw){try{var parsed=JSON.parse(raw);var values=nums(parsed);if(values.length>=2)return values}catch(e){var fallback=nums(raw);if(fallback.length>=2)return fallback}}
    }
    var pool=window.PULSE_EVIDENCE||window.__PULSE_EVIDENCE||window.PULSE_SOURCES||[];
    if(!Array.isArray(pool)||pool.length<2)return [];
    var label=(card.querySelector('h3,h4,strong,[data-label],.label,.metric-label,.kpi-label')||{}).textContent||'';
    var words=label.toLowerCase().split(/\W+/).filter(function(w){return w.length>3});
    var matched=pool.filter(function(o){var text=[o.category,o.topic,o.channel,o.name,o.title].filter(Boolean).join(' ').toLowerCase();return words.some(function(w){return text.indexOf(w)>=0})});
    if(matched.length<2)matched=pool;
    var periods={};matched.forEach(function(o){var p=o.date||o.published_at||o.publishedAt||o.period||o.year;if(p)periods[String(p)]=(periods[String(p)]||0)+1});
    var keys=Object.keys(periods).sort().slice(-8);if(keys.length<2)return [];
    var out=keys.map(function(k){return periods[k]});return out.some(function(v){return v!==out[0]})?out:[];
  }
  function draw(card){
    if(card.querySelector('.pulse-indicator-sparkline-wrap'))return;
    var values=cardSeries(card);if(values.length<2)return;
    var width=180,height=28,min=Math.min.apply(Math,values),span=Math.max.apply(Math,values)-min||1;
    var path=values.map(function(v,i){var x=i/(values.length-1)*width,y=height-3-(v-min)/span*(height-7);return(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
    var wrap=document.createElement('div');wrap.className='pulse-indicator-sparkline-wrap';wrap.setAttribute('aria-label','Tendência histórica observada');
    wrap.innerHTML='<svg class="pulse-indicator-sparkline" viewBox="0 0 180 28" preserveAspectRatio="none" role="img"><path class="baseline" d="M0 25 H180"></path><path d="'+path+'"></path></svg>';
    card.appendChild(wrap);
  }
  function run(){var seen=[];['[data-indicator-card]','.indicator-card','.metric-card','.kpi-card','.stat-card','.pulse-kpi','.pulse-indicator'].forEach(function(sel){qsa(sel).forEach(function(card){if(seen.indexOf(card)<0){seen.push(card);draw(card)}})});}
  function init(){if(document.getElementById('pulse-indicator-sparkline-styles'))return;var style=document.createElement('style');style.id='pulse-indicator-sparkline-styles';style.textContent='.pulse-indicator-sparkline-wrap{margin-top:10px}.pulse-indicator-sparkline{display:block;width:100%;height:28px;overflow:visible}.pulse-indicator-sparkline path{fill:none;stroke:var(--pink,#E51B67);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pulse-indicator-sparkline .baseline{stroke:rgba(20,19,27,.08);stroke-width:1}';document.head.appendChild(style);run();/* Public Universe has no global DOM observer. */}

function inspector(){if(q('#pv3-inspector'))return;var p=document.createElement('aside');p.id='pv3-inspector';p.className='pv3-inspector';p.setAttribute('aria-hidden','true');p.setAttribute('aria-label','Inspetor de evidência');p.innerHTML='<div class="pv3-inspector-head"><div><span>INSPETOR</span><h2 id="pv3-inspector-title">Detalhes da evidência</h2></div><button type="button" id="pv3-inspector-close">Fechar</button></div><div id="pv3-inspector-body"></div>';document.body.appendChild(p);q('#pv3-inspector-close').onclick=close;document.addEventListener('keydown',function(e){if(e.key==='Escape')close()})}
function close(){var p=q('#pv3-inspector');if(p){p.classList.remove('open');p.setAttribute('aria-hidden','true');if(window.__pv3InspectorOrigin)window.__pv3InspectorOrigin.focus()}}
function open(e){inspector();var p=q('#pv3-inspector'),b=q('#pv3-inspector-body'),source=e.fonte||e.sourceName||'Fonte não informada',period=e.periodo||'Período não informado';b.innerHTML='<section><small>FATO · ORIGEM DO TRECHO</small><p>'+esc(e.fato||e.text||e.excerpt||'')+'</p></section><section><small>CONTEXTO</small><p>'+esc(e.contexto||'Contexto não informado.')+'</p></section><section><small>INTERPRETAÇÃO</small><p>'+esc(e.interpretacao||'Nenhuma interpretação registrada.')+'</p></section><section><small>HIPÓTESE</small><p>'+esc(e.hipotese||'Validar esta hipótese com evidências adicionais.')+'</p></section><section><small>PRÓXIMA AÇÃO</small><p>'+esc(e.acao||'Investigar antes de decidir.')+'</p></section><dl><div><dt>Fonte</dt><dd>'+esc(source)+'</dd></div><div><dt>Período</dt><dd>'+esc(period)+'</dd></div><div><dt>Confiança</dt><dd>'+esc(e.confianca||'Não classificada')+'</dd></div><div><dt>ID</dt><dd>'+esc(e.id||'—')+'</dd></div></dl><div class="pv3-inspector-relations"><strong>Relações</strong><span>3 evidências próximas</span><span>Respostas citando este objeto</span><span>Análises que o utilizam</span></div><div class="pv3-inspector-actions"><button type="button" data-action="ask">Perguntar</button><button type="button" data-action="save">Guardar</button><button type="button" class="primary" data-action="use">Usar na análise</button></div>';b.querySelector('[data-action=ask]').onclick=function(){location.href=routes.investigacao+(e&&e.id?'?evidence='+encodeURIComponent(e.id):'')};b.querySelector('[data-action=save]').onclick=function(){localStorage.setItem('pulse:saved:'+String(e.id||''),'1');this.textContent='Guardado'};b.querySelector('[data-action=use]').onclick=function(){var ids=JSON.parse(localStorage.getItem('pulse:analysis-queue')||'[]');if(e.id&&!ids.includes(e.id))ids.push(e.id);localStorage.setItem('pulse:analysis-queue',JSON.stringify(ids));this.textContent='Enfileirada'};p.classList.add('open');p.setAttribute('aria-hidden','false');q('#pv3-inspector-close').focus();window.__pv3InspectorOrigin=document.activeElement}
function styles(){if(q('#pv3-inspector-inline-styles'))return;var s=document.createElement('style');s.id='pv3-inspector-inline-styles';s.textContent='.pv3-scope-switch{padding:0 4px 12px}.pv3-scope-switch label{display:block;font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;color:#8a909b;margin:0 6px 5px}.pv3-scope-switch select{width:100%;min-height:38px;border:1px solid #e5e1db;border-radius:8px;background:#fff;color:#4a4852;padding:0 7px;font:650 10px Inter,system-ui,sans-serif}.pv3-scope-switch select:focus-visible{outline:2px solid #e51b67;outline-offset:2px}.pv3-breadcrumb{display:flex;gap:7px;align-items:center;margin-bottom:8px;font-size:11px;color:#667085;font-weight:700}.pv3-breadcrumb strong{color:#101828}.pv3-inspect-action{margin-top:10px;min-height:44px;border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:850;color:#28447e;cursor:pointer}.pv3-inspector{position:fixed;z-index:1400;top:0;right:0;width:360px;height:100vh;overflow:auto;padding:20px;background:#fff;border-left:1px solid #e4e7ec;box-shadow:-12px 0 35px rgba(16,24,40,.14);transform:translateX(105%);transition:transform .2s ease}.pv3-inspector.open{transform:translateX(0)}.pv3-inspector-head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eaecf0;padding-bottom:14px}.pv3-inspector-head span,.pv3-inspector section small{font-size:9px;font-weight:950;letter-spacing:.1em;color:#e51b67}.pv3-inspector h2{margin:4px 0 0;font-size:20px}.pv3-inspector-head button{min-width:44px;min-height:44px;border:1px solid #d0d5dd;background:#fff;border-radius:8px;font-size:11px;font-weight:800}.pv3-inspector section{padding:13px 0;border-bottom:1px solid #f0f2f5}.pv3-inspector section p{margin:5px 0 0;font-size:13px;line-height:1.55;color:#344054}.pv3-inspector dl{display:grid;gap:7px}.pv3-inspector dl div{display:flex;justify-content:space-between;border-bottom:1px solid #f2f4f7;padding:8px 0}.pv3-inspector dt{font-size:11px;color:#667085}.pv3-inspector dd{margin:0;font-size:11px;font-weight:850;text-align:right}.pv3-inspector-relations{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid #f0f2f5;font-size:12px;color:#667085}.pv3-inspector-relations strong{color:#101828}.pv3-inspector-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:14px}.pv3-inspector-actions button{min-height:44px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-weight:800;cursor:pointer}.pv3-inspector-actions .primary{grid-column:1/-1;background:#e51b67;border-color:#e51b67;color:#fff}.pv3-inspector[aria-hidden="true"]{pointer-events:none}.pv3-conducao{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 16px;padding:14px 16px;border:1px solid #e8b6ca;border-radius:12px;background:#fff7fa}.pv3-conducao p{margin:4px 0 0;color:#5a1d38;font-size:12px;line-height:1.45}.pv3-conducao>div:last-child{display:flex;gap:8px;align-items:center}.pv3-conducao button{min-height:44px;border:1px solid #e8b6ca;border-radius:8px;background:#fff;color:#8f1648;font-weight:750}.pv3-conducao .pv3-action{min-height:44px}@media(max-width:640px){.pv3-scope-switch{display:none}.pv3-inspector{top:auto;bottom:0;left:0;right:0;width:100%;height:min(78vh,620px);border-left:0;border-top:1px solid #e4e7ec;border-radius:14px 14px 0 0;transform:translateY(105%)}.pv3-inspector.open{transform:translateY(0)}.pv3-conducao{align-items:stretch;flex-direction:column}.pv3-conducao>div:last-child{justify-content:flex-end;flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.pv3-inspector{transition:none!important}}';document.head.appendChild(s)}
function bind(){qa('.pv3-item[data-evidence-id]').forEach(function(item){if(item.querySelector('.pv3-inspect-action'))return;var btn=document.createElement('button');btn.type='button';btn.className='pv3-inspect-action';btn.textContent='Ver evidência';btn.onclick=function(ev){ev.stopPropagation();var id=item.getAttribute('data-evidence-id'),e=(window.PULSE_EVIDENCE||[]).find(function(x){return String(x.id)===String(id)});if(e)open(e)};item.appendChild(btn)})}
function boot(){styles();inspector();breadcrumb();bind();window.PULSE_OPEN_INSPECTOR=open;window.PULSE_CLOSE_INSPECTOR=close}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,0)});else setTimeout(boot,0);

<!-- PULSE_PRODUCT_V6 -->
<script>
(()=>{
'use strict';
if(window.__PULSE_PRODUCT_V6__)return;window.__PULSE_PRODUCT_V6__=true;
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const arr=v=>Array.isArray(v)?v:[];
const evidence=arr(window.PULSE_EVIDENCE||window.__PULSE_EVIDENCE||window.PULSE_SOURCES);
const claims=arr(window.PULSE_CLAIMS||window.__PULSE_CLAIMS);
const titleOf=o=>o.title||o.name||o.topic||o.claim||'Sinal';
const dateOf=o=>o.date||o.published_at||o.publishedAt||o.period||o.year||null;
const textOf=o=>[o.title,o.name,o.topic,o.claim,o.text,o.summary,o.category,o.channel].filter(Boolean).join(' ').toLowerCase();
const quality=o=>{let s=0;if(o.source||o.url||o.href)s+=25;if(dateOf(o))s+=20;if(o.title||o.name)s+=15;if(o.text||o.summary||o.claim)s+=20;if(o.category||o.topic)s+=10;if(o.region||o.channel)s+=10;return Math.min(100,s)};
const score=o=>{const q=quality(o),r=Number(o.relevance??o.relevanceScore??0),rec=Number(o.recency??0);return Math.round(Math.min(100,q*.55+Math.min(25,Math.max(0,r))+Math.min(20,Math.max(0,rec))))};
const parseDate=v=>{if(v==null)return null;const s=String(v);const m=s.match(/^(\d{4})(?:[-/](\d{1,2}))?(?:[-/](\d{1,2}))?/);if(m)return new Date(Date.UTC(+m[1],(+(m[2]||1))-1,+(m[3]||1)));const d=new Date(s);return Number.isNaN(d.getTime())?null:d};
const periodKey=o=>{const d=parseDate(dateOf(o));return d?`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`:(dateOf(o)?String(dateOf(o)):'Sem período')};
const qualityBand=s=>s>=80?'Alta':s>=55?'Moderada':s>0?'Baixa':'Insuficiente';
function derive(){
 const pool=(evidence.length?evidence:claims).filter(Boolean);
 const ranked=pool.map((o,i)=>({...o,__score:score(o),__quality:quality(o),__i:i,__period:periodKey(o)})).sort((a,b)=>b.__score-a.__score);
 const groups={}; ranked.forEach(o=>{const k=o.category||o.topic||o.channel||'Geral';(groups[k]??=[]).push(o)});
 const opportunities=Object.entries(groups).map(([key,v])=>({key,score:Math.round(v.reduce((a,x)=>a+x.__score,0)/v.length),count:v.length,quality:Math.round(v.reduce((a,x)=>a+x.__quality,0)/v.length),top:v[0]})).sort((a,b)=>b.score-a.score).slice(0,5);
 const periods=[...new Set(pool.map(periodKey).filter(x=>x!=='Sem período'))].sort();
 const latest=periods.at(-1), previous=periods.at(-2);
 const temporal=[];
 if(latest&&previous){
   const by=o=>{const k=o.category||o.topic||o.channel||titleOf(o);return k};
   const a={},b={};pool.filter(o=>periodKey(o)===latest).forEach(o=>{const k=by(o);a[k]=(a[k]||0)+1});pool.filter(o=>periodKey(o)===previous).forEach(o=>{const k=by(o);b[k]=(b[k]||0)+1});
   [...new Set([...Object.keys(a),...Object.keys(b)])].map(k=>({key:k,current:a[k]||0,previous:b[k]||0,delta:(a[k]||0)-(b[k]||0)})).sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta)).slice(0,5).forEach(x=>temporal.push(x));
 }
 return{pool,ranked,opportunities,periods,latest,previous,temporal};
}
function render(){
 const old=document.getElementById('pulse-v6-lab');if(old)old.remove();const d=derive();if(!d.pool.length)return;
 const recommendations=d.opportunities.slice(0,3).map(x=>`<div class="pulse-v6-row"><b>${esc(x.key)}</b><small>Próximo passo: validar a oportunidade com evidências específicas, contexto da categoria e impacto potencial antes de recomendar ação.</small></div>`).join('');
 const temporal=d.temporal.length?d.temporal.map(x=>`<div class="pulse-v6-row"><b>${esc(x.key)}</b><span>${x.delta>0?'+':''}${x.delta}</span><small>${esc(d.previous)} → ${esc(d.latest)} · contagem observada: ${x.previous} → ${x.current}. Isso não implica causalidade.</small></div>`).join(''):`<p>Ainda não há dois períodos comparáveis suficientes para afirmar mudança temporal.</p>`;
 const exec=`<div class="pulse-v6-exec"><strong>Leitura executiva</strong><p>${d.opportunities.slice(0,3).map(x=>esc(x.key)).join(' · ')} são os principais focos pelo score heurístico atual. Use-os como agenda de investigação, não como conclusão causal.</p></div>`;
 const el=document.createElement('section');el.id='pulse-v6-lab';el.setAttribute('aria-label','Pulse Intelligence Lab');
 el.innerHTML=`<div class="pulse-v6-head"><div><div class="pulse-v6-kicker">PULSE INTELLIGENCE LAB · EVOLUÇÃO</div><h2>Da evidência à decisão</h2><p>Scores transparentes e heurísticos. Não representam significância estatística, causalidade ou probabilidade.</p></div><div class="pulse-v6-actions"><button type="button" id="pulse-v6-copy">Copiar leitura</button><button type="button" id="pulse-v6-print">Visão executiva</button></div></div>${exec}<div class="pulse-v6-grid"><article><h3>Signal Score</h3>${d.ranked.slice(0,5).map((x,i)=>`<div class="pulse-v6-row"><b>${i+1}. ${esc(titleOf(x))}</b><span>${x.__score}/100</span><small>qualidade: ${x.__quality}/100 · ${qualityBand(x.__quality)}</small></div>`).join('')}</article><article><h3>Oportunidades prioritárias</h3>${d.opportunities.map(x=>`<div class="pulse-v6-row"><b>${esc(x.key)}</b><span>${x.score}/100</span><small>${x.count} evidência(s) · qualidade média ${x.quality}/100</small></div>`).join('')}</article><article><h3>Qualidade das evidências</h3><p>Metadados observáveis determinam o score: fonte, data, título, conteúdo, categoria, região/canal.</p><div class="pulse-v6-quality">${['Alta','Moderada','Baixa','Insuficiente'].map(b=>`<span><b>${b}</b> ${d.ranked.filter(x=>qualityBand(x.__quality)===b).length}</span>`).join('')}</div></article><article><h3>Comparação temporal</h3>${d.previous&&d.latest?`<p><b>${esc(d.previous)} → ${esc(d.latest)}</b></p>${temporal}`:temporal}</article><article class="pulse-v6-wide"><h3>Próximas ações de investigação</h3>${recommendations}</article></div>`;
 document.body.appendChild(el);
 document.getElementById('pulse-v6-print')?.addEventListener('click',()=>window.print());
 document.getElementById('pulse-v6-copy')?.addEventListener('click',async()=>{const text=`Leitura executiva\n${d.opportunities.slice(0,3).map((x,i)=>`${i+1}. ${x.key} — ${x.score}/100`).join('\n')}\n\nScores heurísticos; validar antes de concluir.`;try{await navigator.clipboard.writeText(text);document.getElementById('pulse-v6-copy').textContent='Copiado';setTimeout(()=>document.getElementById('pulse-v6-copy').textContent='Copiar leitura',1400)}catch(e){}});
}
const css=document.createElement('style');css.textContent='#pulse-v6-lab{margin:32px auto;max-width:1180px;padding:28px;border:1px solid rgba(20,20,20,.12);border-radius:22px;background:#fff;box-shadow:0 12px 36px rgba(0,0,0,.06);font-family:inherit}.pulse-v6-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.pulse-v6-head h2{margin:5px 0;font-size:26px}.pulse-v6-head p{margin:0;opacity:.7}.pulse-v6-actions{display:flex;gap:8px;flex-wrap:wrap}.pulse-v6-actions button{border:1px solid rgba(20,20,20,.15);border-radius:10px;padding:9px 12px;background:#fff;cursor:pointer}.pulse-v6-exec{margin-top:18px;padding:16px;border-radius:14px;background:rgba(20,20,20,.045)}.pulse-v6-exec p{margin:6px 0 0}.pulse-v6-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.pulse-v6-grid article{border:1px solid rgba(20,20,20,.1);border-radius:16px;padding:18px}.pulse-v6-grid h3{margin:0 0 12px}.pulse-v6-row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:10px 0;border-top:1px solid rgba(20,20,20,.08)}.pulse-v6-row span{font-weight:800}.pulse-v6-row small{grid-column:1/-1;opacity:.62}.pulse-v6-wide{grid-column:1/-1}.pulse-v6-quality{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pulse-v6-quality span{padding:10px;border-radius:10px;background:rgba(20,20,20,.045);display:flex;flex-direction:column;gap:2px}@media(max-width:760px){.pulse-v6-head{flex-direction:column}.pulse-v6-grid{grid-template-columns:1fr}.pulse-v6-wide{grid-column:auto}.pulse-v6-quality{grid-template-columns:repeat(2,1fr)}}@media print{#pulse-v6-lab{box-shadow:none;border:0}#pulse-v6-actions,#pulse-v6-copy,#pulse-v6-print{display:none}.pulse-v6-wide{grid-column:1/-1}}';document.head.appendChild(css);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render,{once:true});else render();
})();
</script>
