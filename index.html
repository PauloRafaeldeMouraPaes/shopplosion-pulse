*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink-1);background:var(--surface-canvas)}body{padding-bottom:0}
button,a{font:inherit}a{text-decoration:none;color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:218px 1fr}
.sidebar{border-right:1px solid var(--line-1);background:var(--surface-canvas);padding:24px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;margin-bottom:40px}.brandMark{width:30px;height:30px;border-radius:var(--radius-card);background:var(--brand-soft);display:grid;place-items:center;font-weight:950}
.sideNav{display:grid;gap:6px}.sideNav a{padding:13px 12px;border-radius:var(--radius-panel);color:var(--ink-2);font-weight:700}.sideNav a.active{background:var(--brand-soft);color:var(--brand-pulse-strong)}
.main{min-width:0}.crumb{height:58px;border-bottom:1px solid var(--line-1);display:flex;align-items:center;padding:0 32px;color:var(--ink-3);font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}.crumb b{color:var(--ink-3);margin-left:10px}
.header{padding:28px 40px 22px;border-bottom:1px solid var(--line-1);display:flex;justify-content:space-between;align-items:center;gap:20px}.logos{display:flex;align-items:center;gap:28px}.shop{font-size:25px;font-weight:950;color:var(--ink-1);letter-spacing:-1.5px}.pulse{font-size:20px;font-weight:900}.pulse small{font-size:11px;color:var(--ink-3);font-weight:650;margin-left:8px;letter-spacing:.3px}.universe{font-weight:750;color:var(--ink-2)}.universe span{font-weight:900}
.context{height:54px;background:var(--brand-soft);border-block:1px solid var(--line-1);padding:0 32px;display:flex;align-items:center;gap:18px}.context b{color:var(--brand-pulse-strong)}
.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 189px)}
.journey{background:var(--surface-rail);padding:24px 14px;color:var(--line-1)}.journey h3{font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 10px 18px;color:var(--on-rail-muted)}.step{display:block;padding:13px 10px;border-radius:var(--radius-panel);margin-bottom:5px}.step strong{display:block;font-size:14px;color:var(--surface-app)}.step span{font-size:12px;color:var(--on-rail-muted);display:block;margin-top:4px}.step.active{background:var(--ink-2)}.step.active strong,.step.active span{color:var(--surface-canvas)}.journey-step.is-current b{color:var(--surface-canvas)!important}
.content{padding:38px 34px 70px;max-width:1160px;width:100%;margin:0 auto}.eyebrow{font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}h1{font-family:var(--font-sans);font-size:32px;line-height:34px;letter-spacing:-.03em;font-weight:800;text-wrap:balance;margin:8px 0 12px}.intro{font-size:17px;color:var(--ink-2);max-width:760px;line-height:1.55;margin:0 0 28px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.metric,.card{border:1px solid var(--line-1);border-radius:var(--radius-panel);background:var(--surface-canvas)}.metric{padding:18px}.metric small{color:var(--ink-2);font-weight:750}.metric strong{display:block;font-size:25px;margin-top:7px;color:var(--ink-1);font-variant-numeric:tabular-nums}
.canvas{border:1px solid var(--line-1);border-radius:var(--radius-panel);padding:22px;background:var(--surface-canvas)}.canvasTop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.canvas h2{margin:0;font-size:22px}.canvas p{color:var(--ink-2);line-height:1.5}.badge{font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.op{padding:20px;border:1px solid var(--line-1);border-radius:var(--radius-panel)}.op.primary{border:2px solid var(--brand-soft)}.op .priority{font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.1em;color:var(--ink-3)}.op h3{font-size:16px;line-height:1.25;margin:9px 0 12px}.op p{font-size:13px;margin:0;color:var(--ink-2)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tag{padding:6px 9px;border-radius:var(--radius-chip);background:var(--surface-app);font-family:var(--font-mono);font-size:11px;line-height:14px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}.next{margin-top:18px;border-top:1px solid var(--line-1);padding-top:18px;display:flex;justify-content:space-between;align-items:center}.next span{color:var(--ink-2);font-size:13px}.next a{background:var(--brand-pulse-strong);color:var(--on-brand);padding:10px 14px;border-radius:var(--radius-control);font-weight:600;font-size:14px;line-height:20px}
.bottom{display:none}
@media(max-width:800px){
 body{padding-bottom:0}.app{display:block}.sidebar{display:none}.crumb{height:54px;padding:0 24px;font-size:11px;line-height:14px}.header{padding:25px 24px 20px;display:block}.logos{justify-content:space-between;gap:12px}.shop{font-size:23px}.pulse{font-size:18px}.pulse small{display:block;margin:3px 0 0;font-size:11px}.universe{margin-top:26px;display:flex;justify-content:space-between}.context{padding:0 24px;height:54px;white-space:nowrap;overflow:hidden}.workspace{display:block;min-height:auto}.journey{display:flex;overflow-x:auto;gap:8px;padding:15px 18px 16px;position:sticky;top:0;z-index:5}.journey h3{display:none}.step{min-width:210px;margin:0;padding:12px 14px}.step strong{font-size:16px}.step span{font-size:12px}.content{padding:28px 20px calc(24px + calc(var(--space-64) + var(--space-8)))}.intro{font-size:16px}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.cards{grid-template-columns:1fr}.canvas{padding:18px}.canvasTop{display:block}h1{font-size:32px;line-height:34px;letter-spacing:-.03em}:root{--pulse-bottom-nav-safe:env(safe-area-inset-bottom,0px);}.pv3-active .bottom{display:none!important}.bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;height:calc(var(--space-64) + var(--space-8));background:rgba(255,255,255,.99);border-top:1px solid var(--line-1);padding:6px 8px var(--pulse-bottom-nav-safe);z-index:20;box-sizing:border-box}.bottom a{text-align:center;color:var(--ink-2);font-size:11px;font-weight:800;padding:9px 2px;border-radius:var(--radius-card)}.bottom a.active{color:var(--brand-pulse-strong);background:var(--brand-soft)}.bottom b{display:block;font-size:16px;margin-bottom:2px}
}
*:focus-visible{outline:3px solid var(--brand-pulse-strong);outline-offset:3px}@media print{.sidebar,.journey,.bottom{display:none!important}.content{max-width:none;padding:0}.canvas{break-inside:avoid}}
*:focus-visible{outline:3px solid var(--brand-pulse-strong);outline-offset:3px}
@media (max-width:720px){
  .bottom{min-height:72px}
  .bottom a,.bottom button{min-height:58px}
  .bottom strong{font-size:16px;line-height:1}
  .bottom span{font-size:11px;line-height:1.1}
  .content{padding-bottom:calc(24px + calc(var(--space-64) + var(--space-8)))}
}
.pv4-at-a-glance b,.pv4-evidence-meta,.pv4-confidence,.pv4-index{font-variant-numeric:tabular-nums}

% dos lares para WhatsApp e 50% do faturamento do canal para Higiene & Beleza constam no texto e no FAQ da página da Worldpanel","alcance_para_pergunta":"DIRETO para relevância do WhatsApp e de H&B no e-commerce de FMCG no Brasil em 2025; CONTEXTUAL para desempenho de uma marca no canal"},{"id":"niq-polarization-brazil","categoria":"premiumização","tipo":"A Tale of Two Consumers","fato":"No Brasil, a polarização de preço pende mais para value: premium cresce em categorias específicas, enquanto o mainstream permanece pressionado.","contexto":"NIQ Global Retail; MAT abril de 2026; branded in-store, excluindo private label.","interpretacao":"A premiumização brasileira é seletiva, não uma transformação ampla do mercado.","hipotese":"A melhor resposta de portfólio pode variar por categoria, combinando value e premium em vez de uma estratégia única.","acao":"Segmentar categorias por potencial de premiumização e pressão de value.","fonte":"NielsenIQ: A Tale of Two Consumers","url":"https://nielseniq.com/global/en/insights/report/2026/tale-of-two-consumers/","periodo":"MAT abril/2026","natureza":"Leitura qualitativa da NIQ sobre mix de valor por faixa de preço (premium, mainstream, value) em produtos de marca; não mede volume, elasticidade nem desempenho de private label","universo_observado":"NIQ Global Retail, Brasil, MAT encerrado em 26/04/2026 vs 2 anos antes; apenas produtos de marca in-store, excluindo private label e o departamento Tabaco; faixas definidas pelo Relative Price Index da NIQ","representa":"Direção da polarização de preço no Brasil: ganhos de premium concentrados em categorias como Confectionery & Snacks e Home Care, mainstream pressionado e value ganhando share","nao_representa":"Não representa canal online, private label, uma categoria específica fora dos exemplos citados nem previsão de comportamento","fonte_primaria":"NielsenIQ e World Data Lab: A Tale of Two Consumers: The polarized mindsets reshaping global consumption, página publicada em 12/08/2026","fato_verificado_na_fonte":"SIM: a inclinação para value, o premium seletivo, o mainstream pressionado, o MAT abril 2026 e o recorte branded in-store sem private label constam na seção Brazil do relatório","alcance_para_pergunta":"DIRETO para direção da polarização de preço em FMCG de marca no Brasil; CONTEXTUAL para estratégia de faixa de preço de uma categoria"},{"id":"niq-promo-polarization","categoria":"promoção","tipo":"A Tale of Two Consumers","fato":"A intensidade promocional aumentou no Brasil; entre categorias citadas pela NIQ, bebidas alcoólicas têm 39%, alimentos 35% e bebidas não alcoólicas 34% de valor promocionado.","contexto":"NIQ RMS Multi Country; L52 semanas encerradas em 19/04/2026; produtos de marca, in-store.","interpretacao":"Promoção é um dos mecanismos centrais de gestão da pressão de valor no shopper.","hipotese":"Aumento de promoção pode sustentar conversão no curto prazo, mas precisa ser analisado junto a preço-base e elasticidade.","acao":"Separar efeito promocional de preço regular e acompanhar ROI por categoria.","fonte":"NielsenIQ: A Tale of Two Consumers","url":"https://nielseniq.com/global/en/insights/report/2026/tale-of-two-consumers/","periodo":"L52 semanas até 19/04/2026","natureza":"Participação do valor vendido sob promoção em produtos de marca, por departamento, medida pela NIQ; não mede profundidade de desconto, ROI nem preço regular","universo_observado":"NIQ RMS Multi Country (medição de varejo), Brasil, últimas 52 semanas encerradas em 19/04/2026 vs 52 semanas encerradas em 21/04/2024; produtos de marca","representa":"Peso do valor promocionado em Bebidas alcoólicas (39%), Alimentos (35%) e Bebidas não alcoólicas (34%), com intensidade promocional crescente no Brasil","nao_representa":"Não representa private label, canal online, eficácia ou ROI de promoção, profundidade de desconto nem uma categoria específica dentro do departamento","fonte_primaria":"NielsenIQ e World Data Lab: A Tale of Two Consumers: The polarized mindsets reshaping global consumption, página publicada em 12/08/2026","fato_verificado_na_fonte":"SIM: aumento da intensidade promocional, 39%, 35% e 34% (texto alternativo do gráfico) e o período L52 até 19/04/2026 constam na seção Brazil do relatório","alcance_para_pergunta":"DIRETO para intensidade promocional por departamento no Brasil; CONTEXTUAL para decisão promocional de uma categoria ou marca"},{"id":"niq-private-label-global","categoria":"marcas","tipo":"Private Label Adoption Report","fato":"58% dos consumidores pesquisados dizem não se importar se o produto é de marca nacional ou private label, desde que atenda à necessidade.","contexto":"NIQ & World Data Lab; estudo global, não específico do Brasil.","interpretacao":"A aceitação de private label reforça a necessidade de monitorar valor percebido e arquitetura de preço.","hipotese":"No Brasil, private label pode ganhar espaço onde a diferença de preço for clara e a qualidade percebida for suficiente.","acao":"Usar como sinal global e validar com dados específicos do Brasil antes de extrapolar.","fonte":"NielsenIQ: Private Label Adoption Report","url":"https://nielseniq.com/global/en/news-center/2026/private-label-adoption-report/","periodo":"publicado em 21/08/2026","natureza":"Atitude declarada de consumidores em estudo global da NIQ; não mede compra efetiva nem share de private label, e não é específico do Brasil","universo_observado":"Estudo global; a fonte não descreve amostra, países nem período de campo; o dado é atribuído ao relatório da NIQ Finding Harmony on the Shelf (2025) e retomado em A Tale of Two Consumers, que combina dados de survey, consumo e shopper da NIQ com projeções da World Data Lab","representa":"Proporção global de consumidores que declaram que marca nacional ou private label é irrelevante e que compram o que precisam","nao_representa":"Não representa o consumidor brasileiro, participação de private label nas vendas, nem disposição de troca em uma categoria específica","fonte_pri esenta unidades vendidas, preço, categorias, regiões ou canais fora do supermercado, nem motivação de compra; não se confunde com a PMC do IBGE","fonte_primaria":"ABRAS: notícia 'Consumo nos Lares cresce 3,28% em julho na comparação anual e acumula alta de 2,67% no ano, aponta ABRAS', Clipping ABRAS, 30/08/2026","fato_verificado_na_fonte":"SIM: 3,28% (julho/2026 vs julho/2025), 3,01% (vs junho) e 2,67% (janeiro a julho/2026) conferidos na notícia oficial da ABRAS de 30/08/2026; deflação pelo IPCA confirmada; data 27/08/2026 do periodo não confirmada","alcance_para_pergunta":"DIRETO para desempenho real de vendas do setor supermercadista no Brasil; CONTEXTUAL para volume, preço, categorias ou comportamento do shopper"},{"id":"scanntech-julho","categoria":"volume","tipo":"Radar Scanntech","fato":"No varejo alimentar, mesmas lojas cresceram 1,8% em faturamento em julho, enquanto unidades vendidas caíram 2,1% e preço por unidade subiu 4,0%.","contexto":"Scanntech; varejo alimentar; mesmas lojas.","interpretacao":"O crescimento nominal foi sustentado principalmente por preço, não por maior quantidade vendida.","hipotese":"O shopper está reduzindo itens por cesta ou frequência enquanto absorve preços maiores.","acao":"Cruzar unidades, volume, pack e fluxo por categoria.","fonte":"Scanntech Brasil: Radar Scanntech Julho 2026","url":"https://pt.linkedin.com/posts/scanntech-brasil_radarscanntech-scanntech-inteligenciacomresultados-inmotion2026-activity-7492992657200267264-tbyL","periodo":"Julho/2026","natureza":"Painel privado de sell out do varejo alimentar (Radar Scanntech); mede faturamento nominal, unidades e preço médio em mesmas lojas, não consumo total das famílias nem motivação de compra","universo_observado":"Varejo alimentar, mesmas lojas, julho/2026 vs julho/2025, segundo a matéria; a página oficial do Radar diz que a base é coletada ticket a ticket em mais de 40.000 PDVs (70% do canal alimentar), com foco em supermercados regionais e atacarejos; a matéria não det -IDV, apurado pela EY); mede receita nominal reportada pelas associadas, não volume, unidades nem comportamento do shopper","universo_observado":"Receita de vendas reportada por empresas associadas ao IDV, por setor; resultado ponderado pelos pesos setoriais do volume de vendas da PMC do IBGE; comparação com o mesmo mês do ano anterior; apurado pela EY","representa":"Variação nominal de junho/2026 vs junho/2025: IAV Consolidado Ponderado +2,2%, hiper e supermercados, alimentos, bebidas e fumo +1,8%, atacado de alimentos, bebidas e fumo +0,5%","nao_representa":"Não representa vendas reais, volume ou o varejo total do país fora das associadas; não substitui a PMC do IBGE; não indica causa nem comportamento do shopper","fonte_primaria":"IDV: IAV/IDV Apresentação Plenária, 'Resultados de junho, 2026', apurado pela EY (PDF em idv.org.br/wp-content/uploads/2026/08/IAV-_-JUNHO-2026.pdf, criado em 24/07/2026, SHA-256 57f0655d180be94c8c623ae6a5bc36ff85ff40ec8c18f11a5f75edeca08c2a5b); página Índice Antecedente de Vendas do IDV","fato_verificado_na_fonte":"SIM: +2,2% (IAV Consolidado Ponderado vs jun/25), +1,8% (hiper, supermercados, alimentos, bebidas e fumo) e +0,5% (atacado de alimentos, bebidas e fumo) conferidos no PDF oficial do IDV de junho/2026","alcance_para_pergunta":"DIRETO para receita nominal do varejo reportada pelas associadas ao IDV; CONTEXTUAL para volume, consumo real ou comportamento do shopper"},{"id":"idv-julho-2026","categoria":"varejo","tipo":"IAV-IDV","fato":"As vendas nominais do varejo brasileiro cresceram 1,7% em julho de 2026 frente a julho de 2025; em termos reais, descontada a inflação, recuaram 2,8%.","contexto":"IAV-IDV do IDV; indicador privado baseado em receitas reportadas pelas empresas associadas e ajustado pelo IPCA para a leitura real.","interpretacao":"O resultado mostra que crescimento nominal de vendas não equivale a crescimento real de consumo ou volume; o indicador deve ser lido como sinal de mercado, não como prova de mudança de comportamento do shopper.","hipotese":"A combinação de avanço nominal e queda real pode refletir pressão de preços e/ou menor quantidade transacionada, mas é necessário cruzar com PMC e outras evidências para separar esses efeitos.","acao":"Cruzar IAV-IDV com PMC, IPCA e indicadores de unidades/volume antes de formular hipóteses sobre missão, necessidade, driver, barreira ou migração de canal.","fonte":"IDV: IAV-IDV, 21/08/2026","url":"https://www.idv.org.br/sala-de-imprensa/vendas-reais-no-varejo-caem-28-em-julho-e-devem-recuar-ate-outubro/","periodo":"2026-07 vs 2025-07","universo":"varejo brasileiro; empresas associadas ao IDV","indicador":"vendas nominais e vendas reais (IAV-IDV)","valor":{"nominal_pct":1.7,"real_pct":-2.8},"comparacao":"julho/2026 vs julho/2025","classificacao":"sinal de mercado; não comprova comportamento de shopper","natureza":"Indicador privado antecedente de receita de vendas do varejo (IAV-IDV, apurado pela EY), em leitura nominal e ajustada pelo IPCA; não mede volume, unidades nem comportamento do shopper","universo_observado":"Receita de vendas reportada por empresas associadas ao IDV; consolidado ponderado pelos pesos setoriais da PMC do IBGE; comparação com o mesmo mês do ano anterior; série real ajustada pelo IPCA; apurado pela EY","representa":"IAV Consolidado Ponderado de julho/2026 vs julho/2025: +1,7% nominal e -2,8% ajustado pelo IPCA","nao_representa":"Não representa volume físico, unidades vendidas, o varejo fora das associadas ao IDV, nem prova de mudança de comportamento do shopper; não substitui a PMC do IBGE","fonte_primaria":"IDV: IAV/IDV Apresentação Plenária, 'Resultados de julho, 2026', apurado pela EY (PDF em idv.org.br/wp-content/uploads/2026/08/IAV-_-JULHO-2026.pdf, criado em 26/08/2026, SHA-256 5980b435f9f8cf188d52d753fd2520f84a9a415789ea65d307b19b0702b0d8ae)","fato_verificado_na_fonte":"SIM: +1,7% nominal (texto da página de destaques) e -2,8% real (rótulo de jul/26 no gráfico da série ajustada pelo IPCA, página 7) conferidos no PDF oficial do IDV de julho/2026; data 21/08/2026 não confirmada","alcance_para_pergunta":"DIRETO para receita nominal e real do varejo reportada pelas associadas ao IDV; CONTEXTUAL para volume, consumo ou comportamento do shopper"},{"id":"kantar-chocolate-brasil-volume-q1-2025","categoria":"chocolate","tipo":"painel de compras domiciliares e fora do lar","fato":"No 1º trimestre de 2025, o volume de chocolate comprado para consumo domiciliar caiu 19% no Brasil; o preço médio por quilo subiu 17%, as unidades caíram 10% e produtos de até 60 g cresceram 2%. O consumo fora do lar caiu 15% em volume.","contexto":"Worldpanel by Numerator/Kantar; publicação de 07/07/2025. O conteúdo separa consumo domiciliar e fora do lar.","interpretacao":"O conjunto é compatível com ajuste de quantidade e formatos sob pressão de preço, mas não identifica sozinho causalidade nem comportamento de compradores de marcas premium específicas.","hipotese":"Investigar se a pressão de desembolso favorece formatos menores no chocolate e se o padrão difere entre mainstream e premium.","acao":"Cruzar com dados de preço, unidades, gramatura, frequência e segmento premium; não recomendar mudança de portfólio sem esse cruzamento.","fonte":"Kantar / Worldpanel by Numerator: Brasileiros compram menos chocolate e escolhem porções menores","url":"https://www.kantar.com/brazil/Inspiration/Consumo/2025/queda-consumo-chocolate-crise-cacau","periodo":"2025-T1","natureza":"Compras observadas em painel de consumidores (medição de comportamento de compra)","universo_observado":"Compras de chocolate no Brasil, com resultados separados para consumo domiciliar e fora do lar; detalhes completos de amostra não informados no resumo público","representa":"Mudanças reportadas em volume, preço médio por quilo, unidades e formatos para a categoria chocolate no período","nao_representa":"Não comprova motivo individual da mudança; não isola marca do piloto, chocolates premium, canal, região ou resultados de uma empresa específica","fonte_primaria":"Worldpanel by Numerator / Kantar","fato_verificado_na_fonte":"SIM: os percentuais e período constam no artigo publicado pela Kantar","alcance_para_pergunta":"INDIRETO para marca do piloto no Brasil; DIRETO para o sinal agregado da categoria chocolate no período"},{"id":"kantar-chocolate-brasil-compras-pascoa-2024","categoria":"chocolate","tipo":"painel de compras domiciliares","fato":"Na Páscoa de 2024, o volume de compras de chocolate cresceu 15% ante 2023; barras cresceram 22,5%. No último trimestre de 2024, os consumidores compraram 8,6% mais unidades por viagem, enquanto a frequência de compra caiu 4,8%.","contexto":"Kantar / Worldpanel; dados históricos divulgados em 2025. A sazonalidade de Páscoa e o último trimestre são recortes diferentes e não devem ser fundidos como uma única série.","interpretacao":"A categoria mostrou resiliência em alguns recortes, coexistindo com redução de frequência no fim de 2024. Isso impede uma narrativa simples de queda contínua e reforça a necessidade de segmentar por período e ocasião.","hipotese":"Investigar se os ajustes de compra são sazonais e se formatos regulares capturam demanda que antes iria para ovos ou outros formatos.","acao":"Separar análises de Páscoa e consumo regular; comparar frequência, unidades por viagem e volume antes de concluir mudança de comportamento.","fonte":"Kantar / Worldpanel: Páscoa 2025: alta de preço do chocolate não deve causar retração no consumo","url":"https://www.kantar.com/brazil/inspiration/consumo/2025/consumo-de-chocolates-no-brasil","periodo":"Páscoa 2024 vs 2023; 4º tri. 2024 vs 4º tri. 2023","natureza":"Compras observadas em painel de consumidores","universo_observado":"Compras de chocolate no Brasil; recortes sazonais e trimestrais descritos separadamente","representa":"Variação reportada de compras na Páscoa e mudanças em unidades por viagem e frequência no último trimestre de 2024","nao_representa":"Não prova comportamento atual em 2026 nem desempenho específico de marca do piloto; dados de períodos diferentes não são uma série contínua","fonte_primaria":"Worldpanel by Numerator / Kantar","fato_verificado_na_fonte":"SIM: percentuais e períodos constam no artigo da Kantar","alcance_para_pergunta":"INDIRETO para a estratégia da marca do piloto; contextual para interpretar mudanças de formato e frequência"},{"id":"abicab-chocolate-producao-brasil-2025-pascoa-2026","categoria":"chocolate","tipo":"produção industrial e oferta","fato":"A produção brasileira de chocolate passou de 806 mil toneladas em 2024 para 814 mil toneladas em 2025. A Abicab também informou 134 lançamentos para a Páscoa de 2026, contra 94 em 2025.","contexto":"Dados divulgados pela Abicab em 2026. São indicadores de produção e oferta da indústria, não medidas diretas de compra ou preferência do shopper.","interpretacao":"A expansão da produção e dos lançamentos é um contraponto à leitura de retração generalizada; não permite inferir crescimento equivalente do consumo final.","hipotese":"Investigar se a ampliação de lançamentos corresponde a demanda incremental, maior competição por ocasião ou canibalização de produtos existentes.","acao":"Usar como contexto de oferta e cruzar com dados de vendas, distribuição, giro e recompra antes de inferir demanda.","fonte":"Abicab: Indústria brasileira de chocolate reforça dinamismo e inovação na Páscoa 2026","url":"https://abicab.org.br/industria-brasileira-de-chocolate-reforca-dinamismo-e-inovacao-na-pascoa-2026/","periodo":"Produção 2024-2025; lançamentos Páscoa 2025-2026","natureza":"Dado setorial reportado pela associação da indústria","universo_observado":"Produção nacional agregada de chocolate e lançamentos reportados para a Páscoa","representa":"Indicadores agregados de oferta e atividade industrial","nao_representa":"Não mede vendas ao shopper, penetração, frequência, recompra, participação premium ou resultados da marca do piloto","fonte_primaria":"Abicab","fato_verificado_na_fonte":"SIM: os números constam na publicação setorial da Abicab","alcance_para_pergunta":"CONTEXTUAL; não é evidência direta de comportamento do shopper"},{"id":"locomotiva-pascoa-2026-intencao-drivers","categoria":"chocolate","tipo":"pesquisa nacional de intenção declarada e fatores de escolha","fato":"Pesquisa do Instituto Locomotiva, reportada em 31/03/2026, apontou que 90% dos entrevistados pretendiam comprar produtos de chocolate relacionados à Páscoa de 2026, 4 pontos percentuais acima de 2025. Ao mesmo tempo, 69% consideravam o preço dos ovos injusto em comparação com barras de mesmo peso. Preço foi citado como fator de escolha por 61%; qualidade dos ingredientes, 53%; tamanho, 44%; marca conhecida, 43%; variedade de sabores, 40%.","contexto":"Levantamento do Instituto Locomotiva em parceria com a QuestionPro; 1.557 brasileiros de 18 anos ou mais, de todo o país, entrevistados entre 25/02 e 13/03/2026. A Agência Brasil reportou também que 68% afirmavam preferir produtos artesanais.","interpretacao":"A intenção declarada de compra permaneceu alta, coexistindo com crítica ao custo relativo dos ovos e relevância de preço, ingredientes e tamanho. É evidência de percepção/intenção numa ocasião sazonal, não de compra realizada ou de crescimento do sell-out.","hipotese":"Investigar se o custo por 100 g e a escolha entre ovo, barra e caixa alteram a decisão por ocasião e faixa de renda; verificar separadamente se qualidade percebida e marca conhecida sustentam a escolha de produtos premium.","acao":"No piloto, comparar intenção declarada com sell-out observado, preço por 100 g, formato, ocasião (presente ou consumo próprio) e segmento de marca. Não inferir elasticidade, compra efetiva ou comportamento premium a partir desta pesquisa isolada.","fonte":"Agência Brasil: Pesquisa aponta que 90% dos consumidores comprarão chocolate na Páscoa","url":"https://agenciabrasil.ebc.com.br/geral/noticia/2026-03/pesquisa-aponta-que-90-dos-consumidores-comprarao-chocolate-na-pascoa","periodo":"Páscoa 2026; campo 25/02-13/03/2026; publicação 31/03/2026","natureza":"Pesquisa amostral de intenção declarada e fatores de escolha; não mede compra efetiva","universo_observado":"1.557 brasileiros com 18 anos ou mais, em todo o país; período de campo de 25/02 a 13/03/2026; método detalhado e margem de erro não informados no artigo consultado","representa":"Intenção declarada para a ocasião de Páscoa 2026, percepção relativa do preço dos ovos e fatores declarados de escolha entre os entrevistados","nao_representa":"Não comprova compra realizada, unidades/volume de sell-out, elasticidade-preço, comportamento ao longo do ano, preferência por chocolate premium ou comportamento específico de compradores da marca do piloto","fonte_primaria":"Instituto Locomotiva e QuestionPro; reportagem da Agência Brasil","fato_verificado_na_fonte":"SIM: percentuais, tamanho da amostra e datas de campo constam na reportagem publicada em 31/03/2026","alcance_para_pergunta":"INDIRETO para marca do piloto no Brasil; DIRETO para intenção declarada e percepção de preço na Páscoa 2026 entre os entrevistados","keywords":["chocolate","Páscoa 2026","intenção de compra","Instituto Locomotiva","QuestionPro","preço","ovo de Páscoa","barra de chocolate","tamanho","ingredientes","marca conhecida","artesanal","sell-out"]},{"id":"rico-preco-chocolate-barra-bombom-out-2026","categoria":"chocolate","tipo":"série de preços ao consumidor reportada em análise econômica","fato":"Análise publicada pela Rico em 09/10/2026 reportou que os preços de chocolate em barra e bombom subiram 76,06% em cinco anos (setembro/2021 a agosto/2026), 12,45% nos 12 meses até agosto/2026 e 3,45% no acumulado de 2026 até agosto.","contexto":"Rico Connect, estudo sobre inflação da cesta do Dia das Crianças; a análise compara os itens da cesta com o IPCA e informa a série de chocolate em barra e bombom. É contexto de preços, não painel de compras.","interpretacao":"A série indica forte pressão acumulada de preço no grupo reportado, acima do IPCA geral no período de cinco anos. Não permite atribuir essa variação a uma causa única nem concluir que volume, frequência ou preferência por marca mudou.","hipotese":"Investigar se a alta acumulada e recente dos preços se associa a maior comparação de custo por grama, mudança de formato, frequência ou composição da cesta; essas respostas precisam ser medidas diretamente.","acao":"Cruzar preço por 100 g e preço por formato com unidades, volume, frequência e sell-out da categoria. Usar como contexto de pressão de preço, não como proxy para queda de consumo ou comportamento da marca do piloto.","fonte":"Rico Connect: Inflação do Dia das Crianças em 2026","url":"https://riconnect.rico.com.vc/analises/inflacao-dia-das-criancas/","periodo":"Setembro/2021-agosto/2026; 12 meses até agosto/2026; acumulado de 2026 até agosto; publicado em 09/10/2026","natureza":"Indicador de preços ao consumidor reportado; não mede comportamento de compra","universo_observado":"Variação de preços de chocolate em barra e bombom informada na análise econômica da Rico, com comparação ao IPCA; períodos até agosto/2026","representa":"Variação acumulada, em 12 meses e no ano dos preços do grupo chocolate em barra e bombom conforme reportada na fonte","nao_representa":"Não mede quantidades compradas, sell-out, frequência, substituição entre formatos, percepção individual, elasticidade, preço de marcas específicas ou causalidade","fonte_primaria":"Rico Connect: análise de inflação da cesta do Dia das Crianças, publicada em 09/10/2026","fato_verificado_na_fonte":"SIM: a tabela da análise informa 76,06% em cinco anos, 12,45% em 12 meses e 3,45% em 2026 até agosto","alcance_para_pergunta":"CONTEXTUAL para comportamento do shopper; DIRETO para o sinal agregado de pressão de preço em chocolate em barra e bombom no período reportado","keywords":["chocolate","barra","bombom","preço","inflação","IPCA","Dia das Crianças 2026","setembro 2021","agosto 2026","preço por grama","pressão de preço","Rico"]},{"id":"ibge-pmc-super-agosto-2026","categoria":"varejo alimentar","tipo":"PMC","fato":"Em agosto de 2026, o volume de vendas de hipermercados, supermercados, produtos alimentícios, bebidas e fumo caiu 0,3% ante julho, na série com ajuste sazonal, e cresceu 0,5% ante agosto de 2025, na série sem ajuste; no ano, acumula alta de 1,4% e, em 12 meses, de 1,0%.","contexto":"IBGE; Pesquisa Mensal de Comércio; Brasil; tabela 8882 do SIDRA, índice de volume de vendas (2022=100). A série com ajuste sazonal é revisada a cada divulgação; os valores refletem a consulta à API SIDRA de 31/10/2026 (horário de Brasília; registros brutos em docs/data).","interpretacao":"A atividade segue em patamar estável: o índice com ajuste sazonal oscilou entre 108,98 e 111,80 nos 13 meses até agosto de 2026, e agosto (110,86) ficou 1,3% acima de agosto de 2025 nessa série. A variação interanual de 0,5% na série sem ajuste é a menor desde maio de 2026 (-0,4%).","hipotese":"Verificar se a desaceleração interanual de agosto (de 2,9% em julho para 0,5%) reflete uma base de comparação mais alta: na série com ajuste sazonal, agosto de 2025 havia subido 0,5% ante julho de 2025 (variável 11708 na resposta bruta docs/data/ibge-pmc-8882-a90672-variacoes-2026-10-31.json). Isso precisa ser medido, não presumido.","acao":"Acompanhar a divulgação de setembro de 2026; usar a série histórica deste registro apenas como variação observada e cruzar com IPCA Alimentação e bebidas, Abras e Scanntech sem misturar universos.","fonte":"IBGE: PMC, tabela 8882 do SIDRA (agosto de 2026)","url":"https://sidra.ibge.gov.br/tabela/8882","periodo":"2026-08","indicador":"Índice de volume de vendas (2022=100), séries com e sem ajuste sazonal","valor":"110,86 (agosto/2026, com ajuste sazonal)","comparacao":"-0,3% vs julho/2026 (com ajuste sazonal); +0,5% vs agosto/2025 (sem ajuste); +1,4% no ano; +1,0% em 12 meses","classificacao":"estatística oficial de volume do varejo; não comprova comportamento de shopper","natureza":"Estatística oficial de volume de vendas do varejo (índice mensal); não mede comportamento individual do shopper","universo_observado":"Empresas do comércio varejista pesquisadas pela PMC do IBGE na atividade hipermercados, supermercados, produtos alimentícios, bebidas e fumo; Brasil; índice de volume de vendas (2022=100)","representa":"Variação agregada do volume de vendas da atividade no Brasil, nas séries com e sem ajuste sazonal publicadas pelo IBGE","nao_representa":"Não representa categorias específicas, canais fora do comércio varejista formal, regiões isoladas, marcas, unidades vendidas ou motivação de compra; não permite atribuir causa à variação","fonte_primaria":"IBGE, SIDRA, tabela 8882. Respostas brutas da API gravadas em docs/data: série com ajuste sazonal, variável 7170, 2025-08 a 2026-08: docs/data/ibge-pmc-8882-v7170-a90672-2026-10-31.json (consulta 2026-11-01T00:07:55Z, SHA-256 cfe81b9b6b02172ecfbbf1d2c7f77fe7467cbed61826fcb2ac3ae9a709701f0a, https://apisidra.ibge.gov.br/values/t/8882/n1/all/v/7170/p/last%2013/c11046/56734/c85/90672); variações 11708 a 11711 para 2025-08 e 2026-05 a 2026-08: docs/data/ibge-pmc-8882-a90672-variacoes-2026-10-31.json (consulta 2026-11-01T00:07:46Z, SHA-256 20d19c0f519c8a3e4d166cf8beb4d374860b4c85700d999682d7cf4fae6fa587, https://apisidra.ibge.gov.br/values/t/8882/n1/all/v/11708,11709,11710,11711/p/202508,202605,202606,202607,202608/c11046/56734/c85/90672)","fato_verificado_na_fonte":"SIM: -0,3% (11708), 0,5% (11709), 1,4% (11710) e 1,0% (11711) para agosto de 2026, -0,5% (11709) para agosto de 2025 e as variações interanuais de maio a julho de 2026 lidos da resposta bruta docs/data/ibge-pmc-8882-a90672-variacoes-2026-10-31.json; os 13 índices com ajuste sazonal de agosto/2025 a agosto/2026 lidos da resposta bruta docs/data/ibge-pmc-8882-v7170-a90672-2026-10-31.json e registrados em serie_historica com arredondamento a duas casas","alcance_para_pergunta":"DIRETO para volume do varejo alimentar no Brasil; CONTEXTUAL para c  fixa com ajuste sazonal (2022=100), tabela 8882 do SIDRA, variável 7170, tipo de índice 56734, atividade 90672; valores arredondados a duas casas decimais a partir da API","geography":"Brasil","source":"IBGE: PMC, tabela 8882 do SIDRA (agosto de 2026)","provenance":"API SIDRA, consulta de 2026-11-01T00:07:55Z, tabela 8882; resposta bruta em docs/data/ibge-pmc-8882-v7170-a90672-2026-10-31.json (SHA-256 cfe81b9b6b02172ecfbbf1d2c7f77fe7467cbed61826fcb2ac3ae9a709701f0a); URL completa no campo fonte_primaria do item","url":"https://sidra.ibge.gov.br/tabela/8882"}]},{"id":"lei-15404-2026-rotulagem-chocolate","categoria":"chocolate","tipo":"mudança regulatória de rotulagem e composição","fato":"A Lei nº 15.404, de 8 de maio de 2026 (publicada no Diário Oficial da União em 11/05/2026, segundo a imprensa), define os produtos de cacau e chocolate pelo teor de cacau e obriga a declaração \"Contém X% de cacau\" no painel principal da embalagem, em área não inferior a 15% da área frontal, em caracteres legíveis e com contraste adequado. Mínimos do art. 2º: chocolate, 35% de sólidos totais de cacau (ao menos 18% de manteiga de cacau e 14% isentos de gordura), com até 5% de outras gorduras vegetais autorizadas; chocolate ao leite, 25% de sólidos totais de cacau e 14% de sólidos totais de leite; chocolate branco, 20% de manteiga de cacau e 14% de sólidos totais de leite; chocolate doce (categoria nova), 25% de sólidos totais de cacau (18% de manteiga de cacau e 12% isentos de gordura); chocolate em pó, 32%; achocolatado, chocolate fantasia, chocolate composto e coberturas sabor chocolate, 15% de sólidos de cacau ou 15% de manteiga de cacau. O texto não usa os termos \"amargo\" e \"meio amargo\" (a Câmara os retirou do projeto), o que a imprensa descreve como o fim desses nomes nos rótulos. Vale para produtos nacionais e importados e entra em vigor 360 dias após a publicação, ou seja, em maio de 2027.","contexto":"Origem no PL 1769/2019, do senador Zequinha Marinho. A Câmara aprovou em 17/03/2026 o substitutivo do relator Daniel Almeida, que retirou a terminologia amargo e meio amargo da regra dos 35%, incluiu o limite de 5% para outras gorduras vegetais e fixou o percentual de cacau na frente da embalagem; o Senado aprovou o substitutivo em votação simbólica em 15/04/2026 (relator Angelo Coronel) e a lei foi sancionada em 08/05/2026. No Google Trends (export de 5 anos do termo isolado, capturado em 04/11/2026), \"chocolate amargo\" teve na semana de 03/05/2026, a da onda de notícias sobre o fim do nome, o maior valor dos cinco anos (100), acima da semana de Páscoa de 2026 (86); a semana de 12/04/2026 (aprovação no Senado) foi a terceira maior do ano (59). Nos quatro anos anteriores o máximo do termo foi sempre a semana anterior à Páscoa: em 2026 a atenção veio da lei, não da demanda.","interpretacao":"Mudança estrutural da categoria: nomes de produto, rótulos, sortimento e possivelmente formulações e preços mudam até maio de 2027. Para o shopper, a comparação passa a ser pelo percentual de cacau explícito, o que tende a reorganizar a leitura de prateleira entre ao leite, intenso e doce. A lei não mede nem prevê comportamento de compra.","hipotese":"Investigar se a exposição do percentual de cacau na frente da embalagem desloca escolha e preço por faixa de cacau, se marcas reposicionam linhas hoje vendidas como meio amargo (acima ou abaixo de 35%) e se a categoria nova chocolate doce absorve produtos de menor teor; acompanhar relançamentos e mudanças de preço por 100 g ao longo de 2026 e 2027.","acao":"Registrar, por SKU observado, o teor de cacau declarado e o nome de linha antes e depois da adaptação; cruzar com preço por 100 g, sell-out e mix por faixa de cacau; tratar as semanas de abril e maio de 2026 no Google Trends como semanas de notícia da lei, não de demanda.","fonte":"Senado Federal (Normas): Lei nº 15.404, de 8 de maio de 2026, texto da norma","url":"https://legis.senado.leg.br/norma/43275504/publicacao/43277419","periodo":"Lei de 08/05/2026, publicada em 11/05/2026; vigência 360 dias após a publicação (maio de 2027); tramitação: Câmara 17/03/2026, Senado 15/04/2026","natureza":"Norma legal de rotulagem e composição; não mede comportamento de compra nem vendas","universo_observado":"Texto da Lei 15.404/2026 (registro de normas do Senado Federal) e notícias da tramitação (Agência Câmara, Agência Senado, Estado de Minas); aplica-se a produtos de cacau e chocolate nacionais e importados comercializados no Brasil","representa":"As regras de nome, teor mínimo de cacau e rotulagem frontal que passam a valer em maio de 2027 e as datas da tramitação","nao_representa":"Não mede vendas, share, preferência, elasticidade, reação do shopper à nova rotulagem nem como cada marca vai reposicionar seus produtos; a data de publicação no Diário Oficial vem da imprensa, não foi conferida na edição do DOU","fonte_primaria":"Lei nº 15.404, de 8 de maio de 2026 (texto no registro de normas do Senado Federal); Agência Câmara, 17/03/2026; Agência Senado, 15/04/2026 (reproduzida pelo Diario de Pernambuco); Estado de Minas, 17/05/2026","fato_verificado_na_fonte":"SIM: percentuais mínimos, regra do painel frontal (15% da área frontal), limite de 5% de outras gorduras, ausência dos termos amargo e meio amargo, alcance a importados e prazo de 360 dias conferidos no texto da lei no registro do Senado Federal; datas de aprovação conferidas na Agência Câmara e na Agência Senado; data de publicação no DOU conforme Estado de Minas (não conferida na edição do DOU)","alcance_para_pergunta":"DIRETO para perguntas sobre regras de rotulagem, nomes e teor de cacau do chocolate no Brasil a partir de 2027; CONTEXTUAL para comportamento do shopper e para preços","keywords":["chocolate","lei 15.404/2026","lei do chocolate","rotulagem","amargo","meio amargo","percentual de cacau","teor de cacau","sólidos de cacau","manteiga de cacau","chocolate doce","chocolate ao leite","chocolate branco","achocolatado","PL 1769/2019","maio 2027","embalagem","regulação","Senado","Câmara"]},{"id":"google-trends-chocolate-sazonalidade-pascoa-2022-2026","categoria":"chocolate","tipo":"interesse relativo de busca na web (índice semanal 0 a 100)","fato":"Nos exports do Google Trends para o Brasil registrados pelo piloto Chocolate (janela de 5 anos, semanas de 31/10/2021 a 25/10/2026, capturados em 03/11/2026 e 04/11/2026), a semana de maior interesse de busca por \"chocolate\" foi, em todos os anos de 2022 a 2026, a semana que começa sete dias antes do domingo de Páscoa (10/04/2022, 02/04/2023, 24/03/2024, 13/04/2025 e 29/03/2026); essa semana vale entre 2,2 e 2,6 vezes a semana mediana dos cinco anos (razão mediana 2,3) e o máximo da janela de Natal fica entre 59% e 68% do pico de Páscoa seguinte. Para as cinco marcas de chocolate acompanhadas pelo piloto, a mesma semana foi o máximo do ano em 24 das 25 combinações marca-ano; na única exceção, uma marca em 2024, a semana de 15/12 superou a de Páscoa por um ponto.","contexto":"Método v2 do piloto Chocolate: um termo de marca entra pelo nome só quando passa num screen de sazonalidade; marcas cujo nome é palavra comum ou que vendem em várias categorias entram como uniões de buscas qualificadas por chocolate, bombom e barra. O export de categoria repetido um dia depois diferiu no máximo 5 pontos por termo (mediana 1 ou menos); entre os nomes puros de marca testados, o nome que é palavra comum foi o único instável (diferença máxima de 12 pontos), razão para a união de buscas. Picos fora de época foram explicados por fontes datadas (uma polêmica de marca em outubro de 2023; notícias da lei de rotulagem em abril e maio de 2026). A lista de marcas, os exports e os hashes estão em docs/pilot-chocolate/capture-kit; a base pública do Pulse não nomeia marcas.","interpretacao":"A atenção do shopper a chocolate no Brasil concentra-se nas semanas anteriores à Páscoa, com dezembro como segunda estação (visível na categoria e em uma das marcas acompanhadas), e os picos de busca das marcas coincidem com o da categoria. O índice é relativo e não mede vendas: serve para datar a janela de atenção e comparar a forma das curvas, não para medir volume ou participação.","hipotese":"Investigar se a largura da janela de busca pré-Páscoa (semanas E-4 a E) antecipa o calendário de sell-out e de promoção, se o segundo pico de dezembro, presente na categoria e em uma das cinco marcas, distingue marcas de presente das marcas de consumo próprio, e se o índice de Páscoa de cada marca dentro do mesmo export acompanha movimentos de preço e sortimento.","acao":"Usar a semana anterior ao domingo de Páscoa como referência de alinhamento anual (E-4 a E) em qualquer comparação de Páscoa; comparar sempre dentro de um mesmo export; cruzar com sell-out por marca antes de ler qualquer deslocamento entre marcas como tendência.","fonte":"Google Trends: interesse de busca por chocolate no Brasil, 5 anos (capturas do piloto Chocolate)","url":"https://trends.google.com/trends/explore?date=today%205-y&geo=BR&cat=0&q=chocolate%2Cbarra%20de%20chocolate%2Cchocolate%20amargo%2Cchocolate%20ao%20leite%2Cchocolate%20sem%20a%C3%A7%C3%BAcar","periodo":"Semanas de 31/10/2021 a 25/10/2026 (semana de 01/11/2026 parcial, excluída); exports de 03/11/2026 (categoria) e 04/11/2026 (marcas e termos isolados)","natureza":"Índice relativo de buscas na web (0 a 100 dentro de cada export, amostrado pelo Google); não mede vendas, compra ou preferência","universo_observado":"Buscas na web no Brasil, todas as categorias, termos de pesquisa chocolate, barra de chocolate, chocolate amargo, chocolate ao leite e chocolate sem açúcar (conjunto A) e cinco marcas de chocolate acompanhadas pelo piloto (conjunto B2, três nomes puros e duas uniões de buscas qualificadas), com os exports e hashes registrados em docs/pilot-chocolate/capture-kit","representa":"O calendário e a forma do interesse de busca por chocolate e por cinco marcas de chocolate no Brasil ao longo de cinco anos, dentro de cada export","nao_representa":"Não mede vendas, volume, share, preferência, intenção de compra, elasticidade ou troca de marca; níveis entre um nome puro e uma união de buscas não são comparáveis; valores mudam a cada export por amostragem","fonte_primaria":"Google Trends (exports GT-CHOC-A-5Y de 03/11/2026 e GT-CHOC-B2-5Y de 04/11/2026, com SHA-256 em docs/pilot-chocolate/capture-kit/trends-export-status-2026-10-15.csv; repetição do conjunto A em docs/pilot-chocolate/capture-kit/tests)","fato_verificado_na_fonte":"SIM: semanas de pico, razões de Páscoa e de Natal e a exceção de 2024 calculadas sobre os arquivos CSV exportados do Google Trends (GT-CHOC-A-5Y e GT-CHOC-B2-5Y), conferidos por hash; critérios, testes e repetições em docs/pilot-chocolate/capture-kit/trends-method-v2.md","alcance_para_pergunta":"DIRETO para a sazonalidade da atenção a chocolate e às marcas observadas no Brasil; CONTEXTUAL para vendas, preço e comportamento de compra","keywords":["chocolate","Google Trends","Páscoa","Natal","sazonalidade","interesse de busca","marcas de chocolate","semana de Páscoa","barra de chocolate","chocolate amargo","chocolate ao leite","chocolate sem açúcar","2022","2023","2024","2025","2026","piloto Chocolate"]},{"id":"ibge-ipca-alimentos-2026-07","categoria":"preços","tipo":"IPCA","fato":"Em julho de 2026, o IPCA subiu 0,07%; Alimentação e bebidas caiu 0,67% e Alimentação no domicílio caiu 1,14% ante junho. No ano, Alimentação e bebidas acumula 3,86% e, em 12 meses, 3,40%.","contexto":"IPCA nacional do IBGE, tabela 7060 do SIDRA. Item escrito por scripts/update-ibge-ipca-evidence.py a partir da resposta da API consultada em 2026-11-11 (UTC), sem edição manual; resposta bruta em docs/data.","interpretacao":"O grupo Alimentação e bebidas passou de -0,24% em junho para -0,67% em julho (manteve o sinal da variação mensal); em 12 meses, o grupo (3,40%) está abaixo do índice geral (4,44%).","hipotese":"Investigar se a variação de preços de alimentos em julho aparece no volume do varejo ali
