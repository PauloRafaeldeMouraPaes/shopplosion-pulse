<script data-pulse-inline="pulse-ux-fixes.js">
(function(){

/* Pulse visual shell: thin trend line using only explicit series/trend values or observed evidence periods. */
(function(){
  'use strict';
  function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function nums(v){return Array.isArray(v)?v.map(Number).filter(Number.isFinite):String(v||'').split(/[,;\s]+/).map(Number).filter(Number.isFinite)}
  function cardSeries(card){
    var attrs=['data-series','data-trend','data-sparkline'];
    for(var i=0;i<attrs.length;i++){
      var raw=card.getAttribute(attrs[i]);
      if(raw){try{var parsed=JSON.parse(raw);var values=nums(parsed);if(values.length>=2)return values}catch(e){var fallback=nums(raw);if(fallback.length>=2)return fallback}}
    }
    var pool=window.PULSE_EVIDENCE||window.__PULSE_EVIDENCE||window.PULSE_SOURCES||[];
    if(!Array.isArray(pool)||pool.length<2)return [];
    var label=(card.querySelector('h3,h4,strong,[data-label],.label,.metric-label,.kpi-label')||{}).textContent||'';
    var words=label.toLowerCase().split(/\W+/).filter(function(w){return w.length>3});
    var matched=pool.filter(function(o){var text=[o.category,o.topic,o.channel,o.name,o.title].filter(Boolean).join(' ').toLowerCase();return words.some(function(w){return text.indexOf(w)>=0})});
    if(matched.length<2)matched=pool;
    var periods={};matched.forEach(function(o){var p=o.date||o.published_at||o.publishedAt||o.period||o.year;if(p)periods[String(p)]=(periods[String(p)]||0)+1});
    var keys=Object.keys(periods).sort().slice(-8);if(keys.length<2)return [];
    var out=keys.map(function(k){return periods[k]});return out.some(function(v){return v!==out[0]})?out:[];
  }
  function draw(card){
    if(card.querySelector('.pulse-indicator-sparkline-wrap'))return;
    var values=cardSeries(card);if(values.length<2)return;
    var width=180,height=28,min=Math.min.apply(Math,values),span=Math.max.apply(Math,values)-min||1;
    var path=values.map(function(v,i){var x=i/(values.length-1)*width,y=height-3-(v-min)/span*(height-7);return(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
    var wrap=document.createElement('div');wrap.className='pulse-indicator-sparkline-wrap';wrap.setAttribute('aria-label','Tendência histórica observada');
    wrap.innerHTML='<svg class="pulse-indicator-sparkline" viewBox="0 0 180 28" preserveAspectRatio="none" role="img"><path class="baseline" d="M0 25 H180"></path><path d="'+path+'"></path></svg>';
    card.appendChild(wrap);
  }
  function run(){var seen=[];['[data-indicator-card]','.indicator-card','.metric-card','.kpi-card','.stat-card','.pulse-kpi','.pulse-indicator'].forEach(function(sel){qsa(sel).forEach(function(card){if(seen.indexOf(card)<0){seen.push(card);draw(card)}})});}
  function init(){if(document.getElementById('pulse-indicator-sparkline-styles'))return;var style=document.createElement('style');style.id='pulse-indicator-sparkline-styles';style.textContent='.pulse-indicator-sparkline-wrap{margin-top:10px}.pulse-indicator-sparkline{display:block;width:100%;height:28px;overflow:visible}.pulse-indicator-sparkline path{fill:none;stroke:var(--pink,#E51B67);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pulse-indicator-sparkline .baseline{stroke:rgba(20,19,27,.08);stroke-width:1}';document.head.appendChild(style);run();new MutationObserver(run).observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

<script data-pulse-inline="pulse-single-file-bridge.js">

  }
  function enrichEvidenceSearch() {
    function tokens(text) { return norm(text).split(' ').filter(function (x) { return x.length >= 3; }); }

      return all.map(function (x) { return { item: x.item, local: x.local, score: score(question, x.item) }; }).filter(function (x) { return x.score > 0; }).sort(function (a, b) { return b.score - a.score; }).slice(0, 5);

<script>
(()=>{

const parseDate=v=>{if(v==null)return null;const s=String(v);const m=s.match(/^(\d{4})(?:[-/](\d{1,2}))?(?:[-/](\d{1,2}))?/);if(m)return new Date(Date.UTC(+m[1],(+(m[2]||1))-1,+(m[3]||1)));const d=new Date(s);return Number.isNaN(d.getTime())?null:d};
const periodKey=o=>{const d=parseDate(dateOf(o));return d?`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`:(dateOf(o)?String(dateOf(o)):'Sem período')};

   const by=o=>{const k=o.category||o.topic||o.channel||titleOf(o);return k};
   const a={},b={};pool.filter(o=>periodKey(o)===latest).forEach(o=>{const k=by(o);a[k]=(a[k]||0)+1});pool.filter(o=>periodKey(o)===previous).forEach(o=>{const k=by(o);b[k]=(b[k]||0)+1});
   [...new Set([...Object.keys(a),...Object.keys(b)])].map(k=>({key:k,current:a[k]||0,previous:b[k]||0,delta:(a[k]||0)-(b[k]||0)})).sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta)).slice(0,5).forEach(x=>temporal.push(x));

  }
  function ensureEvidenceApi() {
    window.PULSE_LOCAL_EVIDENCE = state.items;
    window.PULSE_LOCAL_EVIDENCE_STATS = function () { return { count: state.items.length, characters: state.items.reduce(function (n, x) { return n + (x.summary ? x.summary.chars : 0); }, 0) }; };
    window.PULSE_LOCAL_EVIDENCE_CONTEXT = function () { return state.items.map(function (x, i) { return 'EVIDÊNCIA LOCAL ' + (i + 1) + '\nArquivo: ' + x.name + '\nMétodo: ' + x.method + '\nTipo: estudo fornecido pelo usuário\nConfiança: descritiva\nTópicos: ' + (x.summary.topics.join(', ') || 'não identificados') + '\nTrecho:\n' + x.summary.excerpt; }).join('\n\n').slice(0, 50000); };
  }
  function render() {
    ensureEvidenceApi();
    var list = el('#file-list'); if (!list) return;
    var local = el('#pulse-local-evidence-note');
    if (!local) { local = document.createElement('div'); local.id = 'pulse-local-evidence-note'; local.className = 'pulse-local-note'; list.parentNode.insertBefore(local, list); }
    local.innerHTML = '<strong>SUA BASE LOCAL</strong><span>Estes estudos ficam salvos apenas neste navegador — não são compartilhados com outros usuários.</span>';
    var html = state.items.length ? state.items.map(function (x) { return '<article class="pulse-local-file"><div><strong>' + esc(x.name) + '</strong><small>' + esc(x.method) + ' · ' + x.summary.chars + ' caracteres · ' + esc(x.summary.topics.join(', ') || 'tópicos não identificados') + '</small></div><button type="button" class="secondary" data-pulse-local-remove="' + esc(x.id) + '">Remover</button></article>'; }).join('') : '<span class="file-list-empty">Nenhum estudo local adicionado.</span>';
    list.innerHTML = html + '<button type="button" class="secondary pulse-local-clear" id="pulse-local-clear">Limpar toda a base local</button>';
    var clearBtn = el('#pulse-local-clear'); if (clearBtn) clearBtn.addEventListener('click', function () { clear().then(load); });

  }
  function load() { return all().then(function (items) { state.items = items; render(); }); }

    return Array.prototype.reduce.call(files, function (chain, file) { return chain.then(function () { return extract(file).then(function (result) { if (!result.text && result.method === 'reference-only') return digest(file.name + '|' + file.size).then(function (id) { return put({ id: id, name: file.name, type: file.type || '', size: file.size, method: result.method, summary: { excerpt: 'Referência adicionada sem extração nesta fase.', sentences: [], topics: [], chars: 0 }, provenance: { sourceName: file.name, evidenceType: 'user-provided-study', extractionMethod: result.method, confidence: 'descriptive' }, processedAt: new Date().toISOString() }); }); var summary = summarize(result.text); return digest(file.name + '|' + file.size + '|' + result.text).then(function (id) { return put({ id: id, name: file.name, type: file.type || '', size: file.size, method: result.method, summary: summary, provenance: { sourceName: file.name, evidenceType: 'user-provided-study', extractionMethod: result.method, confidence: 'descriptive' }, processedAt: new Date().toISOString() }); }); }); }); }, Promise.resolve()).then(load);
  }
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'pulse-files' && e.target.files && e.target.files.length) ingest(e.target.files).catch(function (err) { console.error('[Pulse Local Evidence]', err); alert('Não foi possível processar este arquivo. ' + (err.message || 'Verifique o formato.')); }); }, true);
  window.PULSE_LOCAL_INGEST = ingest;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load); else load();
})();
</script>
<script data-pulse-inline="pulse-local-answer-bridge.js">
/* Shopplosion Pulse — local evidence answer rendering */
(function () {
  'use strict';
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function install() {
    var original = window.pulseRenderCustomAnswer;
    if (typeof original !== 'function' || original.__pulseLocalWrapped) return;
    function wrapped() {
      var box = document.getElementById('pulse-question'), body = document.getElementById('pulse-custom-body'), title = document.getElementById('pulse-custom-title'), subtitle = document.getElementById('pulse-custom-subtitle');
      var question = box ? box.value : '', match = typeof window.pulseMatchEvidence === 'function' ? window.pulseMatchEvidence(question) : null;
      if (!match || !match.localStudy) return original();
      if (title) title.textContent = 'Fato → Contexto → Interpretação → Hipótese → Ação';
      if (subtitle) subtitle.textContent = 'Resposta composta com evidência da sua base local para: “' + esc(question) + '”';
      if (!body) return;
      var source = match.fonte || match.sourceName || 'Arquivo local';
      var period = match.periodo || 'Base local';
      body.innerHTML = '<div class="box"><span class="confidence pulse-source-local">SUA BASE LOCAL · DESCRITIVA</span><h2>FATO</h2><p>' + esc(match.fato) + '</p><div class="source-line">Fonte: ' + esc(source) + ' · Período: ' + esc(period) + ' · Confiança: descritiva</div></div>' +
        '<div class="box"><h2>CONTEXTO</h2><p>' + esc(match.contexto) + '</p></div>' +
        '<div class="box"><h2>INTERPRETAÇÃO</h2><p>O trecho foi extraído do arquivo local e não recebe uma interpretação automática apresentada como fato.</p></div>' +
        '<div class="hypo"><b>HIPÓTESE A VALIDAR</b><p>Valide esta leitura contra outras evidências, metodologia do estudo e contexto da categoria antes de tomar uma decisão.</p></div>' +
        '<div class="box"><h2>AÇÃO SUGERIDA</h2><p>Use o estudo como evidência proprietária e compare-o com a base pública do Pulse para investigar convergências e divergências.</p></div>';
    }
    wrapped.__pulseLocalWrapped = true;
    window.pulseRenderCustomAnswer = wrapped;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(install, 0); }); else setTimeout(install, 0);
})();
</script>
<script data-pulse-inline="pulse-study-format-extensions.js">
/* Shopplosion Pulse — study format extensions v2 */
(() => {
  'use strict';
  const DB='shopplosion-pulse-studies', STORE='studies', MAX_CHARS=18000;
  const IMAGE_TYPES=new Set(['image/png','image/jpeg','image/jpg','image/webp','image/gif']);
  const isPptx=f=>/\.pptx$/i.test(f.name)||f.type==='application/vnd.openxmlformats-officedocument.presentationml.presentation';
  const isImage=f=>IMAGE_TYPES.has((f.type||'').toLowerCase())||/\.(png|jpe?g|webp|gif)$/i.test(f.name);
  const normalize=s=>String(s||'').replace(/\u0000/g,' ').replace(/\s+/g,' ').trim();
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const openDb=()=>new Promise((resolve,reject)=>{const r=indexedDB.open(DB,2);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
  const put=async item=>{const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});};
  const getAll=async()=>{const db=await openDb();return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});};
  const refresh=()=>{window.PULSE_STUDY_REFRESH?.();window.dispatchEvent(new CustomEvent('pulse:studies-updated'));};
  const decode=b=>new TextDecoder('utf-8',{fatal:false}).decode(b);
  const u16=(v,o)=>v.getUint16(o,true), u32=(v,o)=>v.getUint32(o,true);

    const bytes=new Uint8Array(buffer), view=new DataView(buffer), files=[];

      if(u32(view,o)!==0x04034b50){o++;continue;}

  }

    const zip=await unzipPptx(await file.arrayBuffer());

  };
  const makeStudy=async(file,text,method,evidence)=>{const clean=normalize(text).slice(0,MAX_CHARS),id=await hash([file.name,file.size,clean].join('|'));const sentences=clean.split(/(?<=[.!?])\s+/).filter(s=>s.length>35).slice(0,8);return{id,name:file.name,type:file.type||'application/octet-stream',size:file.size,lastModified:file.lastModified,summary:{excerpt:clean,sentences,keywords:[],topics:[],claims:sentences.map((text,i)=>({id:'claim-'+(i+1),text,topics:[],polarity:'neutral',type:'observed-text',support:evidence})),chars:clean.length,extraction:method},processedAt:new Date().toISOString(),provenance:{sourceName:file.name,extractionMethod:method,evidenceType:evidence,confidence:method==='pptx-text'?'descriptive':'visual-reference'}};};
  const notice=(file,method)=>{const host=document.querySelector('#pulse-study-intelligence');if(!host)return;const msg=method==='pptx-text'?'PPTX processado localmente: texto das lâminas foi extraído sem envio externo.':'Imagem processada como evidência visual local. OCR não está disponível neste runtime; nenhum texto foi inventado.';const node=document.createElement('div');node.style.cssText='margin-top:8px;padding:8px;border:1px solid #e5e7eb;border-radius:8px;background:#f8fafc;';node.innerHTML='<b>'+esc(file.name)+'</b> — '+esc(msg);host.appendChild(node);};
  const processSpecial=async file=>{const pptx=isPptx(file),image=isImage(file);if(!pptx&&!image)return false;try{const text=pptx?await extractPptx(file):await imageDescriptor(file);const study=await makeStudy(file,text,pptx?'pptx-text':'visual-reference',pptx?'user-provided-study':'user-provided-image');await put(study);window.PULSE_STUDIES=await getAll();window.PULSE_ACTIVE_STUDY_CONTEXT=typeof window.PULSE_STUDY_CONTEXT==='function'?window.PULSE_STUDY_CONTEXT():'';notice(file,pptx?'pptx-text':'visual-reference');refresh();return true;}catch(err){console.error('[Pulse Study Formats]',err);return false;}};
  window.addEventListener('change',async e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||input.id!=='pulse-files'||!input.files?.length)return;const special=[...input.files].filter(f=>isPptx(f)||isImage(f));if(!special.length)return;e.stopImmediatePropagation();e.preventDefault();for(const file of special)await processSpecial(file);},true);
  window.PULSE_STUDY_FORMATS={pptx:true,imageVisualReference:true,ocr:false};
})();

</script>
