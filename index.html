oria":"varejo","tipo":"PMC","fato":"O volume de vendas de hipermercados, supermercados, produtos alimentícios, bebidas e fumo cresceu 1,3% em abril de 2026 frente a março, com ajuste sazonal.","contexto":"Pesquisa Mensal de Comércio do IBGE; Brasil.","interpretacao":"A atividade cresceu na margem em abril e acumulava alta de 1,6% no ano até abril.","hipotese":"Investigar a relação entre evolução do varejo alimentar e pressão de preços de alimentos.","acao":"Cruzar PMC com IPCA Alimentação e bebidas.","fonte":"IBGE — PMC de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47174-em-abril-vendas-no-varejo-recuam-1-5","periodo":"2026-04","confianca":"ALTA"},{"id":"ibge-pmc-supermercados-interanual-2026-04","categoria":"varejo","tipo":"PMC","fato":"O volume de vendas de hipermercados, supermercados, produtos alimentícios, bebidas e fumo cresceu 0,9% em abril de 2026 frente a abril de 2025.","contexto":"Pesquisa Mensal de Comércio do IBGE; Brasil.","interpretacao":"A atividade registrou o sexto resultado consecutivo positivo na comparação interanual.","hipotese":"Investigar se o crescimento interanual convive com mudanças de mix e preço.","acao":"Cruzar crescimento de volume com inflação e categorias.","fonte":"IBGE — PMC de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47174-em-abril-vendas-no-varejo-recuam-1-5","periodo":"2026-04 vs 2025-04","confianca":"ALTA"},{"id":"ibge-pmc-atacado-alimentos-2026-04","categoria":"varejo ampliado","tipo":"PMC","fato":"O atacado especializado em produtos alimentícios, bebidas e fumo cresceu 2,0% em abril de 2026 frente a abril de 2025.","contexto":"Pesquisa Mensal de Comércio do IBGE; Brasil.","interpretacao":"O segmento avançou na comparação interanual e acumulava alta de 3,1% no ano até abril.","hipotese":"Investigar se o atacado especializado está capturando mudança de composição dos canais.","acao":"Cruzar atacado, varejo alimentar e preços.","fonte":"IBGE — PMC de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47174-em-abril-vendas-no-varejo-recuam-1-5","periodo":"2026-04 vs 2025-04","confianca":"ALTA"},{"id":"ibge-pmc-sp-2026-04","categoria":"São Paulo","tipo":"PMC","fato":"O comércio varejista de São Paulo cresceu 1,3% em abril de 2026 frente a março, na série com ajuste sazonal.","contexto":"Pesquisa Mensal de Comércio do IBGE; Unidade da Federação.","interpretacao":"São Paulo esteve entre as UFs com resultado positivo na margem em abril.","hipotese":"Investigar diferenças regionais na resposta do varejo alimentar.","acao":"Comparar São Paulo com Brasil e outras UFs.","fonte":"IBGE — PMC de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47174-em-abril-vendas-no-varejo-recuam-1-5","periodo":"2026-04","confianca":"ALTA"},{"id":"niq-full-view-2026-volume","categoria":"volume","tipo":"NIQ Full View 2026","fato":"70% das categorias monitoradas registraram queda de volume no 1T26 vs 1T25.","contexto":"NIQ Full View 2026; Brasil; comparação interanual do 1T26.","interpretacao":"A pressão sobre volume segue estrutural e combina múltiplas forças de orçamento, preço e canal.","hipotese":"O shopper está protegendo orçamento por meio de downtrading, menor quantidade e mudança de canal.","acao":"Cruzar volume com preço, promoção, pack e canal por categoria.","fonte":"NielsenIQ — Full View 2026","url":"https://nielseniq.com/global/pt/insights/analysis/2026/as-cinco-forcas-que-atuam-na-queda-de-volume/","periodo":"2026-1T","confianca":"ALTA"},{"id":"niq-full-view-2026-price","categoria":"shopper","tipo":"NIQ Full View 2026","fato":"66% dos consumidores buscam opções de menor preço e 45% escolhem o produto mais barato independentemente da marca.","contexto":"NIQ Full View 2026; Brasil.","interpretacao":"Preço e acessibilidade ganharam peso na escolha, pressionando a faixa mainstream.","hipotese":"Promoção, private label e formatos econômicos podem capturar parte da demanda sensível a preço.","acao":"Mapear elasticidade, arquitetura de preço e pack por categoria.","fonte":"NielsenIQ — Full View 2026","url":"https://nielseniq.com/global/pt/insights/analysis/2026/as-cinco-forcas-que-atuam-na-queda-de-volume/","periodo":"2026","confianca":"ALTA"},{"id":"niq-ecommerce-2026","categoria":"e-commerce","tipo":"NIQ Full View 2026","fato":"As vendas de FMCG online cresceram 34% e atingiram R$ 17,2 bilhões; 88% dos consumidores já compram FMCG pela internet.","contexto":"NIQ Full View 2026; Brasil.","interpretacao":"O e-commerce deixou de ser canal marginal e passou a participar da jornada de compra.","hipotese":"Disponibilidade, preço competitivo e conveniência podem deslocar parte das compras do físico para o digital.","acao":"Cruzar penetração online, sortimento, preço e frequência por categoria.","fonte":"NielsenIQ — Full View 2026","url":"https://nielseniq.com/global/pt/insights/analysis/2026/as-cinco-forcas-que-atuam-na-queda-de-volume/","periodo":"2026","confianca":"ALTA"},{"id":"worldpanel-ecommerce-2025","categoria":"e-commerce","tipo":"Brand Footprint 2026","fato":"45,4% dos lares brasileiros compraram FMCG via e-commerce em 2025, contra 31,1% em 2024 e 23,8% em 2023.","contexto":"Worldpanel by Numerator; 11.300 lares e sete regiões, representando 82% da população domiciliar.","interpretacao":"A penetração do canal avançou de forma consistente e alcançou novos perfis de shopper.","hipotese":"A expansão do canal aumenta a importância de presença omnicanal para aquisição e frequência.","acao":"Monitorar penetração por classe, idade, categoria e canal de acesso.","fonte":"Worldpanel by Numerator — Brand Footprint Brasil 2026","url":"https://worldpanelbynumerator.com/insights/e-commerce-lares-brasileiros-brand-footprint-2026","periodo":"2025; publicado em 21/08/2026","confianca":"ALTA"},{" /* Pulse visual shell: thin trend line using only explicit series/trend values or observed evidence periods. */
(function(){
  'use strict';
  function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function nums(v){return Array.isArray(v)?v.map(Number).filter(Number.isFinite):String(v||'').split(/[,;\s]+/).map(Number).filter(Number.isFinite)}
  function cardSeries(card){
    var attrs=['data-series','data-trend','data-sparkline'];
    for(var i=0;i<attrs.length;i++){
      var raw=card.getAttribute(attrs[i]);
      if(raw){try{var parsed=JSON.parse(raw);var values=nums(parsed);if(values.length>=2)return values}catch(e){var fallback=nums(raw);if(fallback.length>=2)return fallback}}
    }
    var pool=window.PULSE_EVIDENCE||window.__PULSE_EVIDENCE||window.PULSE_SOURCES||[];
    if(!Array.isArray(pool)||pool.length<2)return [];
    var label=(card.querySelector('h3,h4,strong,[data-label],.label,.metric-label,.kpi-label')||{}).textContent||'';
    var words=label.toLowerCase().split(/\W+/).filter(function(w){return w.length>3});
    var matched=pool.filter(function(o){var text=[o.category,o.topic,o.channel,o.name,o.title].filter(Boolean).join(' ').toLowerCase();return words.some(function(w){return text.indexOf(w)>=0})});
    if(matched.length<2)matched=pool;
    var periods={};matched.forEach(function(o){var p=o.date||o.published_at||o.publishedAt||o.period||o.year;if(p)periods[String(p)]=(periods[String(p)]||0)+1});
    var keys=Object.keys(periods).sort().slice(-8);if(keys.length<2)return [];
    var out=keys.map(function(k){return periods[k]});return out.some(function(v){return v!==out[0]})?out:[];
  }
  function draw(card){
    if(card.querySelector('.pulse-indicator-sparkline-wrap'))return;
    var values=cardSeries(card);if(values.length<2)return;
    var width=180,height=28,min=Math.min.apply(Math,values),span=Math.max.apply(Math,values)-min||1;
    var path=values.map(function(v,i){var x=i/(values.length-1)*width,y=height-3-(v-min)/span*(height-7);return(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
    var wrap=document.createElement('div');wrap.className='pulse-indicator-sparkline-wrap';wrap.setAttribute('aria-label','Tendência histórica observada');

 const ranked=pool.map((o,i)=>({...o,__score:score(o),__quality:quality(o),__i:i,__period:periodKey(o)})).sort((a,b)=>b.__score-a.__score);
 const groups={}; ranked.forEach(o=>{const k=o.category||o.topic||o.channel||'Geral';(groups[k]??=[]).push(o)});
 const opportunities=Object.entries(groups).map(([key,v])=>({key,score:Math.round(v.reduce((a,x)=>a+x.__score,0)/v.length),count:v.length,quality:Math.round(v.reduce((a,x)=>a+x.__quality,0)/v.length),top:v[0]})).sort((a,b)=>b.score-a.score).slice(0,5);
 const periods=[...new Set(pool.map(periodKey).filter(x=>x!=='Sem período'))].sort();
 const latest=periods.at(-1), previous=periods.at(-2);
 const temporal=[];
 if(latest&&previous){
   const by=o=>{const k=o.category||o.topic||o.channel||titleOf(o);return k};
   const a={},b={};pool.filter(o=>periodKey(o)===latest).forEach(o=>{const k=by(o);a[k]=(a[k]||0)+1});pool.filter(o=>periodKey(o)===previous).forEach(o=>{const k=by(o);b[k]=(b[k]||0)+1});
   [...new Set([...Object.keys(a),...Object.keys(b)])].map(k=>({key:k,current:a[k]||0,previous:b[k]||0,delta:(a[k]||0)-(b[k]||0)})).sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta)).slice(0,5).forEach(x=>temporal.push(x));
 }
 return{pool,ranked,opportunities,periods,latest,previous,temporal};
}
function render(){

 const recommendations=d.opportunities.slice(0,3).map(x=>`<div class="pulse-v6-row"><b>${esc(x.key)}</b><small>Próximo passo: validar a oportunidade com evidências específicas, contexto da categoria e impacto potencial antes de recomendar ação.</small></div>`).join('');
 const temporal=d.temporal.length?d.temporal.map(x=>`<div class="pulse-v6-row"><b>${esc(x.key)}</b><span>${x.delta>0?'+':''}${x.delta}</span><small>${esc(d.previous)} → ${esc(d.latest)} · contagem observada: ${x.previous} → ${x.current}. Isso não implica causalidade.</small></div>`).join(''):`<p>Ainda não há dois períodos comparáveis suficientes para afirmar mudança temporal.</p>`;

 el.innerHTML=`<div class="pulse-v6-head"><div><div class="pulse-v6-kicker">PULSE INTELLIGENCE LAB · EVOLUÇÃO</div><h2>Da evidência à decisão</h2><p>Scores transparentes e heurísticos. Não representam significância estatística, causalidade ou probabilidade.</p></div><div class="pulse-v6-actions"><button type="button" id="pulse-v6-copy">Copiar leitura</button><button type="button" id="pulse-v6-print">Visão executiva</button></div></div>${exec}<div class="pulse-v6-grid"><article><h3>Signal Score</h3>${d.ranked.slice(0,5).map((x,i)=>`<div class="pulse-v6-row"><b>${i+1}. ${esc(titleOf(x))}</b><span>${x.__score}/100</span><small>qualidade: ${x.__quality}/100 · ${qualityBand(x.__quality)}</small></div>`).join('')}</article><article><h3>Oportunidades prioritárias</h3>${d.opportunities.map(x=>`<div class="pulse-v6-row"><b>${esc(x.key)}</b><span>${x.score}/100</span><small>${x.count} evidência(s) · qualidade média ${x.quality}/100</small></div>`).join('')}</article><article><h3>Qualidade das evidências</h3><p>Metadados observáveis determinam o score: fonte, data, título, conteúdo, categoria, região/canal.</p><div class="pulse-v6-quality">${['Alta','Moderada','Baixa','Insuficiente'].map(b=>`<span><b>${b}</b> ${d.ranked.filter(x=>qualityBand(x.__quality)===b).length}</span>`).join('')}</div></article><article><h3>Comparação temporal</h3>${d.previous&&d.latest?`<p><b>${esc(d.previous)} → ${esc(d.latest)}</b></p>${temporal}`:temporal}</article><article class="pulse-v6-wide"><h3>Próximas ações de investigação</h3>${recommendations}</article></div>`;
 document.body.appendChild(el);
 document.getElementById('pulse-v6-print')?.addEventListener('click',()=>window.print());
 document.getElementById('pulse-v6-copy')?.addEventListener('click',async()=>{const text=`Leitura executiva\n${d.opportunities.slice(0,3).map((x,i)=>`${i+1}. ${x.key} — ${x.score}/100`).join('\n')}\n\nScores heurísticos; validar antes de concluir.`;try{await navigator.clipboard.writeText(text);document.getElementById('pulse-v6-copy').textContent='Copiado';setTimeout(()=>document.getElementById('pulse-v6-copy').textContent='Copiar leitura',1400)}catch(e){}});
}
const css=document.createElement('style');css.textContent='#pulse-v6-lab{margin:32px auto;max-width:1180px;padding:28px;border:1px solid rgba(20,20,20,.12);border-radius:22px;background:#fff;box-shadow:0 12px 36px rgba(0,0,0,.06);font-family:inherit}.pulse-v6-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.pulse-v6-head h2{margin:5px 0;font-size:26px}.pulse-v6-head p{margin:0;opacity:.7}.pulse-v6-actions{display:flex;gap:8px;flex-wrap:wrap}.pulse-v6-actions button{border:1px solid rgba(20,20,20,.15);border-radius:10px;padding:9px 12px;background:#fff;cursor:pointer}.pulse-v6-exec{margin-top:18px;padding:16px;border-radius:14px;background:rgba(20,20,20,.045)}.pulse-v6-exec p{margin:6px 0 0}.pulse-v6-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.pulse-v6-grid article{border:1px solid rgba(20,20,20,.1);border-radius:16px;padding:18px}.pulse-v6-grid h3{margin:0 0 12px}.pulse-v6-row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:10px 0;border-top:1px solid rgba(20,20,20,.08)}.pulse-v6-row span{font-weight:800}.pulse-v6-row small{grid-column:1/-1;opacity:.62}.pulse-v6-wide{grid-column:1/-1}.pulse-v6-quality{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pulse-v6-quality span{padding:10px;border-radius:10px;background:rgba(20,20,20,.045);display:flex;flex-direction:column;gap:2px}@media(max-width:760px){.pulse-v6-head{flex-direction:column}.pulse-v6-grid{grid-template-columns:1fr}.pulse-v6-wide{grid-column:auto}.pulse-v6-quality{grid-template-columns:repeat(2,1fr)}}@media print{#pulse-v6-lab{box-shadow:none;border:0}#pulse-v6-actions,#pulse-v6-copy,#pulse-v6-print{display:none}.pulse-v6-wide{grid-column:1/-1}}';document.head.appendChild(css);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render,{once:true});else render();
})();

<script data-pulse-inline="pulse-studies.js">
/* Shopplosion Pulse — study intelligence v4
 * Client-side, privacy-first processing. Files stay in the browser.
 * Produces provenance-rich, claim-oriented evidence blocks for Ask AI.
 */
(() => {
  'use strict';
  const DB='shopplosion-pulse-studies',STORE='studies',MAX_CHARS=18000;
  const state={studies:[],ready:false};
  const openDb=()=>new Promise((resolve,reject)=>{const req=indexedDB.open(DB,2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
  const tx=async(mode,fn)=>{const db=await openDb();return new Promise((resolve,reject)=>{const t=db.transaction(STORE,mode),s=t.objectStore(STORE);let result;try{result=fn(s);}catch(e){reject(e);return}t.oncomplete=()=>resolve(result);t.onerror=()=>reject(t.error);});};
  const put=item=>tx('readwrite',s=>s.put(item)),removeAll=()=>tx('readwrite',s=>s.clear());
  const all=()=>new Promise(async(resolve,reject)=>{try{const db=await openDb(),r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)}catch(e){reject(e)}});
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const normalize=s=>String(s||'').replace(/\u0000/g,' ').replace(/\s+/g,' ').trim();
  const hash=async text=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
  const csvToText=text=>text.split(/\r?\n/).filter(Boolean).slice(0,500).map(r=>r.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(x=>x.replace(/^\"|\"$/g,'').replace(/\"\"/g,'\"')).join(' | ')).join('\n');
  const extractPdf=async file=>{if(window.pdfjsLib){const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,parts=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),tc=await page.getTextContent();parts.push('Página '+p+': '+tc.items.map(x=>x.str||'').join(' '));if(parts.join(' ').length>=MAX_CHARS)break}return parts.join('\n')}const raw=new TextDecoder('latin1').decode(await file.arrayBuffer()),strings=[],re=/\((?:\\.|[^()\\])*\)/g;for(const m of raw.matchAll(re)){const v=m[0].slice(1,-1).replace(/\\([\\()])/g,'$1').replace(/\\[nrt]/g,' ');if(/[A-Za-zÀ-ÿ]{3,}/.test(v))strings.push(v)}return strings.join(' ')};
  const extractSheet=async file=>{if(!window.XLSX)throw new Error('SheetJS não carregado');const wb=window.XLSX.read(await file.arrayBuffer(),{dense:true,cellFormula:false});return wb.SheetNames.map(name=>{const ws=wb.Sheets[name],rows=window.XLSX.utils.sheet_to_json(ws,{header:1,defval:''});return 'Planilha: '+name+'\n'+rows.slice(0,500).map(r=>r.map(v=>String(v)).join(' | ')).join('\n')}).join('\n\n').slice(0,MAX_CHARS)};
  const extract=async file=>{const type=(file.type||'').toLowerCase(),name=file.name||'';if(type==='application/pdf'||/\.pdf$/i.test(name))return extractPdf(file);if(/\.(xlsx|xls|xlsm|xlsb)$/i.test(name)||type.includes('spreadsheet')||type.includes('excel'))return extractSheet(file);const raw=await file.text();if(type.includes('json')||/\.json$/i.test(name)){try{return JSON.stringify(JSON.parse(raw),null,2)}catch(_){return raw}}if(type.includes('csv')||/\.(csv|tsv)$/i.test(name))return csvToText(raw);return raw};
  const STOP=new Set('sobre entre todos todas foram pelos pelas para como mais muito esta este esse essa seus suas uma umas dos das que com sem por nos nas pela pelo from that which their there these those and the with this have has porque quando onde também ainda sendo eram'.split(' '));
  const topicRules=[['preço',/preço|preco|promoção|promocao|desconto|barato|caro/],['canal',/canal|varejo|atacarejo|supermercado|e-commerce|ecommerce/],['shopper',/shopper|consumidor|compra|comprador|jornada/],['marca',/marca|brand|concorr/],['produto',/produto|categoria|sortimento|embalagem/]];
  const detectTopics=clean=>topicRules.filter(([,re])=>re.test(clean.toLowerCase())).map(([x])=>x);
  const claimPolarity=sentence=>{const s=sentence.toLowerCase();if(/(não|nao|menor|queda|caiu|cai|reduz|redução|reducao|fraco|negativo|não valoriz|nao valoriz|não influencia|nao influencia)/.test(s))return'negative';if(/(aument|cresce|cresceu|crescimento|maior|forte|positivo|valoriza|valorizam|influencia|preferem|preferência|preferencia)/.test(s))return'positive';return'neutral'};
  const extractClaims=(sentences,topics)=>sentences.slice(0,8).map((text,index)=>({id:'claim-'+(index+1),text,topics:topics.filter(topic=>topicRules.find(([name])=>name===topic)?.[1].test(text.toLowerCase())),polarity:claimPolarity(text),type:'observed-text',support:'user-provided-study'}));
  const summarize=text=>{const clean=normalize(text).slice(0,MAX_CHARS),sentences=clean.split(/(?<=[.!?])\s+/).filter(s=>s.length>35).slice(0,10),words=(clean.toLowerCase().match(/[a-zà-ÿ]{4,}/g)||[]).filter(w=>!STOP.has(w)),counts=new Map();for(const w of words)counts.set(w,(counts.get(w)||0)+1);const keywords=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,30).map(([w])=>w),topics=detectTopics(clean);return{excerpt:clean,sentences,keywords,topics,claims:extractClaims(sentences,topics),chars:clean.length,extraction:clean?'textual':'empty'}};
  const fingerprint=async(name,size,text)=>hash([name,size,normalize(text)].join('|'));
  const findContradictions=()=>{const claims=state.studies.flatMap(s=>(s.summary?.claims||[]).map(c=>({...c,source:s.name}))),pairs=[];for(let i=0;i<claims.length;i++)for(let j=i+1;j<claims.length;j++){const a=claims[i],b=claims[j];if(a.source===b.source||a.polarity==='neutral'||b.polarity==='neutral'||a.polarity===b.polarity)continue;const shared=(a.topics||[]).filter(t=>(b.topics||[]).includes(t));if(shared.length)pairs.push({topic:shared[0],left:a,right:b,type:'potential-contradiction'})}return pairs.slice(0,12)};
  const ensurePanel=()=>{let panel=document.querySelector('#pulse-study-intelligence');if(panel)return panel;panel=document.createElement('aside');panel.id='pulse-study-intelligence';panel.setAttribute('aria-live','polite');panel.style.cssText='margin:12px 0;padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;font:13px/1.45 system-ui,sans-serif;';const target=document.querySelector('#file-list')||document.querySelector('#pulse-files')?.parentElement;if(target?.parentElement)target.parentElement.insertBefore(panel,target.nextSibling);else document.body.appendChild(panel);return panel};
  const render=()=>{const panel=ensurePanel(),n=state.studies.length,contradictions=findContradictions();panel.innerHTML='<strong>Inteligência dos estudos</strong><div style="margin-top:4px">'+(n?n+' estudo(s) processado(s) localmente e disponível(is) para o Ask AI.':'Nenhum estudo processado. As perguntas usam apenas a base padrão do Pulse.')+'</div>'+(n?'<ul style="margin:8px 0 0;padding-left:18px">'+state.studies.map(s=>'<li><b>'+esc(s.name)+'</b> — '+esc(s.summary.sentences[0]||s.summary.excerpt.slice(0,180)||'conteúdo extraído')+'<br><small>Tópicos: '+esc((s.summary.topics||[]).join(', ')||'não identificados')+' · '+(s.summary.claims?.length||0)+' achados estruturados · '+s.summary.chars+' caracteres · '+esc(s.provenance?.extractionMethod||'textual')+'</small></li>').join('')+'</ul>':'')+(contradictions.length?'<div style="margin-top:10px"><b>Possíveis divergências entre estudos</b><ul style="margin:6px 0 0;padding-left:18px">'+contradictions.map(c=>'<li><small><b>'+esc(c.topic)+'</b>: '+esc(c.left.source)+' ↔ '+esc(c.right.source)+' — requer revisão humana.</small></li>').join('')+'</ul></div>':'')};
  const load=async()=>{state.studies=await all();state.ready=true;render();window.PULSE_STUDIES=state.studies;window.PULSE_LOCAL_EVIDENCE=state.studies};
  const processFiles=async files=>{const existing=new Set(state.studies.map(s=>s.id));for(const file of files){let text='';let method='textual';try{text=await extract(file);method=/\.pdf$/i.test(file.name)?'pdfjs-text':/\.(xlsx|xls|xlsm|xlsb)$/i.test(file.name)?'sheetjs-text':'textual'}catch(err){console.error('[Pulse Studies] extração',file.name,err);continue}const summary=summarize(text);if(!summary.excerpt)continue;const id=await fingerprint(file.name,file.size,text);if(existing.has(id))continue;await put({id,name:file.name,type:file.type||'application/octet-stream',size:file.size,lastModified:file.lastModified,summary,processedAt:new Date().toISOString(),provenance:{sourceName:file.name,extractionMethod:method,evidenceType:'user-provided-study',confidence:'descriptive'}});existing.add(id)}await load()};
  const studyContext=()=>state.studies.map((s,i)=>{const topic=(s.summary.topics||[]).join(', ')||'não identificado',claims=(s.summary.claims||[]).map(c=>'- '+c.text+' ['+c.polarity+'; '+((c.topics||[]).join(', ')||'sem tópico')+']').join('\n');return'EVIDÊNCIA '+(i+1)+'\nFonte: '+s.name+'\nTipo: estudo fornecido pelo usuário\nExtração: '+(s.provenance?.extractionMethod||'textual')+'\nConfiança: descritiva (não implica validade estatística)\nTópicos detectados: '+topic+'\nAchados estruturados:\n'+(claims||'- nenhum achado estruturado')+'\nTrecho extraído:\n'+s.summary.excerpt}).join('\n\n').slice(0,40000);
  const getAskField=()=>[...document.querySelectorAll('textarea,input[type="text"]')].filter(el=>el.offsetParent!==null).sort((a,b)=>(b.value||'').length-(a.value||'').length)[0];
  const augmentAsk=()=>{if(!state.studies.length)return;const field=getAskField();if(!field||!field.value.trim())return;field.dataset.pulseStudyContext=studyContext();field.dispatchEvent(new Event('input',{bubbles:true}));window.PULSE_ACTIVE_STUDY_CONTEXT=studyContext()};
  document.addEventListener('change',async e=>{const input=e.target;if(!(input instanceof HTMLInputElement)||input.id!=='pulse-files')return;if(!input.files?.length){await removeAll();await load();window.PULSE_ACTIVE_STUDY_CONTEXT='';return}try{await processFiles([...input.files])}catch(err){console.error('[Pulse Studies] processamento falhou',err)}},true);
  document.addEventListener('click',e=>{const el=e.target.closest('button,[role="button"],input[type="submit"]');if(!el)return;const label=normalize(el.textContent||el.value||'').toLowerCase();if(/(ask ai|perguntar|pergunta|investigar|analisar|ask)/i.test(label))augmentAsk()},true);
  window.PULSE_STUDY_CONTEXT=studyContext;window.PULSE_STUDY_CLAIMS=()=>state.studies.flatMap(s=>(s.summary?.claims||[]).map(c=>({...c,source:s.name})));window.PULSE_STUDY_CONTRADICTIONS=findContradictions;window.PULSE_CLEAR_STUDIES=async()=>{await removeAll();await load();window.PULSE_ACTIVE_STUDY_CONTEXT=''};window.PULSE_STUDY_STATS=()=>({count:state.studies.length,characters:state.studies.reduce((n,s)=>n+(s.summary?.chars||0),0),claims:state.studies.reduce((n,s)=>n+(s.summary?.claims?.length||0),0),topics:[...new Set(state.studies.flatMap(s=>s.summary?.topics||[]))],contradictions:findContradictions().length});
  load().catch(err=>console.error('[Pulse Studies] inicialização falhou',err));
})();
