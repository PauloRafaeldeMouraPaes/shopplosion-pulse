<title>Pulse — Brasil Market Intelligence</title>
<style>
:root{--ink:#111827;--muted:#667085;--line:#e6e8ef;--soft:#faf8fb;--pink:#e91e73;--yellow:#ffc928;--navy:#0b1730;--blue:#28447e;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}body{padding-bottom:0}
button,a{font:inherit}a{text-decoration:none;color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:218px 1fr}
.sidebar{border-right:1px solid var(--line);background:#fff;padding:24px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;margin-bottom:40px}.brandMark{width:30px;height:30px;border-radius:10px;background:var(--yellow);display:grid;place-items:center;font-weight:950}
.sideNav{display:grid;gap:6px}.sideNav a{padding:13px 12px;border-radius:12px;color:#4d5362;font-weight:700}.sideNav a.active{background:#fff0f6;color:var(--pink)}
.main{min-width:0}.crumb{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;color:#697080;font-weight:700}.crumb b{color:var(--ink);margin-left:10px}
.header{padding:28px 40px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}.logos{display:flex;align-items:center;gap:28px}.shop{font-size:25px;font-weight:950;color:#ec1980;letter-spacing:-1.5px}.pulse{font-size:20px;font-weight:900}.pulse small{font-size:11px;color:#98a1b4;font-weight:650;margin-left:8px;letter-spacing:.3px}.universe{font-weight:750;color:#454c5d}.universe span{font-weight:900}
.context{height:54px;background:#fff7fb;border-block:1px solid #f0dfe7;padding:0 32px;display:flex;align-items:center;gap:18px}.context b{color:var(--pink)}
.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 189px)}
.journey{background:var(--navy);padding:24px 14px;color:#d9e0ef}.journey h3{font-size:12px;letter-spacing:1.4px;margin:0 10px 18px;color:#9da9c1}.step{display:block;padding:13px 10px;border-radius:12px;margin-bottom:5px}.step strong{display:block;font-size:14px;color:#e9edf6}.step span{font-size:12px;color:#8f9bb4;display:block;margin-top:4px}.step.active{background:var(--blue)}.step.active strong,.step.active span{color:#fff}.journey-step.is-current b{color:#fff!important}
.content{padding:38px 34px 70px;max-width:1160px;width:100%;margin:0 auto}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.2px;color:var(--pink)}h1{font-size:clamp(34px,5vw,58px);line-height:.98;letter-spacing:-2.5px;margin:8px 0 12px}.intro{font-size:17px;color:var(--muted);max-width:760px;line-height:1.55;margin:0 0 28px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.metric,.card{border:1px solid var(--line);border-radius:16px;background:#fff}.metric{padding:18px}.metric small{color:var(--muted);font-weight:750}.metric strong{display:block;font-size:25px;margin-top:7px}
.canvas{border:1px solid #dfe3ea;border-radius:18px;padding:22px;background:#fff;box-shadow:0 8px 25px rgba(17,24,39,.04)}.canvasTop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.canvas h2{margin:0;font-size:22px}.canvas p{color:var(--muted);line-height:1.5}.badge{font-size:11px;font-weight:850;color:#6b7280;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.op{padding:20px;border:1px solid #e1e4ea;border-radius:15px}.op.primary{border:2px solid #ef9fc0}.op .priority{font-size:11px;font-weight:950;letter-spacing:1px;color:#ad3262}.op h3{font-size:16px;line-height:1.25;margin:9px 0 12px}.op p{font-size:13px;margin:0;color:#626b7d}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tag{padding:6px 9px;border-radius:999px;background:#f5f6f8;font-size:11px;font-weight:800;color:#596170}.next{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;align-items:center}.next span{color:var(--muted);font-size:13px}.next a{background:var(--pink);color:#fff;padding:10px 14px;border-radius:10px;font-weight:850;font-size:12px}
.bottom{display:none}
@media(max-width:800px){
 body{padding-bottom:0}.app{display:block}.sidebar{display:none}.crumb{height:54px;padding:0 24px;font-size:14px}.header{padding:25px 24px 20px;display:block}.logos{justify-content:space-between;gap:12px}.shop{font-size:23px}.pulse{font-size:18px}.pulse small{display:block;margin:3px 0 0;font-size:9px}.universe{margin-top:26px;display:flex;justify-content:space-between}.context{padding:0 24px;height:54px;white-space:nowrap;overflow:hidden}.workspace{display:block;min-height:auto}.journey{display:flex;overflow-x:auto;gap:8px;padding:15px 18px 16px;position:sticky;top:0;z-index:5}.journey h3{display:none}.step{min-width:210px;margin:0;padding:12px 14px}.step strong{font-size:16px}.step span{font-size:12px}.content{padding:28px 20px calc(24px + var(--pulse-bottom-nav-height))}.intro{font-size:16px}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.cards{grid-template-columns:1fr}.canvas{padding:18px}.canvasTop{display:block}h1{font-size:42px;letter-spacing:-1.8px}:root{--pulse-bottom-nav-content:72px;--pulse-bottom-nav-safe:env(safe-area-inset-bottom,0px);--pulse-bottom-nav-height:calc(var(--pulse-bottom-nav-content) + var(--pulse-bottom-nav-safe))}.pv3-active .bottom{display:none!important}.bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;height:var(--pulse-bottom-nav-height);background:rgba(255,255,255,.99);border-top:1px solid var(--line);padding:6px 8px var(--pulse-bottom-nav-safe);z-index:20;box-sizing:border-box}.bottom a{text-align:center;color:#626978;font-size:10px;font-weight:800;padding:9px 2px;border-radius:10px}.bottom a.active{color:var(--pink);background:#fff5f9}.bottom b{display:block;font-size:16px;margin-bottom:2px}
}
*:focus-visible{outline:3px solid var(--pink);outline-offset:3px}@media print{.sidebar,.journey,.bottom{display:none!important}.content{max-width:none;padding:0}.canvas{break-inside:avoid}}
*:focus-visible{outline:3px solid #e51b67;outline-offset:3px}
@media (max-width:720px){
  .bottom{min-height:72px}
  .bottom a,.bottom button{min-height:58px}
  .bottom strong{font-size:16px;line-height:1}
  .bottom span{font-size:11px;line-height:1.1}
  .content{padding-bottom:calc(24px + var(--pulse-bottom-nav-height))}
}
</style>

<script type="application/json" id="pulse-public-evidence-json">[{"id":"ibge-ipca-alimentos-2026-01","categoria":"preços","tipo":"IPCA","fato":"Alimentação e bebidas variou 0,23% em janeiro de 2026.","contexto":"IPCA nacional do IBGE; comparação mensal.","interpretacao":"O grupo teve alta mensal de 0,23% em janeiro.","hipotese":"Investigar quais subitens explicam a pressão de preços no início de 2026.","acao":"Cruzar com categorias e canais de CPG.","fonte":"IBGE — IPCA, 10/02/2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/45832-em-janeiro-ipca-fica-em-0-33","periodo":"2026-01","confianca":"ALTA"},{"id":"ibge-ipca-alimentos-2026-02","categoria":"preços","tipo":"IPCA","fato":"Alimentação e bebidas variou 0,26% em fevereiro de 2026.","contexto":"IPCA nacional do IBGE; comparação mensal.","interpretacao":"A alta do grupo acelerou em relação aos 0,23% registrados em janeiro.","hipotese":"Investigar a persistência da pressão de preços sobre o orçamento do shopper.","acao":"Acompanhar a série mensal e subitens.","fonte":"IBGE — IPCA de março de 2026, tabela de fevereiro","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/46377-em-marco-ipca-vai-a-0-88","periodo":"2026-02","confianca":"ALTA"},{"id":"ibge-ipca-alimentos-2026-03","categoria":"preços","tipo":"IPCA","fato":"Alimentação e bebidas subiu 1,56% em março de 2026.","contexto":"IPCA nacional do IBGE; grupo de maior impacto no mês junto com Transportes.","interpretacao":"O grupo acelerou fortemente em março frente aos 0,26% de fevereiro.","hipotese":"Investigar efeitos da alta de alimentos sobre mix, frequência e ocasião de compra.","acao":"Cruzar inflação de alimentos com indicadores de varejo.","fonte":"IBGE — IPCA de março de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/46377-em-marco-ipca-vai-a-0-88","periodo":"2026-03","confianca":"ALTA"},{"id":"ibge-ipca-alimentos-2026-04","categoria":"preços","tipo":"IPCA","fato":"Alimentação e bebidas subiu 1,34% em abril de 2026.","contexto":"IPCA nacional do IBGE; maior variação entre os grupos no mês.","interpretacao":"O grupo permaneceu em alta, embora abaixo dos 1,56% de março.","hipotese":"Investigar se a desaceleração de preços se traduz em mudança de demanda.","acao":"Comparar preço com volume de vendas.","fonte":"IBGE — IPCA de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/46648-em-abril-ipca-fica-em-0-67","periodo":"2026-04","confianca":"ALTA"},{"id":"ibge-ipca-alimentos-2026-05","categoria":"preços","tipo":"IPCA","fato":"Alimentação e bebidas subiu 1,33% em maio de 2026.","contexto":"IPCA nacional do IBGE; maior variação e impacto entre os grupos no mês.","interpretacao":"A inflação de alimentos permaneceu praticamente no mesmo patamar de abril.","hipotese":"Investigar resiliência de categorias e troca de marcas ou formatos.","acao":"Cruzar preços com desempenho do varejo.","fonte":"IBGE — IPCA de maio de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47088-em-maio-ipca-fica-em-0-58","periodo":"2026-05","confianca":"ALTA"},{"id":"ibge-ipca-alimentos-2026-06","categoria":"preços","tipo":"IPCA","fato":"Alimentação e bebidas caiu 0,24% em junho de 2026.","contexto":"IPCA nacional do IBGE; maior variação negativa entre os grupos no mês.","interpretacao":"O grupo passou de alta de 1,33% em maio para queda de 0,24% em junho.","hipotese":"Investigar se a reversão de preços aparece no comportamento de compra.","acao":"Acompanhar julho e cruzar com volume de varejo.","fonte":"IBGE — IPCA de junho de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47534-ipca-fica-em-0-16-em-junho","periodo":"2026-06","confianca":"ALTA"},{"id":"ibge-pmc-supermercados-2026-04","categoria":"varejo","tipo":"PMC","fato":"O volume de vendas de hipermercados, supermercados, produtos alimentícios, bebidas e fumo cresceu 1,3% em abril de 2026 frente a março, com ajuste sazonal.","contexto":"Pesquisa Mensal de Comércio do IBGE; Brasil.","interpretacao":"A atividade cresceu na margem em abril e acumulava alta de 1,6% no ano até abril.","hipotese":"Investigar a relação entre evolução do varejo alimentar e pressão de preços de alimentos.","acao":"Cruzar PMC com IPCA Alimentação e bebidas.","fonte":"IBGE — PMC de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47174-em-abril-vendas-no-varejo-recuam-1-5","periodo":"2026-04","confianca":"ALTA"},{"id":"ibge-pmc-supermercados-interanual-2026-04","categoria":"varejo","tipo":"PMC","fato":"O volume de vendas de hipermercados, supermercados, produtos alimentícios, bebidas e fumo cresceu 0,9% em abril de 2026 frente a abril de 2025.","contexto":"Pesquisa Mensal de Comércio do IBGE; Brasil.","interpretacao":"A atividade registrou o sexto resultado consecutivo positivo na comparação interanual.","hipotese":"Investigar se o crescimento interanual convive com mudanças de mix e preço.","acao":"Cruzar crescimento de volume com inflação e categorias.","fonte":"IBGE — PMC de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47174-em-abril-vendas-no-varejo-recuam-1-5","periodo":"2026-04 vs 2025-04","confianca":"ALTA"},{"id":"ibge-pmc-atacado-alimentos-2026-04","categoria":"varejo ampliado","tipo":"PMC","fato":"O atacado especializado em produtos alimentícios, bebidas e fumo cresceu 2,0% em abril de 2026 frente a abril de 2025.","contexto":"Pesquisa Mensal de Comércio do IBGE; Brasil.","interpretacao":"O segmento avançou na comparação interanual e acumulava alta de 3,1% no ano até abril.","hipotese":"Investigar se o atacado especializado está capturando mudança de composição dos canais.","acao":"Cruzar atacado, varejo alimentar e preços.","fonte":"IBGE — PMC de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47174-em-abril-vendas-no-varejo-recuam-1-5","periodo":"2026-04 vs 2025-04","confianca":"ALTA"},{"id":"ibge-pmc-sp-2026-04","categoria":"São Paulo","tipo":"PMC","fato":"O comércio varejista de São Paulo cresceu 1,3% em abril de 2026 frente a março, na série com ajuste sazonal.","contexto":"Pesquisa Mensal de Comércio do IBGE; Unidade da Federação.","interpretacao":"São Paulo esteve entre as UFs com resultado positivo na margem em abril.","hipotese":"Investigar diferenças regionais na resposta do varejo alimentar.","acao":"Comparar São Paulo com Brasil e outras UFs.","fonte":"IBGE — PMC de abril de 2026","url":"https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2013-agencia-de-noticias/releases/47174-em-abril-vendas-no-varejo-recuam-1-5","periodo":"2026-04","confianca":"ALTA"},{"id":"niq-full-view-2026-volume","categoria":"volume","tipo":"NIQ Full View 2026","fato":"70% das categorias monitoradas registraram queda de volume no 1T26 vs 1T25.","contexto":"NIQ Full View 2026; Brasil; comparação interanual do 1T26.","interpretacao":"A pressão sobre volume segue estrutural e combina múltiplas forças de orçamento, preço e canal.","hipotese":"O shopper está protegendo orçamento por meio de downtrading, menor quantidade e mudança de canal.","acao":"Cruzar volume com preço, promoção, pack e canal por categoria.","fonte":"NielsenIQ — Full View 2026","url":"https://nielseniq.com/global/pt/insights/analysis/2026/as-cinco-forcas-que-atuam-na-queda-de-volume/","periodo":"2026-1T","confianca":"ALTA"},{"id":"niq-full-view-2026-price","categoria":"shopper","tipo":"NIQ Full View 2026","fato":"66% dos consumidores buscam opções de menor preço e 45% escolhem o produto mais barato independentemente da marca.","contexto":"NIQ Full View 2026; Brasil.","interpretacao":"Preço e acessibilidade ganharam peso na escolha, pressionando a faixa mainstream.","hipotese":"Promoção, private label e formatos econômicos podem capturar parte da demanda sensível a preço.","acao":"Mapear elasticidade, arquitetura de preço e pack por categoria.","fonte":"NielsenIQ — Full View 2026","url":"https://nielseniq.com/global/pt/insights/analysis/2026/as-cinco-forcas-que-atuam-na-queda-de-volume/","periodo":"2026","confianca":"ALTA"},{"id":"niq-ecommerce-2026","categoria":"e-commerce","tipo":"NIQ Full View 2026","fato":"As vendas de FMCG online cresceram 34% e atingiram R$ 17,2 bilhões; 88% dos consumidores já compram FMCG pela internet.","contexto":"NIQ Full View 2026; Brasil.","interpretacao":"O e-commerce deixou de ser canal marginal e passou a participar da jornada de compra.","hipotese":"Disponibilidade, preço competitivo e conveniência podem deslocar parte das compras do físico para o digital.","acao":"Cruzar penetração online, sortimento, preço e frequência por categoria.","fonte":"NielsenIQ — Full View 2026","url":"https://nielseniq.com/global/pt/insights/analysis/2026/as-cinco-forcas-que-atuam-na-queda-de-volume/","periodo":"2026","confianca":"ALTA"},{"id":"worldpanel-ecommerce-2025","categoria":"e-commerce","tipo":"Brand Footprint 2026","fato":"45,4% dos lares brasileiros compraram FMCG via e-commerce em 2025, contra 31,1% em 2024 e 23,8% em 2023.","contexto":"Worldpanel by Numerator; 11.300 lares e sete regiões, representando 82% da população domiciliar.","interpretacao":"A penetração do canal avançou de forma consistente e alcançou novos perfis de shopper.","hipotese":"A expansão do canal aumenta a importância de presença omnicanal para aquisição e frequência.","acao":"Monitorar penetração por classe, idade, categoria e canal de acesso.","fonte":"Worldpanel by Numerator — Brand Footprint Brasil 2026","url":"https://worldpanelbynumerator.com/insights/e-commerce-lares-brasileiros-brand-footprint-2026","periodo":"2025; publicado em 21/08/2026","confianca":"ALTA"},{"id":"worldpanel-whatsapp-2025","categoria":"e-commerce","tipo":"Brand Footprint 2026","fato":"O WhatsApp alcança 21% dos lares brasileiros e Higiene & Beleza representa 50% do faturamento do e-commerce de FMCG.","contexto":"Worldpanel by Numerator; Brasil; dados de 2025.","interpretacao":"A jornada digital combina descoberta/compra por canais conversacionais e forte concentração em H&B.","hipotese":"Categorias de recompra e H&B podem ter maior aderência a jornadas assistidas por mensagem.","acao":"Investigar conversão e frequência em canais conversacionais.","fonte":"Worldpanel by Numerator — Brand Footprint Brasil 2026","url":"https://worldpanelbynumerator.com/insights/e-commerce-lares-brasileiros-brand-footprint-2026","periodo":"2025; publicado em 21/08/2026","confianca":"ALTA"},{"id":"niq-polarization-brazil","categoria":"premiumização","tipo":"A Tale of Two Consumers","fato":"No Brasil, a polarização de preço pende mais para value: premium cresce em categorias específicas, enquanto o mainstream permanece pressionado.","contexto":"NIQ Global Retail; MAT abril de 2026; branded in-store, excluindo private label.","interpretacao":"A premiumização brasileira é seletiva, não uma transformação ampla do mercado.","hipotese":"A melhor resposta de portfólio pode variar por categoria, combinando value e premium em vez de uma estratégia única.","acao":"Segmentar categorias por potencial de premiumização e pressão de value.","fonte":"NielsenIQ — A Tale of Two Consumers","url":"https://nielseniq.com/global/en/insights/report/2026/tale-of-two-consumers/","periodo":"MAT abril/2026","confianca":"ALTA"},{"id":"niq-promo-polarization","categoria":"promoção","tipo":"A Tale of Two Consumers","fato":"A intensidade promocional aumentou no Brasil; entre categorias citadas pela NIQ, bebidas alcoólicas têm 39%, alimentos 35% e bebidas não alcoólicas 34% de valor promocionado.","contexto":"NIQ RMS Multi Country; L52 semanas encerradas em 19/04/2026; produtos de marca, in-store.","interpre os centrais de gestão da pressão de valor no shopper.","hipotese":"Aumento de promoção pode sustentar conversão no curto prazo, mas precisa ser analisado junto a preço-base e elasticidade.","acao":"Separar efeito promocional de preço regular e acompanhar ROI por categoria.","fonte":"NielsenIQ — A Tale of Two Consumers","url":"https://nielseniq.com/global/en/insights/report/2026/tale-of-two-consumers/","periodo":"L52 semanas até 19/04/2026","confianca":"ALTA"},{"id":"niq-private-label-global","categoria":"marcas","tipo":"Private Label Adoption Report","fato":"58% dos consumidores pesquisados dizem não se importar se o produto é de marca nacional ou private label, desde que atenda à necessidade.","contexto":"NIQ & World Data Lab; estudo global, não específico do Brasil.","interpretacao":"A aceitação de private label reforça a necessidade de monitorar valor percebido e arquitetura de preço.","hipotese":"No Brasil, private label pode ganhar espaço onde a diferença de preço for clara e a qualidade percebida for suficiente.","acao":"Usar como sinal global e validar com dados específicos do Brasil antes de extrapolar.","fonte":"NielsenIQ — Private Label Adoption Report","url":"https://nielseniq.com/global/en/news-center/2026/private-label-adoption-report/","periodo":"publicado em 21/08/2026","confianca":"MÉDIA"},{"id":"abras-cesta-julho","categoria":"preços","tipo":"AbrasMercado","fato":"A cesta AbrasMercado de 35 produtos caiu 1,24% em julho, para R$ 841,95; em 12 meses, subiu 3,50%.","contexto":"ABRAS; média nacional; 35 produtos de largo consumo.","interpretacao":"A cesta teve alívio mensal, mas permanece acima do nível de julho de 2025.","hipotese":"A desinflação de itens básicos pode liberar orçamento para outras categorias, embora de forma desigual.","acao":"Cruzar cesta com volume e mix por categoria.","fonte":"ABRAS — AbrasMercado Pesquisa do Mês","url":"https://www.abras.com.br/economia-e-pesquisa/abrasmercado/pesquisa-do-mes","periodo":"Julho/2026; publicado em 2
